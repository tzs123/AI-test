services:
  agent-engine:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: runnergo-agent-engine:local
    restart: unless-stopped
    environment:
      RUNNERGO_AGENT_PORT: "8088"
      RUNNERGO_AGENT_AUTH_REQUIRED: "true"
      RUNNERGO_AGENT_AUTH_VERIFY_URL: http://testhub-backend:8000/api/users/me/
      RUNNERGO_REDIS_ADDR: redis-db:6379
      RUNNERGO_REDIS_PASSWORD: mypassword
      RUNNERGO_AGENT_QUEUE_PREFIX: runnergo:agent
      RUNNERGO_LLM_PROVIDER: local
      RUNNERGO_LLM_MODEL: qwen3:8b
      RUNNERGO_LLM_BASE_URL: http://host.docker.internal:11434
      RUNNERGO_AGENT_TIMEOUT: 600s
      RUNNERGO_AGENT_RETRIES: "2"
      RUNNERGO_AGENT_RETRY_BACKOFF: 100ms
      RUNNERGO_AGENT_PARALLEL: "2"
      # 切换到外部 AI（OpenAI/DeepSeek 等 OpenAI 兼容接口）时：
      #   1. RUNNERGO_LLM_PROVIDER 改为 openai
      #   2. 取消下面两行注释并填入 API Key 和 BaseURL
      #   3. RUNNERGO_LLM_MODEL 改为对应模型名（如 gpt-4o-mini / deepseek-chat）
      # RUNNERGO_LLM_API_KEY: sk-xxx
      # RUNNERGO_LLM_BASE_URL: https://api.openai.com/v1
      RUNNERGO_MYSQL_DSN: root:123456@tcp(mysql-db:3306)/runnergo?charset=utf8mb4&parseTime=True&loc=Local
    networks: [apipost_net]
    depends_on:
      ollama:
        condition: service_healthy

      testhub-backend:
        condition: service_healthy
    ports:
      - "58891:8088"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ./ollama/models:/root/.ollama
    ports: ["58908:11434"]
    networks: [apipost_net]
    healthcheck:
      test: [CMD-SHELL, "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  testhub-frontend:
    image: runnergo-testhub-frontend:local
    restart: unless-stopped
    volumes:
      - ./testhub/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./testhub/frontend-index.html:/usr/share/nginx/html/testhub/index.html:ro
      - ./testhub/module-nav.js:/usr/share/nginx/html/testhub/module-nav.js:ro
      - ./testhub/legacy-api.html:/usr/share/nginx/html/testhub/legacy-api.html:ro
      - ./testhub/legacy-ui.html:/usr/share/nginx/html/testhub/legacy-ui.html:ro
      - ./testhub/legacy-shell.css:/usr/share/nginx/html/testhub/legacy-shell.css:ro
      - ./testhub/theme-sync.js:/usr/share/nginx/html/testhub/theme-sync.js:ro
      - ./testhub/legacy-agent.html:/usr/share/nginx/html/testhub/legacy-agent.html:ro
      - ./testhub/agent:/usr/share/nginx/html/testhub/agent:ro
      - ./testhub/sql-console:/usr/share/nginx/html/testhub/sql-console:ro
      - ./testhub/curl-import:/usr/share/nginx/html/testhub/curl-import:ro
    ports:
      - "9999:80"
      - "58909:80"
    networks: [apipost_net]

  testhub-skill-runner:
    image: runnergo-testhub-skill-runner:local
    restart: unless-stopped
    networks: [apipost_net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  testhub-backend:
    image: runnergo-testhub-backend:local
    platform: linux/amd64
    restart: unless-stopped
    working_dir: /app
    entrypoint: [/app/docker/entrypoint.sh]
    command: [daphne, -b, 0.0.0.0, -p, "8000", backend.asgi:application]
    environment:
      DEBUG: "False"
      SECRET_KEY: runnergo-testhub-local-secret-key-change-me
      DB_ENGINE: sqlite
      SQLITE_DATABASE_PATH: /data/testhub/db.sqlite3
      SQLITE_BUSY_TIMEOUT_SECONDS: "60"
      REDIS_URL: redis://:mypassword@redis-db:6379/1
      APP_PUBLIC_BASE_URL: http://localhost:9999
      ALLOWED_HOSTS: localhost,127.0.0.1,testhub-backend,web-ui
      CORS_ALLOWED_ORIGINS: http://localhost:9999,http://127.0.0.1:9999,http://localhost:58909,http://127.0.0.1:58909
      CSRF_TRUSTED_ORIGINS: http://localhost:9999,http://127.0.0.1:9999,http://localhost:58909,http://127.0.0.1:58909
      APP_USE_HTTPS: "False"
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      CSRF_COOKIE_HTTPONLY: "True"
      SKILL_RUNNER_URL: http://testhub-skill-runner:8080
      SKILL_RUNNER_TOKEN: runnergo-local-skill-token
      TEST_DATA_CENTER_AGENT_TOKEN: runnergo-local-agent-token
      TESTHUB_ACCESS_TOKEN_LIFETIME_DAYS: "3650"
      TESTHUB_REFRESH_TOKEN_LIFETIME_DAYS: "3650"
      AI_SSE_TOKEN_MAX_AGE_SECONDS: "315360000"
      RUNNERGO_MANAGEMENT_API_URL: http://manage:30000/management/api/v1
      AUTO_TEST_AGENT_API_URL: http://auto-test:8000
      # manage 未提供 notice/internal 接口时，App 自动化通知回退直连 runnergo 库读取第三方集成配置
      RUNNERGO_MYSQL_HOST: mysql-db
      RUNNERGO_MYSQL_PORT: "3306"
      RUNNERGO_MYSQL_USER: root
      RUNNERGO_MYSQL_PASSWORD: "123456"
      RUNNERGO_MYSQL_DATABASE: runnergo
      PROMETHEUS_TARGET_DIR: /app/deploy/prometheus/targets
      PROMETHEUS_RELOAD_URL: http://prometheus:9090/-/reload
      AI_OUTBOUND_ALLOWED_HOSTS: ollama
      AI_OUTBOUND_ALLOWED_CIDRS: 172.18.0.0/16
      SECURITY_SCAN_ALLOW_PRIVATE_TARGETS: "True"
      E2E_BROWSER_FALLBACK_CHANNEL: chrome
      E2E_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
      E2E_ACTION_TIMEOUT_MS: "15000"
      E2E_NAVIGATION_TIMEOUT_MS: "30000"
      E2E_PLANNER_TIMEOUT_SECONDS: "90"
      E2E_PAGE_INSPECTION_TIMEOUT_MS: "10000"
      E2E_IGNORE_HTTPS_ERRORS: "False"
      E2E_APPIUM_ALLOWED_HOSTS: 127.0.0.1,localhost,host.docker.internal,testhub-backend,testhub-celery
      TIME_ZONE: Asia/Shanghai
    volumes:
      - ./testhub/backend:/app/backend
      - ./testhub/apps:/app/apps
      # SQLite 为 WAL 模式，必须整目录共享（-wal/-shm 与主文件同目录），否则
      # backend 写入的数据滞留在容器内 WAL，celery/auto-test 读不到新记录。
      - ./testhub/data:/data/testhub
      - ./testhub/data/media:/app/media
      - ./testhub/static_files:/app/static_files
      - ./testhub/logs:/app/logs
      # APP 自动化 Allure 报告依赖宿主机 tools/allure-*（_find_allure_command 会扫描）
      - ./tools:/app/tools:ro
      - ./deploy/prometheus/targets:/app/deploy/prometheus/targets
    ports: ["8000:8000"]
    networks: [apipost_net]
    depends_on:
      testhub-skill-runner:
        condition: service_healthy

    healthcheck:
      test: [CMD-SHELL, "curl -fsS --max-time 3 http://localhost:8000/api/health/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  testhub-celery:
    image: runnergo-testhub-backend:local
    platform: linux/amd64
    restart: unless-stopped
    working_dir: /app
    entrypoint: [/app/docker/entrypoint.sh]
    command: [celery, -A, backend.celery, worker, --loglevel=INFO]
    environment:
      DEBUG: "False"
      SECRET_KEY: runnergo-testhub-local-secret-key-change-me
      DB_ENGINE: sqlite
      SQLITE_DATABASE_PATH: /data/testhub/db.sqlite3
      REDIS_URL: redis://:mypassword@redis-db:6379/1
      ALLOWED_HOSTS: localhost,127.0.0.1,testhub-backend
      APP_USE_HTTPS: "False"
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      SKILL_RUNNER_URL: http://testhub-skill-runner:8080
      # Agent 任务在 celery worker 中执行，必须与 testhub-backend 保持一致，
      # 否则 UI YAML 执行步骤会 SKIPPED（Auto-test 执行服务未配置）→ 任务卡 NEEDS_INPUT
      AUTO_TEST_AGENT_API_URL: http://auto-test:8000
      TEST_DATA_CENTER_AGENT_TOKEN: runnergo-local-agent-token
      TIME_ZONE: Asia/Shanghai
      # App 自动化通知回退直连 runnergo 库读取第三方集成配置（与 testhub-backend 保持一致）
      RUNNERGO_MYSQL_HOST: mysql-db
      RUNNERGO_MYSQL_PORT: "3306"
      RUNNERGO_MYSQL_USER: root
      RUNNERGO_MYSQL_PASSWORD: "123456"
      RUNNERGO_MYSQL_DATABASE: runnergo
    volumes:
      - ./testhub/backend:/app/backend
      - ./testhub/apps:/app/apps
      - ./testhub/data:/data/testhub
      - ./testhub/media:/app/media
      - ./testhub/logs:/app/logs
      # APP 自动化 Allure 报告依赖宿主机 tools/allure-*（与 testhub-backend 保持一致）
      - ./tools:/app/tools:ro
    networks: [apipost_net]
    depends_on:
      testhub-backend:
        condition: service_healthy

  auto-test:
    image: runnergo-auto-test:local
    restart: unless-stopped
    working_dir: /app
    command: [uvicorn, backend.app:app, --host, 0.0.0.0, --port, "8000"]
    environment:
      TEST_DATA_CENTER_API_URL: http://testhub-backend:8000
      TEST_DATA_ASSETS_DB_PATH: /data/testhub/db.sqlite3
      TESTHUB_MEDIA_ROOT: /data/testhub/media
      AI_AGENT_BASE_URL: http://host.docker.internal:11434/v1
      AI_AGENT_MODEL: qwen3:8b
      AI_AGENT_API_KEY: ollama
      # 切换到外部 AI（OpenAI/DeepSeek 等 OpenAI 兼容接口）时：
      #   1. MODEL_PROVIDER 改为 openai / deepseek
      #   2. 取消下面两行注释并填入 API Key 和 BaseURL
      #   3. AI_AGENT_MODEL 改为对应模型名（如 gpt-4o-mini / deepseek-chat）
      # MODEL_PROVIDER: openai
      # API_KEY: sk-xxx
      RUNNERGO_MANAGEMENT_API_URL: http://manage:30000/management/api/v1
      RUNNERGO_MYSQL_HOST: mysql-db
      RUNNERGO_MYSQL_PORT: "3306"
      RUNNERGO_MYSQL_USER: root
      RUNNERGO_MYSQL_PASSWORD: "123456"
      RUNNERGO_MYSQL_DATABASE: runnergo
      RUNNERGO_PERMISSION_USER_URL: http://permission:30000/permission/api/v1/user/get
      AUTO_TEST_ENFORCE_VUM_QUOTA: "false"
      # 本地 RunnerGo 被测站点使用固定测试网段；仅放行该测试地址，其他内网目标仍由 SSRF 防护拦截。
      AUTO_TEST_ALLOWED_URL_CIDRS: 172.16.0.88/32
      # 压测引擎自带的 Prometheus / mysqld-exporter / jmx-exporter 容器主机名直连走白名单，
      # 这样用户在「全链路压测 > 高级配置」里启用 monitoring 并填 http://prometheus:9090 不会被 SSRF 拦截。
      AUTO_TEST_ALLOWED_URL_HOSTS: prometheus,mysqld-exporter,jmx-exporter
      TEST_DATA_CENTER_AGENT_TOKEN: runnergo-local-agent-token
      AUTO_TEST_AUTH_REQUIRED: "true"
      AUTO_TEST_CORS_ALLOWED_ORIGINS: http://localhost:9999,http://127.0.0.1:9999
      ALLURE_CLI: /app/tools/allure-2.27.0/bin/allure
      # Worker 自动启动：Docker 启动时自动拉起 worker 进程（无需手动调用 /api/worker/restart）
      AUTO_TEST_WORKER_AUTO_START: "true"
      AUTO_TEST_WORKER_COUNT: "1"
    volumes:
      - ./auto-test/backend:/app/backend
      - ./auto-test/config:/app/config
      - ./auto-test/core:/app/core
      - ./auto-test/pages:/app/pages
      - ./auto-test/templates:/app/templates
      - ./auto-test/tests:/app/tests
      - ./auto-test/cases:/app/cases
      - ./auto-test/imports:/app/imports
      - ./auto-test/logs:/app/logs
      - ./auto-test/reports:/app/reports
      - ./auto-test/runtime:/app/runtime
      - ./auto-test/screenshots:/app/screenshots
      - ./auto-test/uploads:/app/uploads
      - ./tools:/app/tools
      - ./testhub/data:/data/testhub
    networks: [apipost_net]
    depends_on:
      - testhub-backend
      - ollama

networks:
  apipost_net:
    driver: bridge
