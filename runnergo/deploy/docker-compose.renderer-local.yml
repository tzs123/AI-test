services:
  grafana-image-renderer:
    image: python:3.11-slim
    restart: unless-stopped
    command: [python, /app/local_image_renderer.py]
    environment:
      AUTH_TOKEN: runnergo-local-renderer-token
    volumes:
      - ./grafana/local_image_renderer.py:/app/local_image_renderer.py:ro
    expose: ["8081"]
    networks: [runnergo]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  runnergo:
    name: runnergo_apipost_net
    external: true
