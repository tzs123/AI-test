  `).join('');
}

function syncWebRecorderRecordingInsertPosition(){
  const targetIndex=Number($('#webRecordInsertTarget')?.value);
  const before=$('#webRecordInsertBefore');
  const after=$('#webRecordInsertAfter');
  const blocked=targetIndex===0&&_webRecorderSteps[0]?.action==='goto';
  if(before)before.disabled=blocked;
  if(blocked&&after)after.checked=true;
  const position=document.querySelector('input[name="webRecordInsertPosition"]:checked')?.value||'after';
  const hint=$('#webRecordInsertHint');
  if(hint&&Number.isInteger(targetIndex)&&_webRecorderSteps[targetIndex]){
    hint.textContent=`新录制步骤将插入到第 ${targetIndex+1} 步${position==='before'?'之前':'之后'}；录制的多个步骤会按顺序连续插入。`;
  }
}

function renderWebRecorderRecordingInsertControls(){
  const select=$('#webRecordInsertTarget');
  if(!select)return;
  const previous=select.value;
  select.innerHTML=webRecorderRecordingInsertTargetOptions();
  if([...select.options].some(option=>option.value===previous))select.value=previous;
  syncWebRecorderRecordingInsertPosition();
}

function setWebRecorderRecordingInsertControlsDisabled(disabled){
  const target=$('#webRecordInsertTarget');
  const before=$('#webRecordInsertBefore');
  const after=$('#webRecordInsertAfter');
  if(target)target.disabled=disabled;
  if(before)before.disabled=disabled;
  if(after)after.disabled=disabled;
  if(!disabled)syncWebRecorderRecordingInsertPosition();

function webRecorderRecordingInsertIndex(){
  if(!_webRecorderSteps.length)return null;
  const targetIndex=Number($('#webRecordInsertTarget')?.value);
  if(!Number.isInteger(targetIndex)||targetIndex<0||targetIndex>=_webRecorderSteps.length)return _webRecorderSteps.length;
  const position=document.querySelector('input[name="webRecordInsertPosition"]:checked')?.value||'after';
  return position==='before'?targetIndex:targetIndex+1;
}

const WEB_FLOW_VARIABLE_PATTERN = /\$\{([A-Za-z_][A-Za-z0-9_]*)\}/g;
const WEB_RUNTIME_REFERENCE_SCOPES = new Set(['api','db','database','page','outputs','data','dataassets','smartdata','global']);

function isWebRuntimeReference(name){
  return WEB_RUNTIME_REFERENCE_SCOPES.has(String(name||'').trim().split('.')[0].toLowerCase());
}

function extractWebFlowVariableNames(){
  const names=[];
  const add=name=>{
    const trimmed=String(name||'').trim();
    if(trimmed&&!names.includes(trimmed))names.push(trimmed);
  };
  const source=JSON.stringify(_webRecorderSteps||[]);
  let match;
  WEB_FLOW_VARIABLE_PATTERN.lastIndex=0;
  while((match=WEB_FLOW_VARIABLE_PATTERN.exec(source))) if(!isWebRuntimeReference(match[1])) add(match[1]);
  const required=_webRecorderEditingCase?.flow?.metadata?.required_variables||[];
  if(Array.isArray(required)) required.forEach(add);
  return names;
}

function generatedWebFlowVariableNames(){
  const names=[];
  const add=name=>{const value=String(name||'').trim();if(value&&!names.includes(value))names.push(value);};
  (_webRecorderSteps||[]).forEach(step=>{
    add(step.save_as||step.saveAs||step.variable);
    if(step.extract&&typeof step.extract==='object')Object.keys(step.extract).forEach(add);
  });
  return names;
}

function normalizeWebFlowVariables(flow){
  const normalized=[];
  const add=item=>{
    if(!item)return;
    if(typeof item==='string')item={name:item,value:''};
    const name=String(item.name||'').trim();
    if(!name)return;
    if(normalized.some(existing=>existing.name===name))return;
    const value=item.value;
    normalized.push({
      name,
      scope:item.scope||'local',
      type:item.type||'string',
      value:(item.type==='array'||item.type==='object')
        ? JSON.stringify(value ?? (item.type==='array'?[]:{}))
        : (value!==undefined&&value!==null?String(value):''),
      description:item.description||'',
    });
  };
  const variables=flow?.variables;
  if(Array.isArray(variables)) variables.forEach(add);
  else if(variables&&typeof variables==='object'){
    Object.entries(variables).forEach(([name,value])=>add({name,value,type:Array.isArray(value)?'array':typeof value}));
  }
  const required=flow?.metadata?.required_variables||[];
  if(Array.isArray(required)) required.forEach(name=>add({name,value:''}));
  return normalized;
}

function normalizeWebRuntimeAssertions(flow){
  const raw=flow?.runtime_assertions||flow?.runtimeAssertions||flow?.metadata?.runtime_assertions||[];
  if(!Array.isArray(raw))return [];
  return raw.filter(item=>item&&typeof item==='object').map((item,index)=>({
    enabled:item.enabled!==false,
    afterStepId:item.afterStepId||item.after_step_id||'',
    afterStepPath:item.afterStepPath||item.after_step_path||'',
    afterAction:item.afterAction||item.after_action||'',
    type:item.type||item.action||'assert_text',
    expected:item.expected??item.value??'',
    name:item.name||`数据断言 ${index+1}`,
    timeout:item.timeout??10000,
    message:item.message||'',
  }));
}

function formatWebRuntimeAssertions(){
  return _webRuntimeAssertions
    .filter(item=>item&&item.enabled!==false&&(item.afterStepId||item.afterStepPath||item.afterAction)&&(item.expected||['assert_visible','assert_error'].includes(item.type)))
    .map(item=>({
      enabled:item.enabled!==false,
      afterStepId:String(item.afterStepId||'').trim(),
      afterStepPath:String(item.afterStepPath||'').trim(),
      afterAction:String(item.afterAction||'').trim(),
      type:String(item.type||'assert_text').trim(),
      expected:item.expected??'',
      name:String(item.name||'数据驱动断言').trim(),
      timeout:Number(item.timeout)||10000,
      message:String(item.message||'').trim(),
    }));
}

function webRuntimeAssertionTargetOptions(selected){
  const options=[];
  (_webRecorderSteps||[]).forEach((step,index)=>{
    const id=String(step.id||'').trim();
    if(id)options.push([`id:${id}`,`${index+1}. ${step.name||step.action} · ${id}`]);
    options.push([`path:steps.${index}`,`${index+1}. ${step.name||step.action} · steps.${index}`]);
  });
  const value=selected||'';
  return [
    '<option value="">选择步骤</option>',
    ...options.map(([raw,label])=>`<option value="${escAttr(raw)}" ${value===raw?'selected':''}>${esc(label)}</option>`)
  ].join('');
}

function addWebRuntimeAssertion(){
  const submitStep=[...(_webRecorderSteps||[])].reverse().find(step=>/submit|提交|确认/.test(`${step.action||''} ${step.name||''}`));
  _webRuntimeAssertions.push({
    enabled:true,
    afterStepId:submitStep?.id||'',
    afterStepPath:submitStep&&!submitStep.id?`steps.${_webRecorderSteps.indexOf(submitStep)}`:'',
    afterAction:'',
    type:'assert_text',
    expected:'${data.expected_submit_result}',
    name:'校验提交结果',
    timeout:10000,
    message:'',
  });
  renderWebRuntimeAssertions();
}

function removeWebRuntimeAssertion(index){
  _webRuntimeAssertions.splice(index,1);
  renderWebRuntimeAssertions();
}

function updateWebRuntimeAssertion(index,key,value){
  const item=_webRuntimeAssertions[index]; if(!item)return;
  if(key==='target'){
    item.afterStepId=''; item.afterStepPath=''; item.afterAction='';
    if(String(value).startsWith('id:'))item.afterStepId=String(value).slice(3);
    else if(String(value).startsWith('path:'))item.afterStepPath=String(value).slice(5);
    return;
  }
  item[key]=value;
}

function webRuntimeAssertionTargetValue(item){
  if(item.afterStepId)return `id:${item.afterStepId}`;
  if(item.afterStepPath)return `path:${item.afterStepPath}`;
  return '';
}

function renderWebRuntimeAssertions(){
  const target=$('#webRuntimeAssertionList');
  const count=$('#webRuntimeAssertionCount');
  if(count)count.textContent=String(_webRuntimeAssertions.length);
  if(!target)return;
  target.innerHTML=_webRuntimeAssertions.length?_webRuntimeAssertions.map((item,index)=>`
    <div class="grid grid-cols-12 gap-2 items-center py-1">
      <select class="col-span-2 border rounded px-2 py-1 text-xs bg-white" onchange="updateWebRuntimeAssertion(${index},'target',this.value)">
        ${webRuntimeAssertionTargetOptions(webRuntimeAssertionTargetValue(item))}
      </select>
      <select class="col-span-2 border rounded px-2 py-1 text-xs bg-white" onchange="updateWebRuntimeAssertion(${index},'type',this.value)">
        ${['assert_text','assert_url','assert_visible','assert_error'].map(type=>`<option value="${type}" ${item.type===type?'selected':''}>${type}</option>`).join('')}
      </select>
      <input class="col-span-3 border rounded px-2 py-1 text-xs font-mono" value="${escAttr(item.expected||'')}" placeholder="例如 ${escAttr('${data.expected_submit_result}')}" oninput="updateWebRuntimeAssertion(${index},'expected',this.value)">
      <input class="col-span-2 border rounded px-2 py-1 text-xs" value="${escAttr(item.name||'')}" placeholder="断言名称" oninput="updateWebRuntimeAssertion(${index},'name',this.value)">
      <input class="col-span-2 border rounded px-2 py-1 text-xs" type="number" min="100" value="${escAttr(item.timeout??10000)}" oninput="updateWebRuntimeAssertion(${index},'timeout',this.value)">
      <button class="col-span-1 text-red-500 text-xs" onclick="removeWebRuntimeAssertion(${index})">删除</button>
    </div>`).join(''):'<div class="text-slate-400 text-sm py-2">暂无断言。示例：提交步骤后断言 \\${data.expected_submit_result}。</div>';
}

function syncWebRecorderVariablesFromSteps(){
  const required=extractWebFlowVariableNames();
  if(!required.length)return;
  const byName=new Map(_webRecorderVariables.map(item=>[item.name,item]));
  required.forEach(name=>{
    if(!byName.has(name)){
      _webRecorderVariables.push({name,scope:'local',type:'string',value:'',description:''});
    }
  });
}

function addWebRecorderVariable(name=''){
  _webRecorderVariables.push({name:String(name||''),scope:'local',type:'string',value:'',description:''});
  renderWebRecorderVariables();
}

function removeWebRecorderVariable(index){
  _webRecorderVariables.splice(index,1);
  renderWebRecorderVariables();
}

function updateWebRecorderVariable(index,key,value){
  const item=_webRecorderVariables[index]; if(!item)return;
  item[key]=value;
}

function parseWebRecorderVariableValue(value,type){
  if(type==='number'){
    const num=Number(value);
    return Number.isNaN(num)?0:num;
  }
  if(type==='boolean')return String(value).trim().toLowerCase()==='true';
  if(type==='array'||type==='object'){
    try{return JSON.parse(value||'');}
    catch(_e){return type==='array'?[]:{};}
  }
  return value;
}

function formatWebRecorderVariables(){
  return _webRecorderVariables
    .filter(item=>item&&String(item.name||'').trim())
    .map(item=>({
      name:String(item.name||'').trim(),
      scope:item.scope||'local',
      type:item.type||'string',
      value:parseWebRecorderVariableValue(item.value,item.type),
      description:item.description||'',
    }));
}

function webRecorderRuntimeVariables(){
  const result={};
  formatWebRecorderVariables().forEach(item=>{
    if(item.value!==undefined&&item.value!==null&&String(item.value)!=='')result[item.name]=item.value;
  });
  return result;
}

function missingWebRecorderVariables(){
  const runtime=webRecorderRuntimeVariables();
  const generated=new Set(generatedWebFlowVariableNames());
  return extractWebFlowVariableNames().filter(name=>!generated.has(name)&&!isWebRuntimeReference(name)&&(runtime[name]===undefined||runtime[name]===null||String(runtime[name])===''));
}

async function importWebFlowYaml(event){

  const file=input?.files?.[0];

  if(_webRecorderSession){
    alert('请先停止当前录制，再导入 YAML 场景。');

  }
  try{

    const data=await req('/web/flows/import',{method:'POST',body:JSON.stringify({
      project_id:currentProject,
      filename:file.name,
      content,
    })});
    resetWebRecorderClientState();
    const flow=data.flow||{};
    const viewport=flow.browser?.viewport||{};
    const firstGoto=(flow.steps||[]).find(step=>step.action==='goto');
    _webRecorderEditingCase={filename:data.filename,flow};
    _webRecorderSteps=JSON.parse(JSON.stringify(flow.steps||[]));
    _webRecorderViewport={width:Number(viewport.width)||1440,height:Number(viewport.height)||900};
    _webRecorderBaseUrl=flow.base_url||(/^(https?:)?\/\//.test(firstGoto?.url||'')?firstGoto.url:'');

    _webRuntimeAssertions=normalizeWebRuntimeAssertions(flow);
    syncWebRecorderVariablesFromSteps();
    const target=new URL(pageUrl('webRecorder'),window.location.origin);
    target.searchParams.set('project_id',currentProject);
    target.searchParams.set('case',data.filename);

    if(result)result.innerHTML=`<span class="text-green-600">✅ 已导入并保存 ${esc(data.filename)}，现在可直接执行或继续编辑。</span>`;

}

function webExecutionStatusMeta(status){
  return ({
    pending:['等待','bg-amber-100 text-amber-700','border-amber-200'],
    running:['执行中','bg-blue-100 text-blue-700','border-blue-400'],
    passed:['通过','bg-green-100 text-green-700','border-green-300'],
    success:['成功','bg-green-100 text-green-700','border-green-300'],
    failed:['失败','bg-red-100 text-red-700','border-red-400'],
    skipped:['跳过','bg-slate-100 text-slate-500','border-slate-200'],
    stopped:['已停止','bg-orange-100 text-orange-700','border-orange-300'],
  })[status]||[status||'未知','bg-slate-100 text-slate-600','border-slate-200'];
}

const WEB_ASSERTION_ACTIONS=new Set(['assert_visible','assert_text','assert_url','assert_error']);
function webExecutionStepStatusMeta(step){
  const action=String(step?.action||'').toLowerCase();
  const isAssertion=Boolean(step?.is_assertion)||WEB_ASSERTION_ACTIONS.has(action);
  if(isAssertion&&action==='assert_error'&&step?.assertion_matched===true){
    return ['命中','bg-red-100 text-red-700','border-red-400'];
  }
  if(isAssertion&&action==='assert_error'&&step?.assertion_matched===false){
    return ['未命中','bg-green-100 text-green-700','border-green-300'];
  }
  return webExecutionStatusMeta(step?.status||'pending');
}

function renderWebExecutionPanel(){
  const panel=$('#webExecutionPanel');
  if(!panel)return;
  if(!_webExecutionTaskId&&!_webExecutionState){panel.classList.add('hidden');return;}
  panel.classList.remove('hidden');
  const taskStatus=_webExecutionTask?.status||_webExecutionState?.task_status||_webExecutionState?.status||'pending';
  const [statusLabel,statusClass]=webExecutionStatusMeta(taskStatus);
  const badgeEl=$('#webExecutionBadge');
  if(badgeEl){badgeEl.className=`badge ${statusClass}`;badgeEl.textContent=statusLabel;}
  const runtimeSteps=Array.isArray(_webExecutionState?.steps)&&_webExecutionState.steps.length
    ?_webExecutionState.steps
    :_webRecorderSteps.map((step,index)=>({index:index+1,id:step.id,action:step.action,name:step.name||step.action,status:'pending',duration:0,error:'',screenshot:'',log:''}));
  const total=Number(_webExecutionState?.total||runtimeSteps.length||0);
  const completed=Number(_webExecutionState?.completed||runtimeSteps.filter(step=>['passed','failed','skipped'].includes(step.status)).length);
  const progress=total?Math.min(100,Math.round(completed/total*100)):(taskStatus==='success'?100:0);
  const progressEl=$('#webExecutionProgress');
  if(progressEl){
    progressEl.style.width=`${progress}%`;
    progressEl.className=`h-full transition-all ${taskStatus==='failed'?'bg-red-500':taskStatus==='success'?'bg-green-500':'bg-indigo-500'}`;
  }
  const summary=$('#webExecutionSummary');
  const iterationRows=Array.isArray(_webExecutionState?.iterations)?_webExecutionState.iterations:[];
  const currentIteration=iterationRows.find(item=>item&&item.status==='running');
  const currentIterationText=currentIteration?` · 第 ${Number(currentIteration.index)||1}/${iterationRows.length} 轮`: '';
  const iterationSummary=iterationRows.length?`${currentIterationText} · 已完成 ${Number(_webExecutionState?.completed_iterations||0)}/${iterationRows.length} 轮`:'';
  if(summary)summary.textContent=`任务 ${_webExecutionTaskId||'-'} · ${completed}/${total} 步完成${iterationSummary} · ${progress}%${_webExecutionTask?.duration?` · ${_webExecutionTask.duration}s`:''}`;
  const list=$('#webExecutionSteps');
  const renderExecutionStep=step=>{
    const [label,cls,border]=webExecutionStepStatusMeta(step);
    const current=step.status==='running';
    return `<div class="border-l-4 ${border} ${current?'bg-blue-50':'bg-slate-50'} rounded p-3">
      <div class="flex justify-between gap-3 items-start">
        <div class="min-w-0"><div class="text-xs font-mono text-indigo-600">${esc(step.step_index||step.index)}. ${esc(step.action||'')}</div><div class="font-medium text-sm mt-0.5">${esc(step.name||step.action||'未命名步骤')}</div></div>
        <div class="flex items-center gap-2 flex-none"><span class="badge ${cls}">${label}</span>${step.duration?`<span class="text-xs text-slate-400">${esc(step.duration)}s</span>`:''}</div>
      </div>
      ${step.log?`<div class="text-xs text-slate-500 mt-2 whitespace-pre-wrap">${esc(step.log)}</div>`:''}
      ${step.error?`<pre class="text-xs text-red-700 bg-red-50 border border-red-100 rounded p-2 mt-2 whitespace-pre-wrap overflow-auto">${esc(step.error)}</pre>`:''}
      ${step.screenshot?`<div class="mt-2"><a href="${escAttr(step.screenshot)}" target="_blank"><img src="${escAttr(step.screenshot)}" class="w-full max-h-72 object-contain bg-slate-900 rounded border" loading="lazy" title="点击查看原图"></a><div class="text-[11px] text-slate-400 mt-1">步骤执行截图，点击查看原图</div></div>`:''}
    </div>`;
  };
  if(list){
    if(!runtimeSteps.length){
      list.innerHTML='<div class="text-slate-400 text-sm text-center py-8">等待执行器初始化步骤...</div>';
    }else if(iterationRows.length){
      list.innerHTML=iterationRows.map(iteration=>{
        const steps=runtimeSteps.filter(step=>Number(step.iteration_index)===Number(iteration.index));
        const [iterationLabel,iterationClass]=webExecutionStatusMeta(iteration.status||'pending');
        const dataText=JSON.stringify(iteration.data||{});
        return `<section class="border border-slate-200 rounded overflow-hidden bg-white">
          <div class="px-3 py-2 bg-slate-100 border-b border-slate-200 flex justify-between gap-3 items-start">
            <div class="min-w-0"><div class="font-semibold text-sm">${esc(iteration.label||`data-${iteration.index}`)}</div><code class="block text-[11px] text-slate-500 mt-1 break-all">${esc(dataText)}</code></div>
            <div class="flex items-center gap-2 flex-none"><span class="text-xs text-slate-500">${esc(iteration.completed||0)}/${esc(iteration.total||steps.length)}</span><span class="badge ${iterationClass}">${iterationLabel}</span></div>
          </div>
          <div class="p-2 space-y-2">${steps.map(renderExecutionStep).join('')}</div>
        </section>`;
      }).join('');
    }else{
      list.innerHTML=runtimeSteps.map(renderExecutionStep).join('');
    }
  }
  const log=$('#webExecutionLog');
  if(log){
    const shouldFollow=log.scrollHeight-log.scrollTop-log.clientHeight<80;
    log.textContent=_webExecutionLog||'等待执行日志...';
    if(shouldFollow)log.scrollTop=log.scrollHeight;
  }
  const running=['pending','running'].includes(taskStatus);
  $('#webExecutionStop')?.classList.toggle('hidden',!running);
  $('#webExecutionReport')?.classList.toggle('hidden',!isUiReportReady(_webExecutionTask));
}

async function refreshWebFlowExecution(){
  const taskId=_webExecutionTaskId;
  if(!taskId)return;
  try{
    const [state,task]=await Promise.all([req(`/tasks/${taskId}/steps`),req(`/tasks/${taskId}`)]);
    if(taskId!==_webExecutionTaskId)return;
    _webExecutionState=state;
    _webExecutionTask=task;
    renderWebExecutionPanel();
    if(['success','failed','stopped'].includes(task.status))stopWebSceneExecutionTracking();
  }catch(e){
    _webExecutionLog+=`\n⚠️ 刷新执行状态失败: ${e.message}`;
    renderWebExecutionPanel();
  }
}

function startWebFlowExecutionTracking(taskId){
  stopWebSceneExecutionTracking();
  _webExecutionEventSource=new EventSource(`${API}/tasks/${taskId}/log/stream`);
  _webExecutionEventSource.onmessage=event=>{
    if(taskId!==_webExecutionTaskId)return;
    try{
      const data=JSON.parse(event.data);
      if(data.log)_webExecutionLog+=data.log;
      if(data.finished)refreshWebFlowExecution();
      renderWebExecutionPanel();
    }catch(_e){}
  };
  _webExecutionEventSource.onerror=()=>{};
  refreshWebFlowExecution();
  _webExecutionPollTimer=setInterval(refreshWebFlowExecution,700);
}

async function runCurrentWebFlow(){
  if(!_webRecorderSteps.length){alert('请先录制或导入包含步骤的 YAML 场景。');return;}
  if(_webExecutionTask&&['pending','running'].includes(_webExecutionTask.status)){
    alert('当前场景仍在执行，请先等待完成或停止任务。');return;
  }
  syncWebRecorderVariablesFromSteps();
  const missingVariables=missingWebRecorderVariables();
  if(missingVariables.length){
    renderWebRecorderVariables();
    alert(`请先填写场景变量：${missingVariables.join(', ')}`);
    return;
  }
  const saved=await saveWebRecordedFlow({quiet:true});
  if(!saved)return;
  try{
    const data=await req('/run',{method:'POST',body:JSON.stringify({
      project_id:currentProject,
      module:'ui',
      case_files:[saved.filename],
      triggered_by:'scene_builder',
      env:'test',
      base_url:_webRecorderBaseUrl||($('#webRecUrl')?.value||'').trim(),
      runtime_variables:webRecorderRuntimeVariables(),
    })});
    _webExecutionTaskId=data.task_id;
    _webExecutionTask={id:data.task_id,status:data.status||'pending',report_url:''};
    _webExecutionState={task_id:data.task_id,status:'pending',task_status:'pending',total:_webRecorderSteps.length,completed:0,steps:_webRecorderSteps.map((step,index)=>({index:index+1,id:step.id,action:step.action,name:step.name||step.action,status:'pending',duration:0,error:'',screenshot:'',log:''}))};
    _webExecutionLog=`🚀 已提交场景执行任务 ${data.task_id}\n📄 YAML: ${saved.filename}\n`;
    renderWebExecutionPanel();
    $('#webExecutionPanel')?.scrollIntoView({behavior:'smooth',block:'start'});
    startWebFlowExecutionTracking(data.task_id);
  }catch(e){alert(`执行场景失败：${e.message}`);}
}

async function stopCurrentWebFlowExecution(){

async function startWebRecorder(){
  if(_webRecorderSession){ alert('当前项目已有录制会话，请先停止'); return; }
  const url = ($('#webRecUrl')?.value || '').trim();
  if(!url){ alert('请输入录制地址'); return; }
  if(_webRecorderDraftId){
    if(!confirm('当前有已恢复的录制草稿。开始新录制将放弃该草稿，是否继续？')) return;
    const discarded=await discardWebRecorderDraft(false);
    if(!discarded) return;
  }else if(_webRecorderSteps.length&&!_webRecorderEditingCase){
    if(!confirm('当前编辑区有未保存步骤。开始新录制将清空这些步骤，是否继续？')) return;
    _webRecorderSteps=[];
  }
  const recordInsertIndex=webRecorderRecordingInsertIndex();
  _webRecorderViewport = webRecorderViewportValue();
  _webRecorderBaseUrl = url;
  const status = $('#webRecStatus');
  if(status) status.innerHTML = '<span class="badge bg-amber-100 text-amber-700">启动浏览器中...</span>';
  try{
    const data = await req('/web/recordings/start',{method:'POST',body:JSON.stringify({
      project_id:currentProject,url,viewport:_webRecorderViewport,
      initial_steps:_webRecorderEditingCase?_webRecorderSteps:[],
      record_insert_index:recordInsertIndex,
    })});
    _webRecorderSession = data.session_id;
    _webRecorderDraftId = data.session_id;
    _webRecorderDraftStatus = data.status||'recording';
    syncWebRecorderRouteDraft(data.session_id);
    applyWebRecorderSnapshot(data);
    renderWebRecorderSteps();
    setWebRecorderRecordingInsertControlsDisabled(true);
    startWebRecorderFrameRefresh();
  }catch(e){
    if(!_webRecorderEditingCase&&e.status===400 && String(e.message).includes('已有正在进行')){
      const attached=await attachActiveWebRecording();
      if(attached)return;
    }
    if(status) status.innerHTML = '<span class="badge bg-red-100 text-red-700">启动失败</span>';
    setWebRecorderRecordingInsertControlsDisabled(false);
    alert('启动录制失败：'+e.message);
  }
}

async function attachActiveWebRecording(){
  try{
    const data=await req(`/web/recordings/active?project_id=${encodeURIComponent(currentProject)}`);
    if(!data.active)return false;
    _webRecorderSession=data.session_id;
    _webRecorderDraftId=data.session_id;
    _webRecorderDraftStatus=data.status||'recording';
    _webRecorderAuthStateSaved=Boolean(data.auth_state_saved);
    applyWebRecorderSnapshot(data);
    renderWebRecorderSteps();
    setWebRecorderRecordingInsertControlsDisabled(true);
    startWebRecorderFrameRefresh();
    return true;
  }catch{return false;}
}

async function refreshWebRecorderFrame(){
  if(!_webRecorderSession || _webRecorderBusy || _webRecorderRefreshing) return;
  _webRecorderRefreshing = true;
  try{
    const data = await req(`/web/recordings/${_webRecorderSession}/frame`);
    applyWebRecorderSnapshot(data);
  }catch(e){
    if(e.status===404){
      _webRecorderSession='';
      _webRecorderDraftStatus='interrupted';
      clearPageRefresh();
      if(_webRecorderDraftId){
        try{
          const draft=await req(`/web/recording-drafts/${_webRecorderDraftId}`);
          _webRecorderSteps=draft.steps||_webRecorderSteps;
          _webRecorderDraftStatus=draft.status||'interrupted';
          _webRecorderAuthStateSaved=Boolean(draft.auth_state_saved);
          renderWebRecorderSteps();
        }catch(_){ }
      }
      syncWebRecorderDraftControls();
      return;
    }
    const status=$('#webRecStatus'); if(status) status.innerHTML=`<span class="badge bg-red-100 text-red-700">${esc(e.message)}</span>`;
  }finally{ _webRecorderRefreshing=false; }
}

function applyWebRecorderSnapshot(data){
  let stepsChanged=false;
  if(data.session_id){
    _webRecorderDraftId=data.session_id;
    _webRecorderDraftStatus=data.status||_webRecorderDraftStatus||'recording';
  }
  if(data.auth_state_saved!==undefined)_webRecorderAuthStateSaved=Boolean(data.auth_state_saved);
  if(data.viewport) _webRecorderViewport = data.viewport;
  if(Array.isArray(data.steps)){
    stepsChanged=JSON.stringify(data.steps)!==JSON.stringify(_webRecorderSteps);
    if(stepsChanged)_webRecorderSteps=data.steps;
  }
  if(Array.isArray(data.tabs)) _webRecorderTabs = data.tabs;
  const frame = $('#webFrame');
  const empty = $('#webFrameEmpty');
  if(frame && data.image){
    frame.src=data.image; frame.classList.remove('hidden');
    frame.dataset.vw=String(data.viewport?.width||_webRecorderViewport.width);
    frame.dataset.vh=String(data.viewport?.height||_webRecorderViewport.height);
    if(empty) empty.classList.add('hidden');
  }
  const updatedAt=$('#webFrameUpdatedAt');
  if(updatedAt&&data.captured_at){
    const captured=new Date(Number(data.captured_at));
    updatedAt.textContent=`持续采集中 · 最近刷新 ${captured.toLocaleTimeString('zh-CN',{hour12:false})}`;
  }
  syncWebRecorderDraftControls();
  const url=$('#webCurrentUrl'); if(url) url.textContent=data.url||'';
  const navigateUrl=$('#webNavigateUrl');
  if(navigateUrl&&data.url&&document.activeElement!==navigateUrl) navigateUrl.value=data.url;
  renderWebRecorderTabs();
  if(stepsChanged)renderWebRecorderSteps();
  syncWebStepDebugButton();
}

  select.innerHTML=_webRecorderTabs.length?_webRecorderTabs.map(tab=>`<option value="${tab.index}" ${tab.active?'selected':''}>${tab.index+1}. ${esc(tab.title||tab.url||'新标签页')}</option>`).join(''):'<option>当前标签页</option>';

function webRecorderFramePoint(event){
  const image=event.currentTarget||$('#webFrame');
  const rect=image.getBoundingClientRect();
  const viewportWidth=Number(image.dataset.vw)||image.naturalWidth||_webRecorderViewport.width;
  const viewportHeight=Number(image.dataset.vh)||image.naturalHeight||_webRecorderViewport.height;
  const rawX=Math.round((event.clientX-rect.left)*viewportWidth/rect.width);
  const rawY=Math.round((event.clientY-rect.top)*viewportHeight/rect.height);
  return {
    x:Math.max(0,Math.min(viewportWidth-1,rawX)),
    y:Math.max(0,Math.min(viewportHeight-1,rawY)),
  };
}

async function webRecorderFrameClick(event){
  if(_webRecorderSuppressClick){
    _webRecorderSuppressClick=false;
    event.preventDefault();
    return;
  }
  if(!_webRecorderSession || _webRecorderBusy) return;
  const {x,y}=webRecorderFramePoint(event);
  const mode=$('#webRecMode')?.value||'click';
  if(mode==='operate_only'){
    await executeWebRecorderAction({action:'click',x,y});
    return;
  }
  if(mode==='probe'){
    await probeWebRecorderElement(x,y);
    return;
  }
  if(mode==='extract'){
    await probeWebRecorderElement(x,y);
    return;
  }
  if(mode==='popup_select_text'){
    await recordPopupTextSelection();
    return;
  }
  if(mode==='popup_scroll'){
    await probeWebRecorderElement(x,y,true);
    return;
  }
  if(mode==='drag'){
    if(!_webRecorderDragSource){
      _webRecorderDragSource={x,y};
      const hint=$('#webDragHint'); if(hint)hint.textContent='已选择拖拽起点，请再点击目标位置';
      await probeWebRecorderElement(x,y,true);
      return;
    }
    const source=_webRecorderDragSource;
    _webRecorderDragSource=null;
    const hint=$('#webDragHint'); if(hint)hint.textContent='';
    await executeWebRecorderAction({action:'drag',source_x:source.x,source_y:source.y,x,y});
    return;
  }
  let value=null;
  if(mode==='fill'){
    const element=await probeWebRecorderElement(x,y,true);
    const controlType=element?.fingerprint?.control_type||'';
    const tag=String(element?.tag||'').toLowerCase();
    const role=String(element?.role||'').toLowerCase();
    const inputType=String(element?.input_type||'').toLowerCase();
    const fillableInput=tag==='input'&&!['button','submit','reset','checkbox','radio','file'].includes(inputType);
    const fillable=controlType==='plate_input'||fillableInput||tag==='textarea'||tag==='select'||role==='textbox'||role==='combobox';
    if(element&&!fillable){
      await executeWebRecorderAction({action:'click',x,y});
      return;
    }
    value=window.prompt('请输入要填入的文本（密码字段保存时自动替换为 ${PASSWORD}）','');
    if(value===null) return;
  }else if(mode==='select'){
    value=window.prompt('请输入下拉选项显示文本','');
    if(value===null) return;
  }else if(mode==='upload'){
    value=window.prompt('请输入容器可访问的文件路径；多个文件用逗号分隔','/Users/tanzsongsen/Downloads/');
    if(value===null) return;
  }else if(mode==='press'){
    value=window.prompt('请输入按键，例如 Enter、Tab、Escape、Control+A','Enter');
    if(value===null)return;
  }
  const payload={action:mode,x,y,value};
  if(mode==='select') payload.option_label=value;
  if(mode==='upload') payload.files=value;
  if(mode==='press') payload.key=value;
  await executeWebRecorderAction(payload);
}

function webRecorderWheelPixelDelta(event){
  const frame=$('#webFrame');
  const viewportHeight=Number(frame?.dataset.vh)||_webRecorderViewport.height||812;
  const multiplier=event.deltaMode===1?16:(event.deltaMode===2?viewportHeight:1);
  return {
    deltaX:Number(event.deltaX||0)*multiplier,
    deltaY:Number(event.deltaY||0)*multiplier,
  };
}

function normalizeWebRecorderPageScrollPayload(payload){
  let deltaX=Math.round(Number(payload.delta_x)||0);
  let deltaY=Math.round(Number(payload.delta_y)||0);
  if(!deltaX&&!deltaY)deltaY=WEB_RECORDER_PAGE_SCROLL_MIN_DELTA;
  const verticalDominant=Math.abs(deltaY)>=Math.abs(deltaX);
  if(verticalDominant){
    if(Math.abs(deltaX)<8)deltaX=0;
    if(deltaY&&Math.abs(deltaY)<WEB_RECORDER_PAGE_SCROLL_MIN_DELTA){
      deltaY=Math.sign(deltaY)*WEB_RECORDER_PAGE_SCROLL_MIN_DELTA;
    }
  }else{
    if(Math.abs(deltaY)<8)deltaY=0;
    if(deltaX&&Math.abs(deltaX)<WEB_RECORDER_PAGE_SCROLL_MIN_DELTA){
      deltaX=Math.sign(deltaX)*WEB_RECORDER_PAGE_SCROLL_MIN_DELTA;
    }
  }
  const clamp=value=>Math.sign(value)*Math.min(Math.abs(value),WEB_RECORDER_PAGE_SCROLL_MAX_DELTA);
  return {...payload,delta_x:clamp(deltaX),delta_y:clamp(deltaY)};
}

async function flushWebRecorderWheel(){
  _webRecorderWheelTimer=null;
  if(!_webRecorderSession||!_webRecorderWheelPending)return;
  if(_webRecorderBusy||_webRecorderRefreshing){
    _webRecorderWheelTimer=setTimeout(flushWebRecorderWheel,60);
    return;
  }
  const pending=_webRecorderWheelPending;
  _webRecorderWheelPending=null;
  let payload={
    action:'scroll',
    x:pending.x,
    y:pending.y,
    delta_x:Math.round(pending.deltaX),
    delta_y:Math.round(pending.deltaY),
    ...(pending.scrollScope==='popup'?{scroll_scope:'popup'}:{}),
  };
  payload=pending.scrollScope==='popup'
    ?normalizeWebRecorderScrollPayload(payload)
    :normalizeWebRecorderPageScrollPayload(payload);
  await executeWebRecorderAction(payload);
}

function webRecorderFrameWheel(event){
  if(!_webRecorderSession)return;
  event.preventDefault();
  const {x,y}=webRecorderFramePoint(event);
  const delta=webRecorderWheelPixelDelta(event);
  const scrollScope=($('#webRecMode')?.value==='popup_scroll')?'popup':'page';
  if(!_webRecorderWheelPending||_webRecorderWheelPending.scrollScope!==scrollScope){
    _webRecorderWheelPending={x,y,deltaX:0,deltaY:0,scrollScope};
  }
  _webRecorderWheelPending.x=x;
  _webRecorderWheelPending.y=y;
  _webRecorderWheelPending.deltaX+=delta.deltaX;
  _webRecorderWheelPending.deltaY+=delta.deltaY;
  if(_webRecorderWheelTimer)clearTimeout(_webRecorderWheelTimer);
  _webRecorderWheelTimer=setTimeout(flushWebRecorderWheel,WEB_RECORDER_WHEEL_DEBOUNCE_MS);
}

function webRecorderFramePointerDown(event){
  if(!_webRecorderSession || event.button!==0) return;
  _webRecorderPointerStart={...webRecorderFramePoint(event),clientX:event.clientX,clientY:event.clientY};
  try{event.currentTarget.setPointerCapture(event.pointerId);}catch(_e){}
}

async function webRecorderFramePointerUp(event){
  if(!_webRecorderPointerStart) return;
  const source=_webRecorderPointerStart;
  _webRecorderPointerStart=null;
  if(!_webRecorderSession || _webRecorderBusy) return;
  const target=webRecorderFramePoint(event);
  const distance=Math.hypot(target.x-source.x,target.y-source.y);
  if(distance<12) return;
  _webRecorderSuppressClick=true;
  event.preventDefault();
  const hint=$('#webDragHint'); if(hint)hint.textContent='';
  const mode=$('#webRecMode')?.value||'click';
  if(mode==='drag'){
    await executeWebRecorderAction({
      action:'drag',
      source_x:source.x,
      source_y:source.y,
      x:target.x,
      y:target.y,
    });
    return;
  }
  await executeWebRecorderAction(normalizeWebRecorderScrollPayload({
    action:'scroll',
    x:source.x,
    y:source.y,
    delta_x:Math.round(source.x-target.x),
    delta_y:Math.round(source.y-target.y),
    ...webRecorderScrollScopePayload(),
  }));
}

function webRecorderScrollScopePayload(){
  return ($('#webRecMode')?.value==='popup_scroll')?{scroll_scope:'popup'}:{};
}

function clampWebRecorderScrollDelta(value,maxDelta=WEB_RECORDER_POPUP_SCROLL_MAX_DELTA){
  const number=Number(value)||0;
  if(!number)return 0;
  return Math.sign(number)*Math.min(Math.abs(Math.round(number)),maxDelta);
}

function normalizeWebRecorderScrollPayload(payload){
  if((payload.scroll_scope||'')!=='popup')return payload;
  return {
    ...payload,
    delta_x:clampWebRecorderScrollDelta(payload.delta_x),
    delta_y:clampWebRecorderScrollDelta(payload.delta_y),
  };
}

async function probeWebRecorderElement(x,y,silent=false){
  if(!_webRecorderSession) return null;

  try{
    const data=await req(`/web/recordings/${_webRecorderSession}/probe`,{method:'POST',body:JSON.stringify({x,y})});
    _webRecorderProbe=data.element;
    applyWebRecorderSnapshot(data);
    renderWebProbe(data.element);
    return data.element;
  }catch(e){ if(!silent) alert('元素探测失败：'+e.message); return null; }
  finally{ if(!wasBusy) _webRecorderBusy=false; }
}

function runnergoTeamOptions(){
  const currentId=runnergoCurrentTeamId();
  const options=['<option value="">请选择 RunnerGo 团队</option>'];
  if(currentId&&!_runnergoTeams.some(item=>String(item.team_id)===currentId)){
    options.push(`<option value="${escAttr(currentId)}" selected>当前团队 · ${esc(currentId)}</option>`);
  }
  _runnergoTeams.forEach(item=>options.push(`<option value="${escAttr(item.team_id)}" ${String(item.team_id)===currentId?'selected':''}>${esc(item.name||item.team_id)}</option>`));

function populateRunnergoTeamSelect(){
  const select=$('#webRunnergoTeam');
  if(!select)return;
  select.innerHTML=runnergoTeamOptions();
  select.value=runnergoCurrentTeamId();
}

function selectRunnergoTeam(teamId){
  teamId=String(teamId||'').trim();
  if(teamId){
    sessionStorage.setItem('team_id',teamId);
    localStorage.setItem('team_id',teamId);
  }else{
    sessionStorage.removeItem('team_id');
    localStorage.removeItem('team_id');
  }
  _runnergoTestObjects=[];
  _runnergoTestObjectsTeamId='';
  populateRunnergoTestObjectSelect('api');
  populateRunnergoTestObjectSelect('db');
  if(teamId)loadRunnergoTestObjects(true);
}

async function loadRunnergoTeams(force=false){
  if(!force&&_runnergoTeams.length){populateRunnergoTeamSelect();return _runnergoTeams;}
  const data=await req('/runnergo-teams');
  _runnergoTeams=Array.isArray(data.teams)?data.teams:[];
  let currentId=runnergoCurrentTeamId();
  if(currentId&&!_runnergoTeams.some(item=>String(item.team_id)===currentId))currentId='';
  if(!currentId){
    const currentTeam=_runnergoTeams.find(item=>item.is_current);
    currentId=String(currentTeam?.team_id||'').trim();
  }
  if(!currentId&&_runnergoTeams.length===1){
    currentId=String(_runnergoTeams[0].team_id||'').trim();
  }
  if(currentId){sessionStorage.setItem('team_id',currentId);localStorage.setItem('team_id',currentId);}
  populateRunnergoTeamSelect();
  return _runnergoTeams;
}

function normalizeWebDataAssertions(step,kind){
  const source=step.assert??step.assertions??[];
  const rules=Array.isArray(source)?source:(source&&typeof source==='object'?[source]:[]);
  const rows=[];
  rules.forEach(rule=>{
    if(!rule||typeof rule!=='object')return;
    if(kind==='api'&&(rule.status!==undefined||rule.status_code!==undefined)){
      rows.push({path:'$.status',operator:'equals',expected:rule.status??rule.status_code});
    }
    const hasValue=rule.expected!==undefined||rule.equals!==undefined||rule.value!==undefined||rule.contains!==undefined;
    const path=rule.path||rule.json_path;
    if(path||hasValue)rows.push({
      path:path||(kind==='db'?'$.rows':'$'),
      operator:rule.operator||(rule.contains!==undefined?'contains':'equals'),
      expected:rule.expected??rule.equals??rule.value??rule.contains??'',
    });
  });
  return rows;
}

async function loadRunnergoTestObjects(force=false){
  const status=$('#webTestObjectStatus');
  let teamId=runnergoCurrentTeamId();
  if(!teamId){
    if(status)status.textContent='正在读取 RunnerGo 团队...';
    try{await loadRunnergoTeams(force);}catch(e){if(status)status.textContent=`团队加载失败：${e.message}`;return;}
    teamId=runnergoCurrentTeamId();
  }else{
    loadRunnergoTeams().catch(()=>{});
  }
  if(!teamId){if(status)status.textContent=_runnergoTeams.length?'请选择 RunnerGo 团队后加载对象。':'当前账号暂无可用团队。';return;}
  if(!force&&_runnergoTestObjectsTeamId===teamId&&_runnergoTestObjects.length){
    populateRunnergoTestObjectSelect('api');populateRunnergoTestObjectSelect('db');return;
  }
  if(status)status.textContent='正在加载 API 测试模块的测试对象...';
  try{
    const data=await req(`/runnergo-test-objects?team_id=${encodeURIComponent(teamId)}`);
    _runnergoTestObjects=Array.isArray(data.objects)?data.objects:[];
    _runnergoTestObjectsTeamId=teamId;
    populateRunnergoTestObjectSelect('api');populateRunnergoTestObjectSelect('db');
    if(status)status.textContent=`已加载 ${_runnergoTestObjects.length} 个可引用对象，执行时自动读取最新配置。`;
  }catch(e){if(status)status.textContent=`加载失败：${e.message}`;}
}

const WEB_STEP_ACTION_OPTIONS = [
  ['goto','打开页面'], ['go_back','浏览器后退'], ['go_forward','浏览器前进'], ['reload','刷新页面'],
  ['click','点击'], ['double_click','双击'], ['drag','拖拽'], ['fill','输入'], ['press','按键'],
  ['select','下拉选择'], ['popup_select_text','弹框选择'], ['check','勾选'], ['uncheck','取消勾选'],
  ['hover','悬停'], ['upload','上传文件'], ['scroll','滚动'], ['switch_tab','切换标签页'], ['close_tab','关闭标签页'],
  ['wait','等待'], ['assert_visible','可见断言'], ['assert_text','文本断言'], ['assert_url','URL 断言'], ['assert_error','错误拦截断言'], ['screenshot','截图'],
  ['api','接口执行'], ['db','数据库查询'],
];
const WEB_STEP_ELEMENT_REQUIRED_ACTIONS = new Set([
  'click','double_click','drag','fill','select','check','uncheck','hover','upload','assert_visible',
]);

function webStepActionOptions(step,index){
  const current=String(step.action||'').toLowerCase();
  const options=WEB_STEP_ACTION_OPTIONS.slice();
  if(current&&!options.some(([action])=>action===current))options.unshift([current,`${current}（兼容动作）`]);
  return options.map(([action,label])=>{
    const needsElement=WEB_STEP_ELEMENT_REQUIRED_ACTIONS.has(action);
    const unavailable=!step.element&&needsElement;
    return `<option value="${escAttr(action)}" ${current===action?'selected':''} ${unavailable?'disabled':''}>${esc(label)} · ${esc(action)}${unavailable?'（需要元素）':''}</option>`;
  }).join('');
}

  const actionSelect=$('#webStepAction');
  const previousAction=_webStepEditorDraft?.action||'';

  const draft=buildWebStepFromEditor({allowIncomplete:true});

  draft.action=String(nextAction||'').trim().toLowerCase();
  _webStepEditorDraft=draft;

function updateWebStepLocator(index,key,value){
  const item=_webStepEditorLocators[index]; if(!item)return;
  item[key]=value;
  if(key==='value'&&item.strategy==='role') item.name=value;
}
function moveWebStepLocator(index,delta){
  const target=index+delta; if(target<0||target>=_webStepEditorLocators.length)return;
  const item=_webStepEditorLocators.splice(index,1)[0]; _webStepEditorLocators.splice(target,0,item); renderWebStepLocatorEditor();
}
function deleteWebStepLocator(index){_webStepEditorLocators.splice(index,1);renderWebStepLocatorEditor();}
function addWebStepLocator(){
  const strategy=$('#webNewLocatorStrategy')?.value||'css';
  const value=($('#webNewLocatorValue')?.value||'').trim(); if(!value)return;
  const role=($('#webNewLocatorRole')?.value||'').trim();
  const item={strategy,value}; if(role)item.role=role; if(strategy==='role')item.name=value;
  _webStepEditorLocators.push(item); renderWebStepLocatorEditor();
  if($('#webNewLocatorValue'))$('#webNewLocatorValue').value='';
}

function buildWebStepFromEditor(options={}){
  const original=_webRecorderSteps[_webStepEditorIndex]; if(!original)return null;
  const step=JSON.parse(JSON.stringify(_webStepEditorDraft||original));
  step.action=String($('#webStepAction')?.value||step.action||'').trim().toLowerCase();
  step.name=($('#webStepName')?.value||step.action).trim();
  step.timeout=Math.max(100,Number($('#webStepTimeout')?.value)||10000);
  const waitAfter=Math.max(0,Number($('#webStepWaitAfter')?.value)||0);
  if(waitAfter)step.wait_after=waitAfter;else delete step.wait_after;
  if(['api','http','request','api_request'].includes(step.action)){
    const ref=selectedRunnergoTestObjectRef('api');
    if(!ref){if(!options.allowIncomplete)throw new Error('请选择 API 测试模块中的接口测试对象');}
    else{
      step.test_object_ref=ref;
      ['method','url','headers','params','json','json_body','form','data','request','expected_status'].forEach(key=>delete step[key]);
      const assertions=readWebDataAssertions('api');
      if(assertions.length)step.assert=assertions;else delete step.assert;
      const extract=readWebDataExtractions('api');
      if(Object.keys(extract).length)step.extract=extract;else delete step.extract;
    }
  }
  if(['db','database','query','sql'].includes(step.action)){
    const ref=selectedRunnergoTestObjectRef('db');
    if(!ref){if(!options.allowIncomplete)throw new Error('请选择 API 测试模块中的 SQL 测试对象');}
    else{
      step.test_object_ref=ref;
      ['sql','query','connection','database','params','parameters'].forEach(key=>delete step[key]);
      const assertions=readWebDataAssertions('db');
      if(assertions.length)step.assert=assertions;else delete step.assert;
      const extract=readWebDataExtractions('db');
      if(Object.keys(extract).length)step.extract=extract;else delete step.extract;
    }
  }
  if(['extract','page_extract','capture'].includes(step.action)){
    step.source=$('#webExtractSource')?.value||step.source||'text';
    step.save_as=($('#webExtractSaveAs')?.value||'').trim();
    step.attribute=$('#webExtractAttribute')?.value||'value';
    if(!step.save_as)delete step.save_as;
  }
  if(['goto','open','navigate'].includes(step.action))step.url=($('#webStepUrl')?.value||'').trim();
  if(step.action==='assert_text'){
    step.expected=$('#webStepExpected')?.value||'';
    step.operator=String($('#webStepAssertionOperator')?.value||step.operator||'contains').trim().toLowerCase();
    delete step.value;
  }
  if(['fill','input','assert_url','assert_error','press','popup_select_text'].includes(step.action)){
    step.value=$('#webStepValue')?.value||'';
    if(step.action==='press')step.key=step.value;
    if(step.action==='popup_select_text')step.option_label=step.value;
  }
  if(step.action==='wait')step.seconds=Math.max(0,Number($('#webStepSeconds')?.value)||0);
  if(step.action==='select'){
    const label=$('#webStepOptionLabel')?.value||'', value=$('#webStepOptionValue')?.value||'';
    if(label)step.option_label=label;else delete step.option_label;
    if(value)step.option_value=value;else delete step.option_value;
  }
  if(step.action==='upload')step.files=($('#webStepFiles')?.value||'').split(',').map(item=>item.trim()).filter(Boolean);
  if(step.action==='switch_tab'){
    step.index=Math.max(0,Number($('#webStepTabIndex')?.value)||0);
    const match=$('#webStepMatchUrl')?.value||''; if(match)step.match_url=match;else delete step.match_url;
  }
  if(step.action==='scroll'){
    const pointX=$('#webStepPointX')?.value, pointY=$('#webStepPointY')?.value;
    if(pointX!==''&&pointY!==''){step.x=Number(pointX)||0;step.y=Number(pointY)||0;}
    else{delete step.x;delete step.y;}
    step.delta_x=Number($('#webStepDeltaX')?.value)||0;
    step.delta_y=Number($('#webStepDeltaY')?.value)||0;
    const scrollScope=$('#webStepScrollScope')?.value||'';
    if(scrollScope)step.scroll_scope=scrollScope;else delete step.scroll_scope;
  }
  if(step.action==='screenshot')step.full_page=Boolean($('#webStepFullPage')?.checked);
  if(step.element){
    step.element.name=($('#webStepElementName')?.value||step.element.name||'元素').trim();
    step.element.locators=JSON.parse(JSON.stringify(_webStepEditorLocators));
  }
  return step;
}

function clearWebRecorderDropIndicators(){
  document.querySelectorAll('#webStepList .web-step').forEach(item=>{
    item.style.boxShadow='';
    delete item.dataset.dropPosition;
  });
}

function webRecorderDragStart(event,index){
  _webRecorderDragIndex=index;
  if(event?.dataTransfer){
    event.dataTransfer.effectAllowed='move';
    event.dataTransfer.setData('text/plain',String(index));
  }
}

function webRecorderDragOver(event,index){
  event.preventDefault();
  if(_webRecorderDragIndex===null||_webRecorderDragIndex===index)return;
  const target=event.currentTarget;
  const rect=target.getBoundingClientRect();
  const position=index===0?'after':(event.clientY<rect.top+rect.height/2?'before':'after');
  clearWebRecorderDropIndicators();
  target.dataset.dropPosition=position;
  target.style.boxShadow=position==='before'
    ? 'inset 0 3px 0 #4f46e5'
    : 'inset 0 -3px 0 #4f46e5';
  if(event.dataTransfer)event.dataTransfer.dropEffect='move';
}

function webRecorderDragLeave(event){
  if(event.currentTarget.contains(event.relatedTarget))return;
  event.currentTarget.style.boxShadow='';
  delete event.currentTarget.dataset.dropPosition;
}

function webRecorderDragEnd(){
  _webRecorderDragIndex=null;
  clearWebRecorderDropIndicators();
}

function webRecorderListDragOver(event){
  const list=event.currentTarget,rect=list.getBoundingClientRect();
  if(event.clientY<rect.top+36)list.scrollTop-=18;
  else if(event.clientY>rect.bottom-36)list.scrollTop+=18;
}

async function webRecorderDrop(event,toIndex){
  event.preventDefault();
  const fromIndex=_webRecorderDragIndex;
  const position=event.currentTarget.dataset.dropPosition||'before';
  _webRecorderDragIndex=null;
  clearWebRecorderDropIndicators();
  if(fromIndex===null||fromIndex<=0)return;
  const insertionIndex=toIndex+(position==='after'?1:0);
  const targetIndex=insertionIndex-(fromIndex<insertionIndex?1:0);
  if(targetIndex<=0||targetIndex===fromIndex)return;
  if(_webRecorderSession){
    try{
      const data=await req(`/web/recordings/${_webRecorderSession}/reorder-step`,{method:'POST',body:JSON.stringify({from_index:fromIndex,to_index:targetIndex})});
      applyWebRecorderSnapshot(data);
    }catch(e){alert(e.message);}
  }else{
    const step=_webRecorderSteps.splice(fromIndex,1)[0];
    _webRecorderSteps.splice(targetIndex,0,step); renderWebRecorderSteps();
    try{await persistWebRecorderDraft();}catch(e){alert('保存草稿排序失败：'+e.message);}
  }
}

async function buildInsertedWebProbeStep(){
  if(!_webRecorderProbe)return null;
  const supported=['click','double_click','fill','select','check','uncheck','upload','hover','press','assert_visible','assert_text','assert_url','assert_error'];
  let action=$('#webRecMode')?.value||'click';
  if(!supported.includes(action))action='click';
  const element=embeddedProbeElement();
  const label=_webRecorderProbe.name||_webRecorderProbe.accessible_name||_webRecorderProbe.text||'元素';
  const prefixes={click:'点击',double_click:'双击',fill:'输入',select:'选择',check:'勾选',uncheck:'取消勾选',upload:'上传文件',hover:'悬停',press:'按键'};
  const step={
    id:`manual_${Date.now()}_${Math.floor(Math.random()*10000)}`,
    action,
    name:`${prefixes[action]||action} ${label}`,
    element,
    timeout:10000,
  };
  if(action==='fill'){
    let value=$('#webProbeInput')?.value||'';
    if(!value){value=window.prompt('请输入要填入的文本','');if(value===null)return null;}
    step.value=value;
  }else if(action==='select'){
    const value=window.prompt('请输入下拉选项显示文本','');if(value===null)return null;
    step.option_label=value;
  }else if(action==='press'){
    const value=window.prompt('请输入按键，例如 Enter、Tab、Escape','Enter');if(value===null)return null;
    step.value=value;step.key=value;
  }else if(action==='upload'){
    const value=window.prompt('请输入容器可访问的文件路径（多文件逗号分隔），建议将文件放入 auto-test/uploads 后填写 /app/uploads/<文件名>','/app/uploads/身份证正面.png, /app/uploads/身份证反面.png');if(value===null)return null;
    step.files=value.split(',').map(item=>item.trim()).filter(Boolean);
  }
  return step;
}

async function insertWebProbeStep(referenceIndex,position){
  if(!_webRecorderProbe){
    alert('请先选择“仅探测元素”并点击实时画面，或先执行一次元素操作');
    return;
  }
  const step=await buildInsertedWebProbeStep();
  if(!step)return;
  const insertIndex=position==='before'?referenceIndex:referenceIndex+1;
  if(insertIndex===0){alert('首个打开页面步骤必须保留在第一位');return;}
  await appendWebRecorderStep(step,insertIndex);
}

async function deleteWebRecorderStep(index){
  if(index===0&&_webRecorderSteps[0]?.action==='goto') return;
  if(_webRecorderSession){

      const data=await req(`/web/recordings/${_webRecorderSession}/steps/${index}`,{method:'DELETE'});
      applyWebRecorderSnapshot(data);
    }catch(e){ alert(e.message); }

    _webRecorderSteps.splice(index,1); renderWebRecorderSteps();
    try{await persistWebRecorderDraft();}catch(e){alert('保存草稿步骤失败：'+e.message);}

}

function syncWebRecorderInsertPositionMode(){

function confirmWebRecorderInsertPosition(){

async function addWebComponent(type){
  let step={id:`manual_${Date.now()}`,action:type,name:type};
  if(type==='wait'){
    const seconds=window.prompt('等待秒数','1'); if(seconds===null)return;
    step={...step,name:`等待 ${seconds} 秒`,seconds:Number(seconds)||1};
  }else if(type==='assert_url'){
    const value=window.prompt('URL 应包含',''); if(value===null)return;
    step={...step,name:`断言 URL 包含 ${value}`,value};
  }else if(type==='assert_text'){
    const value=window.prompt('请输入接口/数据库提取变量或固定期望值','${apiName}'); if(value===null)return;
    step={...step,name:`断言页面内容 ${value}`,expected:value,operator:'contains'};
  }else if(type==='assert_error'){
    step={...step,name:'禁止出现任意页面提示',value:''};
  }else if(type==='screenshot') step={...step,name:'保存步骤截图'};
  else if(type==='api') step={...step,name:'接口执行',test_object_ref:{target_type:'api'},extract:{},timeout:10000};
  else if(type==='db') step={...step,name:'数据库查询',test_object_ref:{target_type:'sql'},extract:{},timeout:10000};
  const insertIndex=_webRecorderSteps.length
    ? await openWebRecorderInsertPositionDialog(step)
    : 0;
  if(insertIndex===null)return;
  await appendWebRecorderStep(step,insertIndex);
  if(['api','db'].includes(type))editWebRecorderStep(insertIndex);
}

async function appendWebRecorderStep(step,index=null){
  if(_webRecorderSession){
    try{
      const body={step}; if(index!==null)body.index=index;
      const data=await req(`/web/recordings/${_webRecorderSession}/steps`,{method:'POST',body:JSON.stringify(body)});
      applyWebRecorderSnapshot(data);
    }catch(e){ alert(e.message); }
  }else{
    if(index===null)_webRecorderSteps.push(step);else _webRecorderSteps.splice(index,0,step);
    renderWebRecorderSteps();
    try{await persistWebRecorderDraft();}catch(e){alert('保存草稿步骤失败：'+e.message);}
  }
}

async function saveWebRecordedFlow(options={}){

async function saveWebRecordedFlowAs(){
  if(!_webRecorderSteps.length){ alert('没有可保存的录制步骤'); return null; }
  const input=$('#webFlowFile');
  const original=(input?.value||'').trim();
  const stem=(original||'test_recorded').replace(/\.(ya?ml)$/i,'');
  const suggested=`${stem}_copy.yaml`;
  const filename=(prompt('请输入另存的 YAML 文件名', suggested)||'').trim();

  if(input)input.value=filename;

async function restartWorker(){
  const count = $('#workerCountSelect') ? $('#workerCountSelect').value : 1;
  if(!confirm(`确认重启 Worker？\n\n将执行以下操作：\n1. 检查 Redis（不可用则自动启动）\n2. 杀掉所有僵尸 pytest/playwright 进程和旧 worker\n3. 清空 Redis 队列\n4. 重新派发所有 pending 任务\n5. 自动启动 ${count} 个新 worker 进程`)) return;
  const el = $('#workerResult');
  if(el) el.innerHTML = '<span class="text-slate-400">⏳ 正在检查 Redis 并重启 Worker...</span>';
  try{
    const r = await req(`/worker/restart?worker_count=${count}&auto_start=true`,{method:'POST'});
    const killed = r.killed_processes && r.killed_processes.length>0 ? r.killed_processes.join(', ') : '无';
    const dispatched = r.redispatched && r.redispatched.length>0 ? r.redispatched.join(', ') : '无';
    const status = r.worker_alive ? `🟢 运行中 (${r.worker_count} 个)` : '🔴 未运行';
    // Redis 启动信息
    let redisInfo = r.redis_ok ? '🟢 在线' : '🔴 离线';
    if(r.redis_result){
      if(r.redis_result.ping_ok){
        redisInfo = `🟢 已自动启动 (${r.redis_result.method})`;
      } else {
        redisInfo = `❌ 自动启动失败<br><span class="text-red-500 text-xs">${esc(r.redis_result.detail||'').slice(0,200)}</span>`;
      }
    }
    // Worker 启动信息
    let startInfo = '未启动';
    if(r.start_result){
      const started = r.start_result.started || [];
      const errors = r.start_result.errors || [];
      const pids = started.map(s => `PID:${s.pid}`).join(', ');
      startInfo = started.length > 0
        ? `✅ 已启动 ${started.length} 个 (${pids})`
        : '❌ 启动失败';
      if(errors.length > 0) startInfo += `<br><span class="text-red-500 text-xs">${errors.join('; ')}</span>`;
    }
    if(el) el.innerHTML = `
      <div class="p-3 bg-${r.worker_alive?'green':'red'}-50 border border-${r.worker_alive?'green':'red'}-200 rounded">
        <p><b>✅ 重启完成</b></p>
        <p class="mt-1">Redis：${redisInfo}</p>
        <p>Worker 状态：${status}</p>
        <p>杀掉进程：${killed}</p>
        <p>清理队列：${r.queue_cleared} 条</p>
        <p>重派任务：${dispatched}</p>
        <p>新启动：${startInfo}</p>
        <p class="mt-1 text-xs text-slate-500">${r.message}</p>
      </div>`;
    // 刷新设置页面
    setTimeout(()=>settings(), 2000);
  }catch(e){
    if(el) el.innerHTML = `<div class="p-3 bg-red-50 border border-red-200 rounded">❌ 重启失败：${e.message}</div>`;
  }
}

  const days = $('#retentionDays') ? parseInt($('#retentionDays').value) : 30;
  const action = dryRun ? '试运行' : '清理';
  if(!dryRun && !confirm(`确认清理 ${days} 天前的日志？\n\n此操作将删除以下目录中超过 ${days} 天的文件：\n• logs/ - 任务日志\n• logs/workers/ - Worker 日志\n• screenshots/ - 截图\n• reports/allure-results/ - Allure 结果\n• reports/allure-report/ - Allure 报告\n\n正在使用的文件会被跳过（不影响平台运行）。`)) return;
  const el = $('#logCleanupResult');
  if(el) el.innerHTML = `<span class="text-slate-400">⏳ 正在${action}...</span>`;
  try{
    const r = await req(`/logs/cleanup?retention_days=${days}&dry_run=${dryRun}`,{method:'POST'});
    let html = `<div class="p-3 bg-${r.total_deleted>0?'green':'slate'}-50 border border-${r.total_deleted>0?'green':'slate'}-200 rounded">
      <p><b>${dryRun?'👁 试运行结果':'✅ 清理完成'}</b> (保留 ${r.retention_days} 天)</p>
      <p class="mt-1">共${dryRun?'将':''}删除：<b>${r.total_deleted}</b> 个文件，释放 <b>${r.total_freed_human}</b></p>
      <table class="w-full text-xs mt-2">
        <thead class="bg-slate-100"><tr><th class="text-left p-1">目录</th><th class="text-right p-1">删除</th><th class="text-right p-1">跳过</th><th class="text-right p-1">释放</th></tr></thead><tbody>`;
    for(const t of r.results){
      if(t.deleted>0 || t.skipped>0){
        html += `<tr class="border-b"><td class="p-1 font-mono">${t.path}</td><td class="p-1 text-right">${t.deleted}</td><td class="p-1 text-right">${t.skipped}</td><td class="p-1 text-right">${t.freed_human}</td></tr>`;
      }
    }
    html += `</tbody></table></div>`;
    if(el) el.innerHTML = html;
    // 刷新统计
    loadLogStats();
  }catch(e){
    if(el) el.innerHTML = `<p class="text-red-500">❌ ${action}失败：${e.message}</p>`;
  }
}

function positionLoadTestGuide(){
  const panel = $('#loadTestGuidePanel');
  if(!panel) return;
  const toggle = document.querySelector('.load-test-guide-toggle');
  let hostWindow = window;
  try{ if(window.parent && window.parent!==window) hostWindow=window.parent; }catch(e){}
  const viewport = hostWindow.visualViewport;
  const visibleWidth = Number(viewport?.width||window.innerWidth);
  const visibleHeight = Number(viewport?.height||window.innerHeight);
  const offsetLeft = Number(viewport?.offsetLeft||0);
  const offsetTop = Number(viewport?.offsetTop||0);
  const clipped = visibleWidth + 1 < window.innerWidth || visibleHeight + 1 < window.innerHeight;
  panel.classList.toggle('viewport-clipped', clipped);
  if(clipped){
    const right = Math.max(8,window.innerWidth-offsetLeft-visibleWidth+8);
    panel.style.right = `${right}px`;
    panel.style.top = `${Math.max(8,offsetTop+8)}px`;
    panel.style.bottom = `${Math.max(8,window.innerHeight-offsetTop-visibleHeight+8)}px`;
    panel.style.width = `${Math.min(390,Math.max(0,visibleWidth-16))}px`;
    if(toggle){
      toggle.style.right = `${right}px`;
      toggle.style.top = `${offsetTop+visibleHeight/2}px`;
    }
  }else{
    panel.style.removeProperty('right');
    panel.style.removeProperty('top');
    panel.style.removeProperty('bottom');
    panel.style.removeProperty('width');
    if(toggle){
      toggle.style.removeProperty('right');
      toggle.style.removeProperty('top');
    }
  }
}

function availableLoadTestAgents(){
  return (_loadTestCapabilities.load_agents || []).filter(agent=>agent.available!==false && Number(agent.max_vus||0)>0);
}

function selectedLoadTestAgentCapacity(){
  const agents = availableLoadTestAgents();
  const count = Math.max(0, Number($('#loadTestAgentCount')?.value||0));
  const selected = count ? agents.slice(0, count) : agents;
  const configuredMax = Number(_loadTestCapabilities.max_distributed_vus||5000);
  return Math.min(configuredMax, selected.reduce((total,agent)=>total+Number(agent.max_vus||0),0));
}

function renderLoadTestAgentOptions(){
  const select = $('#loadTestAgentCount');
  if(!select) return;
  const previous = Number(select.value||0);
  const agents = availableLoadTestAgents();
  let capacity = 0;
  const options = ['<option value="0">自动选择</option>'];
  agents.forEach((agent,index)=>{
    capacity += Number(agent.max_vus||0);
    options.push(`<option value="${index+1}">${index+1} 个节点 · ${Math.min(capacity,Number(_loadTestCapabilities.max_distributed_vus||5000))} VU</option>`);
  });
  select.innerHTML = options.join('');
  select.value = String(previous > 0 && previous <= agents.length ? previous : 0);
}

function renderLoadTestCapacity(){
  const local = Number(_loadTestCapabilities.max_api_vus||200);
  const distributed = Number(_loadTestCapabilities.distributed_capacity_vus||0);
  const distributedMax = Number(_loadTestCapabilities.max_distributed_vus||5000);
  const ui = Number(_loadTestCapabilities.max_ui_vus||20);
  const vumEnforced = _loadTestCapabilities.vum?.enforced !== false;
  const vum = Number(_loadTestCapabilities.vum?.available_vum_num||0);
  const vumLabel = vumEnforced ? `${vum} VUM` : '本地不限额';
  const capacity = $('#loadTestCapacity');
  if(capacity) capacity.textContent = `本机 ${local} / 分布式 ${distributed} / 页面 ${ui} VU · VUM ${vumLabel}`;
  if($('#loadTestGuideLocal')) $('#loadTestGuideLocal').textContent = `${local} VU`;
  if($('#loadTestGuideDistributed')) $('#loadTestGuideDistributed').textContent = `${distributed} / ${distributedMax} VU`;
  if($('#loadTestGuideAgents')) $('#loadTestGuideAgents').textContent = `${Number(_loadTestCapabilities.available_load_agents||0)} 个`;
  if($('#loadTestGuideUi')) $('#loadTestGuideUi').textContent = `${ui} VU`;
  if($('#loadTestGuideVum')) $('#loadTestGuideVum').textContent = vumLabel;
  if($('#loadTestGuideVumNote')) $('#loadTestGuideVumNote').textContent = vumEnforced
    ? '升压、稳态和降压均按平均活跃 VU 计入 VUM 消耗。'
    : '本地自托管模式不扣减 VUM，实际并发仍受负载节点容量和安全上限约束。';
  const status = $('#loadTestGuideStatus');
  if(status){
    const ready = distributed >= distributedMax;
    const perAgent = Math.max(1, Number(availableLoadTestAgents()[0]?.max_vus||500));
    const missing = Math.max(0, Math.ceil((distributedMax-distributed)/perAgent));
    status.style.borderLeftColor = ready ? '#16a34a' : '#d97706';
    status.textContent = ready
      ? `分布式协议池已就绪，可配置最高 ${distributedMax} VU。`
      : `当前分布式容量 ${distributed} VU；达到 ${distributedMax} VU 还需要约 ${missing} 个 ${perAgent} VU 节点。`;
  }
}

function updateLoadTestExecutionCapacity(){
  const scenario = _loadTestScenarios.find(item=>item.filename===getSelectedLoadTestCases()[0]);
  const mode = $('#loadTestMode')?.value || 'auto';
  const browserMode = Boolean(scenario?.has_browser) || mode==='ui' || mode==='mixed';
  const execution = $('#loadTestExecution');
  const agents = $('#loadTestAgentCount');
  const hint = $('#loadTestExecutionHint');
  const distributedOption = execution?.querySelector('option[value="distributed"]');
  const localLimit = Number(_loadTestCapabilities.max_api_vus||200);
  let limit = localLimit;
  if(browserMode){
    if(distributedOption) distributedOption.disabled = true;
    if(execution?.value==='distributed') execution.value='auto';
    if(agents) agents.disabled=true;
    limit=Number(_loadTestCapabilities.max_ui_vus||20);
    if(hint) hint.textContent=`真实页面/混合链路使用浏览器执行器，最多 ${limit} VU；多场景会在每轮按权重切换业务链路。`;
  }else{
    if(distributedOption) distributedOption.disabled = false;
    const executionMode=execution?.value||'auto';
    if(agents) agents.disabled=executionMode==='local';
    const distributed=selectedLoadTestAgentCapacity();
    if(executionMode==='local'){
      limit=localLimit;
      if(hint) hint.textContent=`本机协议执行，当前上限 ${limit} VU。`;
    }else if(executionMode==='distributed'){
      limit=distributed;
      if(hint) hint.textContent=distributed?`分布式协议执行，所选节点可承载 ${distributed} VU。`:'当前没有可用的分布式负载节点。';
    }else{
      limit=Math.max(localLimit,distributed);
      if(hint) hint.textContent=`自动调度：${localLimit} VU 以内本机执行，超过后按节点容量分片，当前最高 ${limit} VU。`;
    }
  }
  const vus=$('#loadTestVus');
  if(vus){
    vus.max=String(Math.max(1,limit));
    if(Number(vus.value)>Math.max(1,limit)) vus.value=String(Math.max(1,limit));
  }
  updateLoadTestVumEstimate();
}

function validateLoadTestQuickRun(caseFile, runtimeVariables){
  if(!caseFile) throw new Error('请先选择业务链路场景');
  if(!runtimeVariables || typeof runtimeVariables !== 'object' || Array.isArray(runtimeVariables)) throw new Error('运行变量必须是 JSON 对象');
  const mode = $('#loadTestQuickMode')?.value || 'auto';
  const scenario = _loadTestScenarios.find(item => item.filename === caseFile);
  if(!scenario) throw new Error('所选业务链路不存在或已被删除');
  if(mode === 'ui' && !scenario.has_browser) throw new Error('页面模式必须选择包含浏览器步骤的业务链路');
  return true;
}

function applyLoadTestQuickConfig(){
  const mode = $('#loadTestQuickMode')?.value || 'auto';
  const level = $('#loadTestQuickLevel')?.value || '20';
  const vus = Math.max(1, Number(level));
  const apiUrl = ($('#loadTestQuickApiUrl')?.value || '').trim();
  const pageUrl = ($('#loadTestQuickPageUrl')?.value || '').trim();
  const desired = mode === 'ui' ? item => item.has_browser : mode === 'protocol' ? item => !item.has_browser : () => true;
  const targetScenario = _loadTestScenarios.find(item => desired(item));
  if(targetScenario){
    const list = $('#loadTestCaseList');
    if(list){
      list.querySelectorAll('input[data-scenario]').forEach(input => {
        input.checked = input.dataset.scenario === targetScenario.filename;
      });
      loadTestScenarioChanged();
    }
  }
  if($('#loadTestVus')) $('#loadTestVus').value = String(vus);
  if($('#loadTestMode')) $('#loadTestMode').value = mode;
  if($('#loadTestBaseUrl')) $('#loadTestBaseUrl').value = mode === 'protocol' ? apiUrl : pageUrl || apiUrl;
  updateLoadTestExecutionCapacity();
  updateLoadTestVumEstimate();
  const hint = $('#loadTestQuickHint');
  if(hint) hint.textContent = '快速配置已发生变化，已同步到高级配置；可继续调整场景权重、SLA 和参数化数据。';
}

function plannedLoadTestVum(){
  const vus = Math.max(1, Number($('#loadTestVus')?.value||1));
  const rampUp = Math.max(0, Number($('#loadTestRampUp')?.value||0));
  const duration = Math.max(1, Number($('#loadTestDuration')?.value||1));
  const rampDown = Math.max(0, Number($('#loadTestRampDown')?.value||0));
  return Math.max(1, Math.ceil(vus * (duration + (rampUp + rampDown) / 2) / 60));
}

function updateLoadTestVumEstimate(){
  const element = $('#loadTestVumEstimate');
  if(!element) return;
  const planned = plannedLoadTestVum();
  const enforced = _loadTestCapabilities.vum?.enforced !== false;
  const available = Number(_loadTestCapabilities.vum?.available_vum_num||0);
  const enough = !enforced || planned <= available;
  element.className = `rounded border px-3 py-2 text-xs ${enough?'border-indigo-100 bg-indigo-50 text-indigo-700':'border-red-200 bg-red-50 text-red-600'}`;
  element.textContent = enforced
    ? `本次预计消耗 ${planned} VUM · 团队可用 ${available} VUM`
    : `本次负载规模约 ${planned} VUM · 本地自托管模式不限额，不会扣减团队余额`;
  updateLoadTestStartButton();
}

function loadTestScenarioChanged(){
  const selected = getSelectedLoadTestCases();
  const scenarios = _loadTestScenarios.filter(item=>selected.includes(item.filename));
  const info = $('#loadTestScenarioInfo');
  const weights = $('#loadTestScenarioWeights');
  if(!scenarios.length){ if(info) info.textContent='请勾选一条或多条业务链路'; if(weights) weights.innerHTML=''; updateLoadTestExecutionCapacity(); return; }
  if($('#loadTestMode')) $('#loadTestMode').value = 'auto';
  if(info) info.innerHTML = `<div class="font-medium mb-2">已勾选 ${scenarios.length} 条业务链路，运行时按权重分配给 VU</div>${scenarios.map(item=>`<div class="flex flex-wrap gap-2"><span class="badge bg-indigo-50 text-indigo-700">${esc(loadTestModeLabel(item.recommended_mode))}</span><span>${esc(item.name||item.filename)} · ${item.step_count} 步</span></div>`).join('')}`;
  if(weights){
    const existing = Object.fromEntries([...weights.querySelectorAll('input[data-scenario]')].map(input=>[input.dataset.scenario,input.value]));
    weights.innerHTML = `<div class="text-xs font-medium text-slate-600">场景权重</div>${scenarios.map(item=>`<label class="flex items-center gap-2 text-xs text-slate-600"><span class="truncate flex-1">${esc(item.name||item.filename)}</span><input data-scenario="${escAttr(item.filename)}" type="number" min="1" max="100" value="${escAttr(existing[item.filename]||'1')}" class="w-20 border rounded px-2 py-1"></label>`).join('')}`;
  }
  updateLoadTestExecutionCapacity();
  updateLoadTestStartButton();
}

function parseLoadTestJson(id, fallback){
  const raw = ($(id)?.value || '').trim();
  if(!raw) return fallback;
  try{ return JSON.parse(raw); }
  catch(e){ throw new Error(`${id==='#loadTestDataRows'?'数据行':'运行变量'} JSON 格式错误：${e.message}`); }
}

async function generateLoadTestDataAsset(){
  const btn = $('#loadTestGenDataBtn');
  const count = Math.max(1, Number($('#loadTestVus')?.value||1));
  if(btn){ btn.disabled=true; btn.textContent='生成中...'; }
  try{
    const res = await req('/test-data/generate',{method:'POST',body:JSON.stringify({type:'PHONE', count, fields:['phone','code'], api_url:($('#loadTestDataCenterApi')?.value||'').trim(), code_length:Number($('#loadTestCodeLength')?.value||6)})});
    alert(`已生成 ${res.count||count} 行合规数据并存入测试数据中心（资产 ${res.asset_id||''}）。\n现在勾选"从测试数据中心取真实数据"并启动压测即可提取。`);
  }catch(e){ alert('生成失败：'+e.message); }

function updateLoadTestStartButton(){
  const btn = $('#loadTestStartBtn');
  if(!btn) return;
  const cases = getSelectedLoadTestCases();
  let reason = '';
  if(!cases.length) reason = '请先勾选业务链路';
  else{
    const enforced = _loadTestCapabilities.vum?.enforced !== false;
    const planned = plannedLoadTestVum();
    const available = Number(_loadTestCapabilities.vum?.available_vum_num||0);
    if(enforced && planned>available) reason = `VUM 不足（需 ${planned} / 可用 ${available}）`;
    else if(!Number($('#loadTestVus')?.value||0)) reason = 'VU 数必须大于 0';
  }
  btn.disabled = !!reason;
  btn.textContent = reason ? `启动全链路压测（${reason}）` : '启动全链路压测';
  btn.title = reason || '';
}

function onLoadTestDistributedToggle(){

async function startLoadTest(){
  const caseFiles = getSelectedLoadTestCases();
  const caseFile = caseFiles[0] || '';
  if(!caseFiles.length){ alert('请至少勾选一条业务链路'); return; }
  const button = $('#loadTestStartBtn');
  if(button){ button.disabled=true; button.textContent='启动中...'; }
  try{
    const runtimeVariables = parseLoadTestJson('#loadTestVariables', {});
    const dataRows = parseLoadTestJson('#loadTestDataRows', []);
    if(!runtimeVariables || Array.isArray(runtimeVariables) || typeof runtimeVariables!=='object') throw new Error('运行变量必须是 JSON 对象');
    if(!Array.isArray(dataRows)) throw new Error('数据行必须是 JSON 数组');
    const enforced = _loadTestCapabilities.vum?.enforced !== false;
    const planned = plannedLoadTestVum();
    const available = Number(_loadTestCapabilities.vum?.available_vum_num || 0);
    if(enforced && planned>available) throw new Error(`预计消耗 ${planned} VUM，团队可用 ${available} VUM`);
    const scenarioWeights = Object.fromEntries([...document.querySelectorAll('#loadTestScenarioWeights input[data-scenario]')].map(input=>[input.dataset.scenario, Number(input.value||1)]));
    const vus = Number($('#loadTestVus')?.value||1);
    let dataAssetAlias = ($('#loadTestUseDataAsset')?.checked ? ($('#loadTestDataAssetAlias')?.value||'').trim() : '');
    const dataCenterApi = ($('#loadTestDataCenterApi')?.value||'').trim();
    if(!dataAssetAlias){
      if(button) button.textContent = '自动生成参数化数据...';
      try{
        const genRes = await req('/test-data/generate',{method:'POST',body:JSON.stringify({type:'PHONE', count:vus, fields:['phone','code'], api_url:dataCenterApi, code_length:Number($('#loadTestCodeLength')?.value||6)})});
        dataAssetAlias = genRes.asset_id || '';
      }catch(e){ console.warn('自动生成数据失败，将使用 fallback 数据', e); }
    }
    const sla = {};
    if($('#loadTestMinTps')?.value!=='') sla.min_tps=Number($('#loadTestMinTps').value);
    if($('#loadTestMaxP95')?.value!=='') sla.max_p95_ms=Number($('#loadTestMaxP95').value);
    if($('#loadTestMaxErrors')?.value!=='') sla.max_error_rate=Number($('#loadTestMaxErrors').value);
    const monitoring = {};
    if($('#loadTestMonitoringEnabled')?.checked){
      const url = ($('#loadTestMonitoringUrl')?.value||'').trim();
      if(url) monitoring.enabled = true, monitoring.prometheus_url = url;
    }
    const multiProtoEnabled = $('#loadTestMultiProtoEnable')?.checked || false;
    const distributedEnabled = $('#loadTestDistributedEnable')?.checked || false;
    const execMode = distributedEnabled ? 'distributed' : ($('#loadTestExecution')?.value || 'auto');
    const agentCount = distributedEnabled ? Number($('#loadTestDistributedAgents')?.value||0) : Number($('#loadTestAgentCount')?.value||0);
    const result = await req('/load-tests/runs',{method:'POST',body:JSON.stringify({
      team_id: localStorage.getItem('team_id')||'',
      project_id: currentProject,
      case_file: caseFile,
      case_files: caseFiles,
      scenario_weights: scenarioWeights,
      mode: multiProtoEnabled ? 'auto' : ($('#loadTestMode')?.value || 'auto'),
      execution_mode: execMode,
      agent_count: agentCount,
      virtual_users: Number($('#loadTestVus')?.value||1),
      ramp_up_seconds: Number($('#loadTestRampUp')?.value||0),
      duration_seconds: Number($('#loadTestDuration')?.value||60),
      ramp_down_seconds: Number($('#loadTestRampDown')?.value||0),
      think_time_ms: Number($('#loadTestThinkTime')?.value||0),
      pacing_seconds: Number($('#loadTestPacing')?.value||0),
      pacing_random_pct: Number($('#loadTestPacingRandom')?.value||0),
      rendezvous_enabled: Boolean($('#loadTestRendezvous')?.checked),
      iterations_per_user: Number($('#loadTestIterations')?.value||0),
      headless: Boolean($('#loadTestHeadless')?.checked),
      base_url: ($('#loadTestBaseUrl')?.value||'').trim(),
      runtime_variables: runtimeVariables,
      data_rows: dataRows,
      data_assignment_mode: $('#loadTestDataMode')?.value || 'unique',
      data_asset_alias: dataAssetAlias,
      data_center_api_url: dataCenterApi,
      goal: {
        target_tps: Number($('#loadTestGoalTps')?.value||0) || Math.max(1, vus),
        target_p95_ms: Number($('#loadTestGoalP95')?.value||0) || 3000,
        max_vus: Number($('#loadTestGoalMaxVus')?.value||0) || Math.max(vus, vus*3)
      },
      ip_spoofing: {
        proxies: ($('#loadTestIpProxies')?.value||'').split('\n').map(s=>s.trim()).filter(Boolean)
      },
      breakpoints: $('#loadTestBreakpointEnable')?.checked ? ['*'] : [],
      protocols: multiProtoEnabled ? {
        websocket: $('#loadTestProtoWebSocket')?.checked || false,
        database: $('#loadTestProtoDatabase')?.checked || false,
        http: true
      } : {http: true},
      sla,
      monitoring
    })});
    if(_loadTestCapabilities.vum?.enforced !== false && result.config?.remaining_vum != null){
      _loadTestCapabilities.vum.available_vum_num=Number(result.config.remaining_vum||0);
    }
    renderLoadTestCapacity();
    updateLoadTestVumEstimate();
    _loadTestSelectedRunId = result.id;
    if(result.config?.distributed_fallback_reason){
      toast(result.config.distributed_fallback_reason);
    }
    if(result.config?.multi_protocol_detected){
      toast('检测到多协议步骤，将混合执行');
    }
    await refreshLoadTestPage();
  }catch(e){ alert('压测启动失败：' + e.message); }
  finally{ if(button){ button.disabled=false; button.textContent='启动全链路压测'; } }
}

async function refreshLoadTestPage(){
  const selector = document.getElementById('loadTestRunSelector');
  const detail = document.getElementById('loadTestDetail');
  if(!selector || !detail) return;
  try{
    const runs = await req(`/load-tests/runs?project_id=${encodeURIComponent(currentProject)}&limit=50`);
    if(!_loadTestSelectedRunId && runs.length) _loadTestSelectedRunId = runs[0].id;
    if(!runs.some(run => run.id === _loadTestSelectedRunId) && runs.length) _loadTestSelectedRunId = runs[0].id;
    selector.innerHTML = runs.map(run => {
      const summary = run.summary || {};
      const config = run.config || {};
      const statusLabel = ({
        pending:'等待启动', running:'运行中', stopping:'停止中', completed:'已完成',
        failed:'启动失败', stopped:'已停止', interrupted:'服务中断'
      })[run.status] || run.status || '-';
      const label = `${run.scenario_name || run.case_file || run.id} · ${Number(config.virtual_users || 0)} VU · TPS ${loadNumber(summary.tps)} · ${statusLabel}`;
      return `<option value="${escAttr(run.id)}" ${run.id === _loadTestSelectedRunId ? 'selected' : ''}>${esc(label)}</option>`;
    }).join('') || '<option value="">暂无压测记录</option>';
    if(_loadTestSelectedRunId){
      const selected = await req(`/load-tests/runs/${encodeURIComponent(_loadTestSelectedRunId)}`);
      renderLoadTestDetail(selected);
    }else{
      detail.innerHTML = '<div class="p-8 text-center text-slate-400">还没有压测记录</div>';
    }
  }catch(e){ detail.innerHTML=`<div class="p-5 text-red-500">${esc(e.message)}</div>`; }
}
