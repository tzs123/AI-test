async function showLoadTestCompare(){
  const runs = await req(`/load-tests/runs?project_id=${encodeURIComponent(currentProject)}&limit=50`);
  const options = runs.map(r=>`<label class="flex items-center gap-2 text-sm"><input type="checkbox" value="${escAttr(r.id)}" class="rounded compare-cb"> ${esc(r.scenario_name||r.case_file||r.id)} · ${r.status}</label>`).join('');
  const dlg = document.createElement('div');
  dlg.className = 'fixed inset-0 bg-black/40 flex items-center justify-center z-50';
  dlg.innerHTML = `<div class="bg-white rounded-lg p-6 max-w-lg w-full mx-4 max-h-[80vh] overflow-auto"><h3 class="font-semibold text-lg mb-3">选择压测记录对比（最多 10 条）</h3><div class="space-y-2 mb-4">${options}</div><div class="flex gap-2 justify-end"><button onclick="this.closest('.fixed').remove()" class="border px-4 py-2 rounded text-sm">取消</button><button id="compareGoBtn" class="bg-indigo-600 text-white px-4 py-2 rounded text-sm">对比</button></div></div>`;
  document.body.appendChild(dlg);
  dlg.querySelector('#compareGoBtn').onclick = async ()=>{
    const ids = [...dlg.querySelectorAll('.compare-cb:checked')].map(cb=>cb.value);
    if(!ids.length){ alert('请至少选择 2 条'); return; }
    dlg.remove();
    const result = await req(`/load-tests/runs/compare?ids=${encodeURIComponent(ids.join(','))}`);
    renderLoadTestCompare(result.runs, ids);
  };
}

function renderLoadTestCompare(runs, ids){
  const el = $('#loadTestDetail');
  if(!el) return;
  const cols = ['scenario_name','status','virtual_users','completed','passed','failed','tps','avg_ms','p95_ms','p99_ms','error_rate','chain_success_rate'];
  const labels = {scenario_name:'场景',status:'状态',virtual_users:'VU',completed:'执行',passed:'通过',failed:'失败',tps:'TPS',avg_ms:'平均ms',p95_ms:'P95',p99_ms:'P99',error_rate:'错误率%',chain_success_rate:'链路成功率%'};
  const best = {};
  for(const col of ['tps','chain_success_rate']){
    best[col] = Math.max(...runs.filter(r=>r[col]!=null).map(r=>Number(r[col]||0)));
  }
  for(const col of ['avg_ms','p95_ms','p99_ms','error_rate']){
    const vals = runs.filter(r=>r[col]!=null).map(r=>Number(r[col]||0)).filter(v=>v>0);
    best[col] = vals.length ? Math.min(...vals) : 0;
  }
  el.innerHTML = `<div class="text-left">
    <div class="flex items-center justify-between mb-4"><h3 class="font-semibold text-lg">压测对比报告</h3><button onclick="refreshLoadTestPage()" class="border px-3 py-1.5 rounded text-sm">返回</button></div>
    <div class="overflow-auto border rounded">
      <table class="w-full text-sm text-center">
        <thead class="bg-slate-100"><tr><th class="p-2 text-left">指标</th>${runs.map(r=>`<th class="p-2">${esc(r.scenario_name||r.id)}${r.error?'<br><span class="text-red-500 text-xs">'+esc(r.error)+'</span>':''}</th>`).join('')}</tr></thead>
        <tbody>
          ${cols.map(col=>`<tr class="border-t"><td class="p-2 text-left font-medium text-slate-600">${labels[col]||col}</td>${runs.map(r=>{
            const val = r[col];
            const num = Number(val||0);
            const isBest = best[col]!=null && num===best[col] && num>0;
            return `<td class="p-2 ${isBest?'bg-green-100 font-bold text-green-700':''}">${val!=null?loadNumber(val):'-'}</td>`;
          }).join('')}</tr>`).join('')}
        </tbody>
      </table>
    </div>
    <p class="mt-3 text-xs text-slate-400">绿色高亮表示该指标最优（TPS/链路成功率最高，响应时间/错误率最低）。</p>
  </div>`;
}

function toast(msg){
  const t = document.createElement('div');
  t.className = 'fixed bottom-4 right-4 bg-slate-800 text-white px-4 py-2 rounded text-sm z-50';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}

// ===== 系统信息条 =====
function updateSysInfo(s){
  const workerIcon = s.worker_alive ? '🟢' : '🔴';
  const el = $('#sysInfo');
  if(el) el.innerHTML = `Worker ${workerIcon} · Redis ${s.redis?'🟢':'🔴'} · 队列 ${s.queue_length}`;
}

async function loadSysInfo(){
  try{
    const s = await req('/status');
    updateSysInfo(s);
  }catch{ $('#sysInfo').textContent = '后端未连接'; }
}
setInterval(loadSysInfo, 10000);

// ===== 启动 =====
function boot(){
  const initialPage = pageFromLocation();
  const canonicalRoute = routePages[routeSegment()]===initialPage;
  showPage(initialPage, canonicalRoute ? 'none' : 'replace');
  // The project selector is not needed to paint the first screen.  Start it
  // after the browser has had one frame to render the page shell, so it does
  // not compete with the dashboard's initial requests.
  afterFirstPaint(() => loadGlobalProj().catch(()=>{}));
  if(initialPage !== 'dashboard') loadSysInfo();
}
boot();
</script>
</body>
