<script>
  const standaloneManual = window.location.pathname.includes('/auto-test/loadrunner-manual') || new URLSearchParams(window.location.search).get('embedded') === '1';
  if (window.top === window.self && !standaloneManual) {
    const route = window.location.pathname + window.location.search + window.location.hash;
    const params = new URLSearchParams({module: 'ui-automation', route});
    window.location.replace(`${window.location.origin}/#/index?${params.toString()}`);
  }
</script>
<script>
  (() => {
    const themeStorageKeys = ['runnergo-theme-selection', 'theme_color', 'theme'];
    const themeMessageType = 'runnergo-theme-change';
    const normalizeTheme = value => value === 'white' || value === 'light' ? 'light' : 'dark';
    const readTheme = () => {
      try {
        for (const key of themeStorageKeys) {
          const value = window.localStorage.getItem(key);
          if (value === 'white' || value === 'dark') return normalizeTheme(value);
        }
      } catch (error) {}
      return 'dark';
    };
    const applyTheme = value => {
      const theme = normalizeTheme(value);
      if (document.documentElement.dataset.runnergoTheme === theme &&
          document.documentElement.dataset.theme === theme) return;
      document.documentElement.dataset.runnergoTheme = theme;
      document.documentElement.dataset.theme = theme;
    };
    applyTheme(readTheme());
    window.addEventListener('storage', event => {
      if (window.parent === window && themeStorageKeys.includes(event.key)) {
        applyTheme(event.newValue || 'dark');
      }
    });
    window.addEventListener('message', event => {
      if (event.origin === window.location.origin && event.data?.type === themeMessageType) {
        applyTheme(event.data.theme);
      }
    });
  })();
</script>

<script>
const API = window.location.pathname.startsWith('/auto-test') ? '/auto-test/api' : '/api';
const ALLOW_PYTHON_EDIT = __AUTO_TEST_ALLOW_PYTHON_EDIT__;
const $ = s => document.querySelector(s);
const main = $('#main');

function afterFirstPaint(callback){
  const schedule = () => setTimeout(callback, 0);
  if(window.requestAnimationFrame) requestAnimationFrame(schedule);
  else schedule();
}

const SIDEBAR_COLLAPSED_KEY = 'runnergo-auto-test-sidebar-collapsed';

function setSidebarCollapsed(collapsed){
  const sidebar = document.getElementById('sidebar');
  const toggle = document.getElementById('sidebarToggle');
  const icon = document.getElementById('sidebarToggleIcon');
  if(!sidebar || !toggle || !icon) return;
  sidebar.classList.toggle('is-collapsed', collapsed);
  toggle.title = collapsed ? '展开侧边栏' : '收起侧边栏';
  toggle.setAttribute('aria-label', toggle.title);
  icon.innerHTML = collapsed
    ? '<path d="M9 18l6-6-6-6"/><path d="M4 12h11"/>'
    : '<path d="M15 18l-6-6 6-6"/><path d="M20 12H9"/>';
  localStorage.setItem(SIDEBAR_COLLAPSED_KEY, collapsed ? 'true' : 'false');
}

function toggleSidebarCollapse(event){
  if(event) event.stopPropagation();
  const sidebar = document.getElementById('sidebar');
  setSidebarCollapsed(!sidebar?.classList.contains('is-collapsed'));
}

setSidebarCollapsed(localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === 'true');

// ===== 工具 =====
async function req(path, opts={}){
  const r = await fetch(API+path, {headers:{'Content-Type':'application/json'}, ...opts});
  if(!r.ok){
    if(r.status===401){
      const loginUrl=`${window.location.protocol}//${window.location.hostname}:9998/#/login`;
      const targetWindow=window.top&&window.top!==window?window.top:window;
      targetWindow.location.replace(loginUrl);
    }
    const e = await r.json().catch(()=>({detail:r.statusText}));
    const detail = typeof e.detail === 'string' ? e.detail : JSON.stringify(e.detail || e);
    const error = new Error(detail || 'error'); error.status=r.status; throw error;
  }
  return r.json();
}
const esc = s => String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const escAttr = s => esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const badge = s => {
  const c = {success:'bg-green-100 text-green-700',failed:'bg-red-100 text-red-700',
             running:'bg-blue-100 text-blue-700',pending:'bg-amber-100 text-amber-700',
             paused:'bg-amber-100 text-amber-700',stopped:'bg-orange-100 text-orange-700',planning:'bg-purple-100 text-purple-700',
             ready:'bg-cyan-50 text-cyan-700',executing:'bg-blue-100 text-blue-700',
             analyzing:'bg-indigo-100 text-indigo-700',completed:'bg-green-100 text-green-700',
             review_required:'bg-amber-100 text-amber-700'}[s]||'bg-slate-100 text-slate-600';
  return `<span class="badge ${c}">${s}</span>`;
};

const notificationOutcomePattern = /(✅\s*全部通过|❌\s*存在失败|🏃\s*执行中|⏳\s*等待中|⛔\s*已停止)$/;
const notificationTypeLabel = type => ({
  webhook: '飞书群机器人',
  feishu: '飞书群机器人',
  webhook_feishu: '飞书群机器人',
  wechat: '企业微信群机器人',
  webhook_wechat: '企业微信群机器人',
  dingtalk: '钉钉群机器人',
  webhook_dingtalk: '钉钉群机器人',
  email: '邮箱',
  both: '飞书、邮箱',
}[String(type || '').trim().toLowerCase()] || String(type || '-'));
const notificationOutcome = notification => {
  const title = String(notification?.title || '').trim();
  const match = title.match(notificationOutcomePattern);
  return match ? match[1] : '-';
};
const notificationTitle = notification => {
  const title = String(notification?.title || '').trim();
  return title.replace(notificationOutcomePattern, '').trim() || '-';
};
const notificationOutcomeBadge = notification => {
  const outcome = notificationOutcome(notification);
  const color = outcome.startsWith('✅') ? 'bg-green-100 text-green-700'
    : outcome.startsWith('❌') ? 'bg-red-100 text-red-700'
    : outcome.startsWith('⛔') ? 'bg-orange-100 text-orange-700'
    : outcome.startsWith('🏃') ? 'bg-blue-100 text-blue-700'
    : outcome.startsWith('⏳') ? 'bg-amber-100 text-amber-700'
    : 'bg-slate-100 text-slate-600';
  return `<span class="badge ${color}">${esc(outcome)}</span>`;
};

// SSE 日志流连接（全局，关闭模态框时断开）
let _logEventSource = null;
let _webRecorderSession = '';
let _webRecorderSteps = [];
let _webRecorderProbe = null;
let _webRecorderViewport = {width:1440,height:900};
let _webRecorderBaseUrl = '';
let _webRecorderTabs = [];
let _webRecorderDragIndex = null;
let _webRecorderDraftId = '';
let _webRecorderDraftStatus = '';
let _webRecorderAuthStateSaved = false;
let _webRecorderDragSource = null;
let _webStepEditorIndex = null;
let _webStepEditorLocators = [];
let _webStepEditorDraft = null;
let _webInsertPositionResolver = null;
let _runnergoTestObjects = [];
let _runnergoTestObjectsTeamId = '';
let _runnergoTeams = [];
let _webRecorderEditingCase = null;
let _webRecorderVariables = [];
let _webRuntimeAssertions = [];
let _webExecutionTaskId = '';
let _webExecutionState = null;
let _webExecutionTask = null;
let _webExecutionLog = '';
let _webExecutionPollTimer = null;
let _webExecutionEventSource = null;
let _agentSelectedTaskId = '';

// ===== 全局项目选择器 =====
let currentProject = new URLSearchParams(window.location.search).get('project_id') || 'default';
async function loadGlobalProj(){
  const projects = await req('/projects');
  if(!projects.some(project=>project.id===currentProject)) currentProject=projects[0]?.id||'default';
  const sel = document.getElementById('globalProj');
  if(!sel) return;
  sel.innerHTML = projects.map(p => `<option value="${p.id}" ${p.id===currentProject?'selected':''}>${esc(p.name)}</option>`).join('');
}
function resetWebRecorderClientState(){
  stopWebSceneExecutionTracking();
  _webRecorderSession='';
  _webRecorderSteps=[];
  _webRecorderProbe=null;
  _webRecorderViewport={width:1440,height:900};
  _webRecorderBaseUrl='';
  _webRecorderTabs=[];
  _webRecorderDragIndex=null;
  _webRecorderDraftId='';
  _webRecorderDraftStatus='';
  _webRecorderAuthStateSaved=false;
  _webRecorderDragSource=null;
  _webRecorderPointerStart=null;
  _webRecorderSuppressClick=false;
  resetWebRecorderWheelState();
  _webRecorderBusy=false;
  _webStepEditorIndex=null;
  _webStepEditorLocators=[];
  _webStepEditorDraft=null;
  _webRecorderEditingCase=null;
  _webRecorderVariables=[];
  _webRuntimeAssertions=[];
  _webExecutionTaskId='';
  _webExecutionState=null;
  _webExecutionTask=null;
  _webExecutionLog='';
}
function switchProject(){
  const nextProject=document.getElementById('globalProj').value;
  const active = document.querySelector('.nav-item.active');
  if(nextProject!==currentProject){
    clearPageRefresh();
    resetWebRecorderClientState();
    if(active?.dataset.page==='webRecorder'){
      const target=new URL(pageUrl('webRecorder'),window.location.origin);
      target.searchParams.set('project_id',nextProject);
      history.replaceState({page:'webRecorder'},'',target.pathname+target.search);
    }
  }
  currentProject = nextProject;
  if(active) pages[active.dataset.page]();
}

function openModal(title, body){
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = body;
  $('#modal').classList.remove('hidden');
  $('#modal').classList.add('flex');
}
function closeModal(){
  if(_webInsertPositionResolver){
    const resolve=_webInsertPositionResolver;
    _webInsertPositionResolver=null;
    resolve(null);
  }
  if(_logEventSource){ _logEventSource.close(); _logEventSource=null; }
  $('#modal').classList.add('hidden');
  $('#modal').classList.remove('flex');
}
$('#modal').addEventListener('click', e => { if(e.target.id==='modal') closeModal(); });

// ===== 路由 =====
const pages = {dashboard,agent,projects,cases,suites,webRecorder,run,loadTest,reports,jobs,settings,notifications,loadrunner};
const pageRoutes = Object.freeze({
  dashboard:'dashboard', agent:'agent', projects:'projects', cases:'cases', suites:'test-suites', webRecorder:'ui-scenes',
  run:'run', loadTest:'load-tests', reports:'reports',
  jobs:'jobs', settings:'environment', notifications:'notifications', loadrunner:'loadrunner-manual'
});
const routePages = Object.freeze({
  dashboard:'dashboard', agent:'agent', projects:'projects', cases:'cases', 'test-cases':'cases',
  suites:'suites', 'test-suites':'suites',
  'ui-scenes':'webRecorder', 'web-recorder':'webRecorder', webRecorder:'webRecorder',
  run:'run', 'load-tests':'loadTest', loadTest:'loadTest', reports:'reports',
  jobs:'jobs', settings:'settings', environment:'settings', notifications:'notifications',
  loadrunner:'loadrunner', 'loadrunner-manual':'loadrunner'
});
let _pageRefreshTimer = null;  // 页面级自动刷新定时器
function clearPageRefresh(){
  if(_pageRefreshTimer){ clearInterval(_pageRefreshTimer); _pageRefreshTimer=null; }
}
function routeSegment(){
  const path = window.location.pathname.replace(/^\/auto-test\/?/, '').replace(/^\/+|\/+$/g, '');
  return path.split('/')[0] || '';
}
function pageFromLocation(){
  const routedPage = routePages[routeSegment()];
  if(routedPage) return routedPage;
  const requestedPage = new URLSearchParams(window.location.search).get('page');
  return pages[requestedPage] ? requestedPage : 'dashboard';
}
function pageUrl(page){
  const base = window.location.pathname.startsWith('/auto-test') ? '/auto-test' : '';
  return `${base}/${pageRoutes[page] || pageRoutes.dashboard}`;
}
function showPage(page, historyMode='push'){
  const targetPage = pages[page] ? page : 'dashboard';
  clearPageRefresh();
  if(targetPage!=='webRecorder'){
    stopWebSceneExecutionTracking();
    resetWebRecorderWheelState();
  }
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.page===targetPage));
  main.classList.toggle('embedded-host', targetPage === 'agent');
  if(historyMode==='push') history.pushState({page:targetPage}, '', pageUrl(targetPage));
  if(historyMode==='replace') history.replaceState({page:targetPage}, '', pageUrl(targetPage));
  pages[targetPage]();
}
document.querySelectorAll('.nav-item').forEach(el=>{
  if(el.dataset.external==='true') return;
  el.onclick = ()=>showPage(el.dataset.page, 'push');
});
window.addEventListener('popstate', ()=>showPage(pageFromLocation(), 'none'));

function agent(){
  const src=new URL('/testhub/ui-automation/agent/embed',window.location.origin);
  src.searchParams.set('project_id',currentProject);
  main.innerHTML=`<iframe class="agent-frame" title="AI Test Agent" src="${escAttr(src.pathname+src.search)}"></iframe>`;
}

// ===== LoadRunner 合规部署与使用手册 =====
function loadrunner(){
  main.innerHTML=`

        <div class="mt-2">本手册不执行、不分发、不集成破解程序或替换 DLL。请使用 Micro Focus/OpenText 提供的许可证、试用许可证或企业授权。</div>
      </div>
      <div class="grid grid-cols-1 xl:grid-cols-2 gap-4 mb-5">

        <section class="bg-white border rounded-lg p-5"><h3 class="font-semibold text-slate-800 mb-3">二、合法安装清单</h3><ol class="list-decimal pl-5 space-y-2 text-sm text-slate-600"><li>核对安装介质哈希和许可证归属，使用隔离的 Windows 测试机。</li><li>运行官方安装程序，按许可证选择 Controller、VuGen、Analysis 或 Load Generator。</li><li>通过官方 License Utility 导入授权文件，重启服务后检查 License 状态。</li><li>先用单用户脚本验证回放，再逐步增加并发；不要直接对生产系统施压。</li></ol></section>

async function dashboard(){
  main.innerHTML = `
    <h2 class="text-2xl font-bold mb-6">📊 平台概览</h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="cards"></div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="bg-white p-4 rounded-lg shadow"><h3 class="font-semibold mb-3">任务状态分布</h3><div id="chart1" style="height:280px"></div></div>
      <div class="bg-white p-4 rounded-lg shadow"><h3 class="font-semibold mb-3">最近任务</h3><div id="recent" class="space-y-2 text-sm"></div></div>
    </div>`;
  try{
    // These two endpoints are independent.  Waiting for /status before
    // requesting the task list made the dashboard needlessly serial.
    const [s, recent] = await Promise.all([
      req('/status'),
      req('/tasks?limit=8'),
    ]);
    updateSysInfo(s);
    const cards = [
      ['Redis 队列', s.redis?'✅ 在线':'❌ 离线', s.redis?'text-green-600':'text-red-600'],
      ['队列长度', s.queue_length, 'text-indigo-600'],
      ['项目数', s.project_count, 'text-indigo-600'],
      ['定时任务', s.job_count, 'text-indigo-600'],
    ];
    $('#cards').innerHTML = cards.map(c=>`
      <div class="bg-white p-4 rounded-lg shadow">
        <div class="text-sm text-slate-500">${c[0]}</div>
        <div class="text-2xl font-bold mt-1 ${c[2]}">${c[1]}</div>
      </div>`).join('');

    const stats = s.task_stats || {};
    const data = Object.entries(stats)
      .map(([name, value])=>({name, value:Number(value)||0}))
      .filter(item=>item.value>0);
    if(data.length){
      const colors = ['#5267ff','#22c55e','#ef4444','#f59e0b','#06b6d4','#a855f7'];
      const total = data.reduce((sum,item)=>sum+item.value,0);
      let offset = 0;
      const segments = data.map((item,index)=>{
        const start = offset;
        offset += item.value / total * 100;
        return `${colors[index % colors.length]} ${start}% ${offset}%`;
      }).join(',');
      $('#chart1').innerHTML = `
        <div class="flex h-full items-center justify-center gap-8">
          <div class="relative h-44 w-44 shrink-0 rounded-full" style="background:conic-gradient(${segments})">
            <div class="absolute inset-6 flex flex-col items-center justify-center rounded-full bg-white">
              <span class="text-2xl font-bold text-slate-800">${total}</span>
              <span class="text-xs text-slate-500">全部任务</span>
            </div>
          </div>
          <div class="space-y-2 text-sm">
            ${data.map((item,index)=>`
              <div class="flex items-center gap-2">
                <span class="h-2.5 w-2.5 rounded-full" style="background:${colors[index % colors.length]}"></span>
                <span class="text-slate-600">${esc(item.name)}</span>
                <span class="font-semibold text-slate-800">${item.value}</span>
              </div>`).join('')}
          </div>
        </div>`;
    } else $('#chart1').innerHTML='<div class="text-center text-slate-400 py-10">暂无任务数据</div>';

    $('#recent').innerHTML = recent.length ? recent.map(t=>`
      <div class="flex items-center justify-between p-2 hover:bg-slate-50 rounded">
        <span class="font-mono text-xs">${t.id}</span>
        ${badge(t.status)}
        <span class="text-slate-500 text-xs">${t.passed||0}/${t.total||0}</span>
        <span class="text-slate-400 text-xs">${t.started_at||'-'}</span>
      </div>`).join('') : '<div class="text-slate-400 text-center py-6">无任务</div>';
  }catch(e){ main.innerHTML += `<p class="text-red-500">${e.message}</p>`; }
}

async function saveProject(id){
  // 构造 envs 对象（只包含非空的 URL）
  const envs = {};
  const testUrl = $('#f_env_test').value.trim();
  const stagingUrl = $('#f_env_staging').value.trim();
  const prodUrl = $('#f_env_prod').value.trim();
  if(testUrl) envs.test = testUrl;
  if(stagingUrl) envs.staging = stagingUrl;
  if(prodUrl) envs.prod = prodUrl;
  const body = {
    name:$('#f_name').value,
    description:$('#f_desc').value,
    base_url:$('#f_url').value || testUrl,  // 兼容字段
    case_dir:$('#f_dir').value||null,
    envs: envs
  };
  try{
    if(id) await req(`/projects/${id}`,{method:'PUT',body:JSON.stringify(body)});
    else await req('/projects',{method:'POST',body:JSON.stringify(body)});
    closeModal(); projects(); loadGlobalProj();
  }catch(e){
    alert('保存项目失败：' + e.message);
  }
}
async function delProject(id){
  if(!confirm('确认删除项目及其所有用例、任务、定时任务及对应文件夹？')) return;
  await req(`/projects/${id}`,{method:'DELETE'});
  // 如果删除的是当前项目，切回默认项目
  if(currentProject === id){ currentProject = 'default'; }
  // 刷新项目列表 + 全局选择器 + 当前页面数据
  await loadGlobalProj();
  const sel = document.getElementById('globalProj');
  if(sel) sel.value = currentProject;
  projects();
}

async function loadCaseList(){
  const listEl = document.getElementById('caseList');
  const viewEl = document.getElementById('caseView');
  if(!listEl) return;
  viewEl && (viewEl.innerHTML = '<div class="text-slate-400 text-center py-16">← 选择左侧文件查看/编辑</div>');
  try{
    if(curCaseTab==='cases'){
      const list = await req(`/projects/${currentProject}/cases?module=${curModule}`).catch(()=>[]);
      const available = new Set(list.map(c=>c.name));
      [...selectedCaseFiles].forEach(name=>{ if(!available.has(name)) selectedCaseFiles.delete(name); });
      const allSelected = list.length > 0 && list.every(c=>selectedCaseFiles.has(c.name));
      listEl.innerHTML = list.length ? list.map(c=>`
        <div class="p-2 rounded hover:bg-indigo-50 cursor-pointer flex justify-between items-center" onclick="viewCase('${escAttr(c.module)}','${escAttr(c.name)}')">

          <span class="text-xs text-slate-400">${(c.size/1024).toFixed(1)}KB</span>
        </div>`).join('') : '<div class="text-slate-400 text-center py-8">暂无用例</div>';
      if(list.length){
        listEl.insertAdjacentHTML('afterbegin', `<label class="flex items-center gap-2 border-b pb-2 mb-1 text-xs text-slate-500"><input type="checkbox" ${allSelected?'checked':''} onchange="toggleAllCaseSelection(this.checked)">全选</label>`);
      }
      updateSelectedCaseCount();
    } else if(curCaseTab==='pages'){
      const list = await req(`/projects/${currentProject}/pages`).catch(()=>[]);
      listEl.innerHTML = list.length ? list.map(f=>`
        <div class="p-2 rounded hover:bg-purple-50 cursor-pointer flex justify-between items-center" onclick="viewPage('${esc(f.name)}')">

        </div>`).join('') : '<div class="text-slate-400 text-center py-8">暂无 Page 文件</div>';
    } else {
      const list = await req(`/projects/${currentProject}/scripts`).catch(()=>[]);
      listEl.innerHTML = list.length ? list.map(f=>`
        <div class="p-2 rounded hover:bg-green-50 cursor-pointer flex justify-between items-center" onclick="viewScript('${esc(f.name)}')">
          <span class="truncate">🔧 ${esc(f.name)}</span>
          <span class="text-xs text-slate-400">${(f.size/1024).toFixed(1)}KB</span>
        </div>`).join('') : '<div class="text-slate-400 text-center py-8">暂无脚本文件</div>';
    }
  }catch(e){ listEl.innerHTML = `<div class="text-red-400 text-center py-8">${esc(e.message)}</div>`; }
}

function toggleCaseSelection(filename, checked){
  if(checked) selectedCaseFiles.add(filename); else selectedCaseFiles.delete(filename);
  updateSelectedCaseCount();
}
function toggleAllCaseSelection(checked){
  document.querySelectorAll('#caseList input[aria-label^="选择用例 "]').forEach(input=>{
    input.checked=checked;
    const name=input.getAttribute('aria-label').slice('选择用例 '.length);
    if(checked) selectedCaseFiles.add(name); else selectedCaseFiles.delete(name);
  });
  updateSelectedCaseCount();
}
function updateSelectedCaseCount(){
  const count=document.getElementById('selectedCaseCount');
  if(count) count.textContent=selectedCaseFiles.size ? `（${selectedCaseFiles.size}）` : '';
}
async function batchDeleteCases(){
  const filenames=[...selectedCaseFiles];
  if(!filenames.length){ alert('请先选择要删除的用例'); return; }
  if(!confirm(`确认删除选中的 ${filenames.length} 个用例？`)) return;
  try{
    const res = await req(`/projects/${encodeURIComponent(currentProject)}/cases/${encodeURIComponent(curModule)}/batch-delete`,{method:'POST',body:JSON.stringify({filenames})});
    if(res && res.count !== undefined && res.count < filenames.length){
      alert(`已删除 ${res.count} 个，${filenames.length - res.count} 个未找到或无法删除`);
    }
  }catch(e){
    alert('批量删除失败：' + (e.message || e));
    return;
  }
  selectedCaseFiles.clear();
  const view=document.getElementById('caseView');
  if(view) view.innerHTML='<div class="text-slate-400 text-center py-16">← 选择左侧文件查看/编辑</div>';
  loadCaseList();
}

async function generateRuntimeInputData(){

  }catch(e){ alert('生成输入数据失败: '+e.message); }

async function ensureRuntimeInputFields(caseFile){
  if(_runtimeCaseFile===caseFile && _runtimeInputFields.length) return true;
  const data=await req('/runtime-case/scan',{method:'POST',body:JSON.stringify({project_id:currentProject,module:'ui',case_file:caseFile})});
  _runtimeCaseFile=caseFile;
  _runtimeInputFields=(data.fields||[]).map(item=>({...item,runtimeValue:null}));
  return true;
}
async function applyRuntimeTemplate(templateId){
  _runtimeTemplateId=templateId||'';
  renderRuntimeTemplateSelect();
  if(!templateId) return;
  const files=selectedRunCaseFiles();
  if(files.length!==1){ alert('请选择一个 UI 用例后再选择模板'); return; }
  const template=_runtimeDataTemplates.find(item=>item.id===templateId);
  if(!template) return;
  try{
    await ensureRuntimeInputFields(files[0]);
    const byPath=new Map((template.runtimeOverride||[]).filter(item=>item.stepPath).map(item=>[item.stepPath,item]));
    const byId=new Map((template.runtimeOverride||[]).filter(item=>item.stepId).map(item=>[item.stepId,item]));
    let applied=0;
    _runtimeInputFields=_runtimeInputFields.map(field=>{
      const override=byPath.get(field.stepPath)||byId.get(field.stepId);
      if(!override) return {...field,runtimeValue:null};
      applied+=1;
      return {...field,runtimeValue:override.runtimeValue};
    });
    renderRuntimeInputData();
    if(!applied) alert('模板中的字段没有匹配到当前用例，请检查用例是否已变更');
  }catch(e){ alert('套用模板失败: '+e.message); }
}

function webAssertionActionLabel(action){
  return ({assert_visible:'元素可见断言',assert_text:'文本/数字断言',assert_url:'URL 断言',assert_error:'错误拦截断言'})[String(action||'').toLowerCase()]||String(action||'断言');
}
function uiAssertionPassed(step){
  const matched=step.assertion_matched;
  if(matched===true)return true;
  if(matched===false)return false;
  return step.status==='passed';
}
function collectTaskAssertionRows(stepsState){
  const rows=[];
  const steps=Array.isArray(stepsState?.steps)?stepsState.steps:[];
  steps.forEach(step=>{
    if(!step||typeof step!=='object')return;
    const diagnostics=step.diagnostics&&typeof step.diagnostics==='object'?step.diagnostics:{};
    (Array.isArray(diagnostics.assertions)?diagnostics.assertions:[]).forEach(item=>{
      if(!item||typeof item!=='object')return;
      rows.push({
        step:step.name||step.id||'',
        label:item.label||item.name||'断言',
        operator:item.operator||'equals',
        expected:item.expected??'',
        actual:item.actual??'',
        passed:!!item.passed,
        message:item.message||'',
      });
    });
    if(step.is_assertion&&['passed','failed'].includes(step.status)){
      rows.push({
        step:step.name||step.id||'',
        label:webAssertionActionLabel(step.action),
        operator:String(step.action||''),
        expected:'-',
        actual:step.assertion_matched===true?'命中':(step.error?String(step.error).slice(0,120):'-'),
        passed:uiAssertionPassed(step),
        message:step.error?String(step.error).slice(0,200):'',
      });
    }
  });
  return rows;
}
function renderTaskAssertionPanel(stepsState,task){
  const stats=stepsState?.assertion_stats||task?.assertion_stats||null;
  const rows=collectTaskAssertionRows(stepsState);
  if(!stats&&!rows.length)return '';
  const total=Number(stats?.total||rows.length);
  const passed=Number(stats?.passed||rows.filter(r=>r.passed).length);
  const failed=Number(stats?.failed||rows.filter(r=>!r.passed).length);
  return `
    <div class="flex items-center justify-between mb-2">
      <div class="text-sm font-semibold">断言统计</div>

      <tbody>${rows.map(row=>`

  const logArea = $('#logArea');

  if(isFinished){
    const log = await req(`/tasks/${tid}/log`);
    logArea.textContent = log.log || '(无日志)';
    const hint = $('#logLiveHint');
    if(hint){ hint.textContent = '✓ 已结束'; hint.className = 'text-slate-400 text-xs'; }
  } else {
    const es = new EventSource(`${API}/tasks/${tid}/log/stream`);
    _logEventSource = es;
    es.onmessage = function(e){
      try{
        const data = JSON.parse(e.data);
        if(data.log !== undefined){
          logArea.textContent += data.log;
          logArea.scrollTop = logArea.scrollHeight;
        }
        if(data.finished){
          const hint = $('#logLiveHint');
          if(hint){ hint.textContent = '✓ 已结束'; hint.className = 'text-slate-400 text-xs'; }
          es.close(); _logEventSource = null;

      const hint = $('#logLiveHint');
      if(hint){ hint.textContent = '⚠ 连接断开'; hint.className = 'text-red-400 text-xs'; }
      es.close(); _logEventSource = null;
    };
  }

function reportNumber(value, digits=2){
  const number = Number(value);
  if(!Number.isFinite(number)) return '-';
  return number.toFixed(digits).replace(/\.00$/,'');
}

function reportPercent(value){
  const number = Number(value);
  if(!Number.isFinite(number)) return '-';
  return `${reportNumber(number)}%`;
}

function reportDuration(seconds){
  const value = Number(seconds);
  if(!Number.isFinite(value)) return '-';
  if(value < 60) return `${reportNumber(value)}s`;
  return `${Math.floor(value / 60)}m ${Math.round(value % 60)}s`;
}

const HTTP_RESOURCE_COLORS = {
  document: '#4f46e5', xhr: '#0ea5e9', fetch: '#0ea5e9', script: '#f59e0b',
  stylesheet: '#a855f7', image: '#10b981', font: '#ec4899', other: '#64748b',
};
const HTTP_TIMING_PHASE_COLORS = {dns:'#94a3b8', connect:'#0ea5e9', tls:'#a855f7', ttfb:'#4f46e5', receive:'#10b981'};

function renderLoadTestHttpWaterfall(summary){
  const http = summary?.http_waterfall || {};
  const total = Number(http.total_requests || 0);
  if(!total) return `<section class="bg-white rounded-lg shadow p-4 mb-4"><div class="flex items-center justify-between mb-3"><h4 class="font-semibold">HTTP 瀑布图 / 响应时间直方图</h4><span class="text-xs text-slate-500">0 个请求</span></div><div class="text-sm text-slate-500">本次报告未采到 HTTP timing 样本（仅页面模式浏览器自动化会采集）。</div></section>`;
  const waterfall = Array.isArray(http.waterfall) ? http.waterfall : [];
  const histogram = Array.isArray(http.histogram) ? http.histogram : [];
  const byType = http.by_type || {};

  const maxTotal = Math.max(1, ...waterfall.flatMap(step => Object.values(step.by_type || {}).map(v => Number(v?.total?.p99 || v?.total?.max || 0))));
  const histogramMax = Math.max(1, ...histogram.map(h => Number(h.count || 0)));
  const barW = 700, phaseH = 14, rowH = 36;
  const axisH = 18;
  const wfH = Math.max(80, waterfall.length * rowH + axisH);
  const ticks = 5;
  const tickVals = Array.from({length: ticks+1}, (_, i) => Math.round(maxTotal * i / ticks));
  const stepRows = waterfall.map((step, idx) => {
    const y = idx * rowH + axisH;
    const types = Object.entries(step.by_type || {});
    const bars = types.map(([rtype, t]) => {
      const p95 = Number(t?.total?.p95 || 0);
      const w = (p95 / maxTotal) * barW;
      if(w < 1) return '';
      const cx = 110;
      const phaseBars = ['dns','connect','tls','ttfb','receive'].map(phase => {
        const ms = Number(t?.[phase]?.p95 || 0);
        const pw = (ms / maxTotal) * barW;
        if(pw < 0.5) return '';
        const color = HTTP_TIMING_PHASE_COLORS[phase] || '#94a3b8';
        return `<rect x="${cx}" y="${y+2}" width="${pw}" height="${phaseH-2}" fill="${color}" opacity="0.85"><title>${phase.toUpperCase()} P95: ${ms.toFixed(1)}ms</title></rect>`;
      }).join('');
      const totalLabel = `<text x="${cx + w + 4}" y="${y + phaseH - 1}" font-size="10" fill="#475569">${p95.toFixed(0)}ms</text>`;
      return `${phaseBars}${totalLabel}`;
    }).join('');
    return `<g><rect x="0" y="${y}" width="${barW+110+80}" height="${rowH-2}" fill="${idx%2 ? '#f8fafc' : '#ffffff'}"></rect><text x="4" y="${y + phaseH - 1}" font-size="11" fill="#1e293b">步骤${step.step_index + 1} · ${esc((step.step_name||'').slice(0,12))}</text><text x="4" y="${y + phaseH + 10}" font-size="9" fill="#64748b">${step.request_count} req</text>${bars}</g>`;
  }).join('');
  const axis = tickVals.map((v, i) => {
    const x = 110 + (i / ticks) * barW;
    return `<line x1="${x}" y1="${axisH-2}" x2="${x}" y2="${wfH}" stroke="#e2e8f0" stroke-dasharray="2,2"></line><text x="${x}" y="${axisH-6}" font-size="9" fill="#64748b" text-anchor="middle">${v}ms</text>`;
  }).join('');
  const legend = `<div class="flex flex-wrap gap-3 text-xs text-slate-600 mt-2">${Object.entries(HTTP_TIMING_PHASE_COLORS).map(([k,v]) => `<span class="flex items-center gap-1"><span class="inline-block w-3 h-3 rounded" style="background:${v}"></span>${k.toUpperCase()}</span>`).join('')}</div>`;
  const waterfallSvg = `<svg viewBox="0 0 ${barW+110+80} ${wfH}" class="w-full" preserveAspectRatio="xMinYMin meet"><g>${axis}${stepRows}</g></svg>`;

  const histBarH = 140;
  const histBars = histogram.map((h, i) => {
    const x = i * 70 + 10;
    const h2 = (Number(h.count || 0) / histogramMax) * histBarH;
    const label = h.le_ms === '+Inf' ? '>10s' : `≤${h.le_ms}ms`;
    return `<g><rect x="${x}" y="${histBarH - h2}" width="50" height="${h2}" fill="#4f46e5" opacity="0.85"><title>${label}: ${h.count} 个请求 (${h.pct}%)</title></rect><text x="${x+25}" y="${histBarH - h2 - 4}" font-size="10" fill="#475569" text-anchor="middle">${h.count}</text><text x="${x+25}" y="${histBarH + 14}" font-size="9" fill="#64748b" text-anchor="middle">${label}</text><text x="${x+25}" y="${histBarH + 26}" font-size="9" fill="#94a3b8" text-anchor="middle">${h.pct}%</text></g>`;
  }).join('');
  const histW = histogram.length * 70 + 20;
  const histSvg = `<svg viewBox="0 0 ${histW} ${histBarH + 36}" class="w-full" preserveAspectRatio="xMinYMin meet"><g>${histBars}<line x1="0" y1="${histBarH}" x2="${histW}" y2="${histBarH}" stroke="#e2e8f0"></line></g></svg>`;

  const typeRows = Object.entries(byType).sort((a,b) => b[1].count - a[1].count).map(([rtype, v]) => {
    const pct = Number(v?.pct || 0);
    const p95 = v?.total?.p95 || 0;
    const p99 = v?.total?.p99 || 0;
    const color = HTTP_RESOURCE_COLORS[rtype] || '#64748b';
    return `<tr class="border-t"><td class="p-2"><span class="inline-block w-3 h-3 rounded mr-2 align-middle" style="background:${color}"></span>${esc(rtype)}</td><td class="p-2 text-right">${Number(v?.count||0)}</td><td class="p-2 text-right">${pct}%</td><td class="p-2 text-right">${reportNumber(p95)} ms</td><td class="p-2 text-right">${reportNumber(p99)} ms</td></tr>`;
  }).join('');

  const components = Array.isArray(http.page_components) ? http.page_components : [];
  const distinctUrls = Number(http.distinct_url_count || components.length);
  const componentRows = components.slice(0, 50).map(c => {
    const total = c.total || {};
    const ttfb = c.ttfb || {};
    const url = String(c.url || '');
    const shown = url.length > 90 ? url.slice(0, 87) + '...' : url;
    return `<tr class="border-t"><td class="p-2 font-mono text-xs break-all" title="${esc(url)}">${esc(shown)}</td><td class="p-2 text-right text-xs">${esc(c.method || '')}</td><td class="p-2 text-xs">${esc(c.resource_type || '')}</td><td class="p-2 text-right">${Number(c.count||0)}</td><td class="p-2 text-right">${Number(c.pct||0)}%</td><td class="p-2 text-right">${reportNumber(total.avg||0)} ms</td><td class="p-2 text-right">${reportNumber(total.p95||0)} ms</td><td class="p-2 text-right">${reportNumber(total.p99||0)} ms</td><td class="p-2 text-right">${reportNumber(ttfb.p95||0)} ms</td></tr>`;
  }).join('');
  const componentSection = components.length ? `<div class="mt-4"><div class="text-sm font-medium text-slate-700 mb-2">页面组件分解（按 URL，等同 LoadRunner Page Component Breakdown）</div><div class="overflow-auto" style="max-height:420px"><table class="w-full text-sm"><thead class="bg-slate-50 text-slate-500 text-left sticky top-0"><tr><th class="p-2">URL（路径业务 ID 归一为 {id}）</th><th class="p-2 text-right">方法</th><th class="p-2">类型</th><th class="p-2 text-right">次数</th><th class="p-2 text-right">占比</th><th class="p-2 text-right">平均</th><th class="p-2 text-right">P95</th><th class="p-2 text-right">P99</th><th class="p-2 text-right">TTFB P95</th></tr></thead><tbody>${componentRows}</tbody></table></div></div>` : '';

  return `<section class="bg-white rounded-lg shadow p-4 mb-4"><div class="flex items-center justify-between mb-3"><h4 class="font-semibold">HTTP 瀑布图 / 响应时间直方图</h4><span class="text-xs text-slate-500">${total} 个请求 · ${waterfall.length} 个步骤 · ${distinctUrls} 个页面组件</span></div>
    <div class="mb-4"><div class="text-sm font-medium text-slate-700 mb-2">按步骤瀑布图（每步 P95 时长，分阶段着色）</div><div class="overflow-auto border rounded bg-white">${waterfallSvg}${legend}</div></div>
    <div class="mb-4"><div class="text-sm font-medium text-slate-700 mb-2">响应时间分布直方图（按桶累计）</div><div class="overflow-auto border rounded bg-white p-2">${histSvg}</div></div>
    <div><div class="text-sm font-medium text-slate-700 mb-2">按资源类型分布</div><div class="overflow-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-slate-500 text-left"><tr><th class="p-2">资源类型</th><th class="p-2 text-right">请求数</th><th class="p-2 text-right">占比</th><th class="p-2 text-right">P95</th><th class="p-2 text-right">P99</th></tr></thead><tbody>${typeRows}</tbody></table></div></div>
    ${componentSection}
    <div class="text-xs text-slate-400 mt-3">仅页面模式（浏览器自动化）会采集 HTTP timing；瀑布图横向是时间（ms），每个 step 一行，按 DNS/Connect/TLS/TTFB/Receive 顺序叠加着色。页面组件分解按请求 URL 聚合（业务 ID 归一为 {id}、丢弃 query），用于按页面 URL 定位慢请求与承压分布。</div>
  </section>`;
}

function fillTimelineSeconds(timeline, elapsedSeconds){
  const items = Array.isArray(timeline) ? timeline : [];
  const bySecond = new Map(items.map(item => [Number(item.second), item]));
  const seconds = Math.max(0, Math.floor(Number(elapsedSeconds || 0)));
  const filled = [];
  for(let second = 0; second < seconds; second++){
    const item = bySecond.get(second);
    filled.push(item ? {...item} : {second, completed:0, failed:0, tps:0, avg_ms:0, p95_ms:0, active_vus:0});
  }
  for(const item of items){
    const second = Number(item.second);
    if(!Number.isFinite(second) || second < 0 || second >= seconds) filled.push(item);
  }
  return filled;
}

function loadTestReportVerdict(run){
  const summary = run?.summary || {};
  const sla = summary.sla || {};
  if(['pending','running','stopping'].includes(run?.status)) return {label:'执行中', color:'blue'};
  if(run?.status === 'failed' || run?.status === 'interrupted') return {label:'执行异常', color:'red'};
  if(summary.chain_integrity?.status === 'INCOMPLETE') return {label:'链路不完整', color:'red'};
  if(summary.target_integrity?.status === 'MISMATCH') return {label:'目标不一致', color:'red'};
  if(summary.target_integrity?.status === 'UNKNOWN' && summary.target_integrity?.expected_target) return {label:'目标待核对', color:'amber'};
  if(sla.status === 'PASS') return {label:'达到 SLA', color:'green'};
  if(sla.status === 'FAIL') return {label:'未达到 SLA', color:'red'};
  return {label:'未配置 SLA', color:'amber'};
}

function loadTestReportAnalysis(run){
  const summary = run?.summary || {};
  const config = run?.config || {};
  const sla = summary.sla || {};
  const transactions = Array.isArray(summary.transactions) ? summary.transactions : [];
  const timeline = Array.isArray(summary.timeline) ? summary.timeline : [];
  const dataQuality = summary.data_quality || {};
  const targetIntegrity = summary.target_integrity || {};
  const chainIntegrity = summary.chain_integrity || {};
  const issues = [];
  const suggestions = [];
  const checks = [];

  if(run?.status === 'failed' || run?.status === 'interrupted'){
    issues.push(`压测状态为“${run.status === 'interrupted' ? '服务中断' : '启动失败'}”，本次结果不能作为容量结论。`);
  }
  if(!Array.isArray(sla.rules) || !sla.rules.length){
    issues.push('本次运行没有配置 SLA 阈值，系统只能展示观测结果，不能判定是否达标。');
    suggestions.push('在启动压测时配置最小 TPS、最大 P95/P99 和最大错误率，形成可回归的性能门槛。');
  }else{
    sla.rules.forEach(rule => {
      checks.push({
        label: rule.label || rule.key,
        actual: rule.actual,
        expected: rule.expected,
        passed: Boolean(rule.passed),
        key: rule.key
      });
      if(!rule.passed){
        const operator = rule.key === 'min_tps' ? '低于' : '高于';
        issues.push(`${rule.label || rule.key}${operator}目标阈值：实际 ${reportNumber(rule.actual)}，目标 ${reportNumber(rule.expected)}。`);
      }
    });
  }

  if(Number(summary.error_rate || 0) > 0){
    issues.push(`压测期间出现 ${reportPercent(summary.error_rate)} 错误率，共 ${Number(summary.failed || 0)} 条失败执行。`);
    suggestions.push('优先查看最近错误与错误类型分布，确认是业务断言失败、接口状态码异常、超时还是浏览器资源不足。');
  }
  if(Number(summary.completed || 0) === 0){
    issues.push('没有产生完成样本，当前数据不足以支撑 TPS 和响应时间结论。');
  }
  if(chainIntegrity.status === 'INCOMPLETE'){
    issues.push(`有 ${Number(chainIntegrity.incomplete_chains || 0)} 条业务链路未完整执行，链路成功率仅 ${reportPercent(chainIntegrity.success_rate)}；跳过必需步骤不能计为成功。`);
    suggestions.push('先修复录制步骤或业务前置数据，确保每条链路的必需步骤都真实执行，再进行容量压测。');
  }
  if(Array.isArray(dataQuality.issues) && dataQuality.issues.length){
    dataQuality.issues.forEach(item => issues.push(`数据完整性：${item}`));
  }
  if(targetIntegrity.status === 'MISMATCH'){
    const integrityIssues = Array.isArray(targetIntegrity.issues) ? targetIntegrity.issues : [];
    issues.push(...(integrityIssues.length ? integrityIssues : ['实际请求目标与配置目标不一致，本次结果不能作为容量结论。']));
    suggestions.push('修正场景 URL 映射后重新压测；不要使用本次 TPS、响应时间或错误率评价被测系统。');
  }
  if(targetIntegrity.status === 'UNKNOWN' && targetIntegrity.expected_target){
    issues.push('没有采集到实际请求目标，当前只能确认配置地址，不能证明所有页面/接口请求都发往被测系统。');
    suggestions.push('确保页面导航和接口步骤回传最终 URL，在目标核对通过后再做容量验收。');
  }

  const recentErrors = Array.isArray(summary.recent_errors) ? summary.recent_errors : [];
  const errorTypes = Object.entries(summary.error_types || {}).sort((a,b) => Number(b[1]) - Number(a[1]));
  if(errorTypes.length){
    const [dominantType, dominantCount] = errorTypes[0];
    issues.push(`主要错误为 ${dominantType}，共 ${Number(dominantCount || 0)} 条，占失败执行的 ${reportPercent(Number(dominantCount || 0) * 100 / Math.max(1, Number(summary.failed || 0)))}。`);
  }
  const unresolvedMessages = recentErrors
    .map(item => String(item.message || ''))
    .filter(message => /\$\{[^}]+\}|#\{[^}]+\}|{{[^}]+}}/.test(message));
  if(unresolvedMessages.length){
    const sample = unresolvedMessages[0].slice(0, 180);
    issues.push(`有失败样本的错误信息里仍带未替换的变量占位符，例如「${sample}」；这是脚本或参数化数据问题，不是被测服务的性能问题。`);
    suggestions.push('检查断言期望值、输入值和接口请求中的 ${...} / {{...}} 变量，确认数据行、数据资产或运行时变量里都提供了对应值。');
  }

  const completedCount = Number(summary.completed || 0);
  if(completedCount > 0 && completedCount < 30){
    issues.push(`本次按配置完成 ${completedCount} 条链路，样本量偏少，P95/P99 波动会比较大；要得到更稳的容量结论，建议提高每用户迭代次数或加长稳态时长，让样本超过 30 条。`);
  }

  const plannedSeconds = Number(summary.planned_duration_seconds ?? (Number(config.ramp_up_seconds || 0) + Number(config.duration_seconds || 0) + Number(config.ramp_down_seconds || 0)));
  const actualSeconds = Number(summary.elapsed_seconds || 0);
  if(plannedSeconds > 0 && actualSeconds > plannedSeconds + 5){
    const overrun = actualSeconds - plannedSeconds;
    issues.push(`实际运行 ${reportNumber(actualSeconds)}s，比计划的 ${plannedSeconds}s 多 ${reportNumber(overrun)}s：最后一批迭代会跑完才结束，全程平均 TPS 被摊薄，容量判断优先看稳态 TPS。`);
  }
  if(Number(summary.stable_tps || 0) === 0 && Number(summary.tps || 0) > 0){
    issues.push('稳态窗口没有完成样本，稳态 TPS 为 0，不能代表持续承载能力；常见原因是单条链路耗时超过了稳态时长，建议延长稳态阶段或压缩单轮场景耗时。');
  }

  const bottlenecks = transactions
    .slice()
    .sort((a,b) => Number(b.p95_ms || 0) - Number(a.p95_ms || 0))
    .slice(0, 3);
  const slowest = bottlenecks[0];
  if(slowest && Number(slowest.p95_ms || 0) > Number(summary.p95_ms || 0) * 1.25){
    issues.push(`步骤「${slowest.name || slowest.action}」是主要延迟热点，步骤 P95 为 ${reportNumber(slowest.p95_ms)}ms。`);
    suggestions.push(`针对「${slowest.name || slowest.action}」单独做接口、页面资源或数据库耗时拆分，避免只看场景总 P95。`);
  }

  const rampUpSeconds = Number(config.ramp_up_seconds || 0);
  const steadyEndSeconds = rampUpSeconds + Number(config.duration_seconds || 0);
  const steadyTps = timeline
    .filter(item => Number(item.second) >= rampUpSeconds && Number(item.second) < steadyEndSeconds)
    .map(item => Number(item.tps || 0))
    .filter(value => value >= 0);
  if(steadyTps.length >= 10){
    const peak = Math.max(...steadyTps);
    const tail = steadyTps.slice(-Math.min(5, steadyTps.length));
    const tailAverage = tail.reduce((sum,value) => sum + value, 0) / Math.max(1, tail.length);
    if(peak > 0 && tailAverage < peak * 0.65 && !['stopped','failed','interrupted'].includes(run?.status)){
      issues.push(`稳态阶段后段吞吐降至峰值的 ${reportPercent(tailAverage * 100 / peak)}，存在吞吐衰减迹象。`);
      suggestions.push('对比压测机 CPU、网络、连接池和被测服务线程池，确认是否出现资源耗尽或排队堆积。');
    }
  }

  if(config.mode === 'ui' || config.mode === 'mixed'){
    suggestions.push('页面并发建议逐步增加 VU 并观察浏览器资源占用，优先以完整业务链路指标评估容量。');
  }else{
    suggestions.push('接口压测建议使用参数化数据和连接复用，分别记录 TPS、RPS、P95/P99 与业务断言通过率。');
  }
  if(!issues.length) issues.push('未发现超过已配置门槛的指标，建议结合容量目标和业务成功率继续复核。');

  const passedRules = checks.filter(item => item.passed).length;
  const score = checks.length ? Math.round(passedRules * 100 / checks.length) : null;
  const verdict = loadTestReportVerdict(run);
  return {issues, suggestions: [...new Set(suggestions)], checks, bottlenecks, score, verdict, timeline};
}

function loadTestPlainConclusion(run, analysisResult){
  const summary = run?.summary || {};
  const config = run?.config || {};
  const verdict = analysisResult?.verdict || loadTestReportVerdict(run);
  const completed = Number(summary.completed || 0);
  const failed = Number(summary.failed || 0);
  const passed = Number(summary.passed ?? Math.max(0, completed - failed));
  const avgTps = Number(summary.tps || 0);
  const stableTps = Number(summary.stable_tps || 0);
  const p95 = Number(summary.p95_ms || 0);
  const errorRate = Number(summary.error_rate || 0);
  if(['pending','running','stopping'].includes(run?.status)){
    return `这次压测还在运行，当前共执行 ${completed} 条完整业务链路，其中成功 ${passed} 条、失败 ${failed} 条；平均场景 TPS 是 ${reportNumber(avgTps)}，P95（整条链路从开始到结束）是 ${reportNumber(p95)}ms。现在只能看趋势，最终是否达标要等运行结束。`;
  }
  if(run?.status === 'failed' || run?.status === 'interrupted'){
    return `这次压测没有正常结束，原因更像是压测执行环境或场景启动问题，不适合作为容量结论。当前只采到 ${completed} 条样本，请先处理异常后重跑。`;
  }
  if(!completed){
    return '这次压测没有完成任何一条完整业务链路，所以 TPS、P95 和错误率都没有判断价值。先确认 YAML、环境地址、账号数据和浏览器/接口执行是否能跑通。';
  }
  const targetIntegrity = summary.target_integrity || {};
  if(targetIntegrity.status === 'MISMATCH'){
    const observed = Array.isArray(targetIntegrity.observed_targets)
      ? targetIntegrity.observed_targets.map(item => item.target).filter(Boolean).join('、')
      : '';
    return `结论：本次结果无效。配置目标是 ${targetIntegrity.expected_target || config.base_url || '-'}，但错误样本显示请求实际发往 ${observed || '其他地址'}。共执行 ${completed} 条，其中成功 ${passed} 条、失败 ${failed} 条；这些 TPS、响应时间和错误率不能用于评价被测系统，修复目标地址后需要重新压测。`;
  }
  if(targetIntegrity.status === 'UNKNOWN' && targetIntegrity.expected_target){
    return `结论：本次结果待核对。配置目标是 ${targetIntegrity.expected_target}，但没有采到实际请求目标。共执行 ${completed} 条，其中成功 ${passed} 条、失败 ${failed} 条；在目标地址核对通过前，不应把这些 TPS、响应时间作为容量验收结论。`;
  }
  const chainIntegrity = summary.chain_integrity || {};
  if(chainIntegrity.status === 'INCOMPLETE'){
    return `结论：本次结果无效。共执行 ${completed} 条业务链路，只有 ${Number(chainIntegrity.successful_chains || 0)} 条完整通过，${Number(chainIntegrity.incomplete_chains || 0)} 条跳过或失败了必需步骤，链路成功率 ${reportPercent(chainIntegrity.success_rate)}。当前 TPS 和响应时间不能代表完整业务容量，必须先修复脚本或测试数据后重跑。`;
  }
  const slaText = verdict.label === '达到 SLA'
    ? '配置的 SLA 都通过了'
    : verdict.label === '未达到 SLA'
      ? '至少有一个 SLA 没通过'
      : '这次没有配置 SLA，只能看观测值，不能说达标或不达标';
  const bottleneck = analysisResult?.bottlenecks?.[0];
  const bottleneckText = bottleneck
    ? `最慢的步骤是「${bottleneck.name || bottleneck.action || '-'}」，步骤 P95 为 ${reportNumber(bottleneck.p95_ms)}ms。`
    : '目前没有采到可拆分的步骤耗时。';
  const stableText = stableTps
    ? `稳态阶段 TPS 是 ${reportNumber(stableTps)}，比全程平均更接近持续承载能力。`
    : '稳态窗口没有足够样本，平均 TPS 可能受到升压/降压阶段影响。';
  const errorTypes = Object.entries(summary.error_types || {}).sort((a,b) => Number(b[1]) - Number(a[1]));
  const dominantErrorText = errorTypes.length
    ? `主要错误是 ${errorTypes[0][0]}（${Number(errorTypes[0][1] || 0)} 条）。`
    : '';
  return `结论：${slaText}。本次用 ${Number(config.virtual_users || 0)} 个 VU 跑完整业务链路，共执行 ${completed} 条，其中成功 ${passed} 条、失败 ${failed} 条，错误率 ${reportPercent(errorRate)}；平均场景 TPS 为 ${reportNumber(avgTps)}，P95（整条链路从开始到结束）为 ${reportNumber(p95)}ms。${stableText}${dominantErrorText}${bottleneckText}`;
}

function renderLoadTestMetricExplanation(summary){
  const semantics = summary.metric_semantics || {};
  const rows = [
    ['场景 TPS', semantics.tps || '完成的整条业务链路数 / 实际运行秒数，接近 LoadRunner 的事务 TPS。'],
    ['峰值 TPS', semantics.peak_tps || '单秒完成的完整链路数峰值，只看瞬时冲高。'],
    ['稳态 TPS', semantics.stable_tps || '只统计稳态阶段，用来观察持续承载能力。'],
    ['接口 RPS', semantics.protocol_rps || '接口步骤次数 / 运行秒数，混合链路中可能高于场景 TPS。'],
    ['响应时间', semantics.response_time || '统计整条场景迭代耗时，单位毫秒。']
  ];
  return `<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-3">
    ${rows.map(row => `<div class="border rounded p-3 bg-slate-50"><div class="text-xs font-semibold text-slate-700 mb-1">${esc(row[0])}</div><div class="text-xs text-slate-500 leading-5">${esc(row[1])}</div></div>`).join('')}
  </div>`;
}

function renderLoadTestDataQuality(summary){
  const quality = summary.data_quality || {};
  const issues = Array.isArray(quality.issues) ? quality.issues : [];
  const ok = !issues.length && quality.status !== '无有效数据';
  const sampleCount = Number(quality.duration_samples ?? summary.duration_samples ?? 0);
  const sampleLimit = Number(quality.percentile_sample_limit ?? summary.sample_limit ?? 0);
  let sampleNote;
  if(sampleCount > 0 && sampleCount < sampleLimit){
    sampleNote = `百分位样本 ${sampleCount} 条（低于上限 ${sampleLimit}，P95/P99 按全部样本计算）`;
  }else if(sampleCount >= sampleLimit){
    sampleNote = `百分位样本达到上限 ${sampleLimit} 条，P95/P99 为有界近似值`;
  }else{
    sampleNote = '未采集到耗时样本，P95/P99 无法从样本计算';
  }
  return `<div class="${ok ? 'bg-green-50 border-green-200 text-green-800' : 'bg-amber-50 border-amber-200 text-amber-800'} border rounded-lg p-4 mb-4">
    <div class="font-semibold mb-1">数据完整性：${esc(ok && quality.status === '正常' ? '统计一致' : (quality.status || (ok ? '统计一致' : '需关注')))}</div>
    <div class="text-sm leading-6">
      汇总完成数 ${Number(quality.completed ?? summary.completed ?? 0)}，时间线完成数 ${Number(quality.timeline_completed ?? summary.completed ?? 0)}；${sampleNote}。
      ${issues.length ? `<ul class="list-disc pl-5 mt-1">${issues.map(item => `<li>${esc(item)}</li>`).join('')}</ul>` : '<span>完成数、时间线和百分位样本没有发现明显矛盾。</span>'}
      <div class="mt-1 font-medium">这里只表示统计数据内部一致，不代表请求目标正确、SLA 通过或系统性能健康。</div>
    </div>
  </div>`;
}

function renderLoadTestChainIntegrity(summary){
  const integrity = summary.chain_integrity || {};
  if(!integrity.status) return '';
  const incomplete = integrity.status === 'INCOMPLETE';
  const unknown = integrity.status === 'UNKNOWN';
  const tone = incomplete ? 'bg-red-50 border-red-300 text-red-800' : unknown ? 'bg-amber-50 border-amber-200 text-amber-800' : 'bg-green-50 border-green-200 text-green-800';
  const label = incomplete ? '业务链路不完整' : unknown ? '业务链路未校验' : '业务链路完整';
  return `<div class="${tone} border rounded-lg p-4 mb-4">
    <div class="flex flex-wrap items-center justify-between gap-2"><div class="font-semibold">${label}</div><div class="text-sm font-semibold">链路成功率 ${reportPercent(integrity.success_rate)}</div></div>
    <div class="text-sm leading-6 mt-1">已校验 ${Number(integrity.evaluated_chains || 0)} 条，完整通过 ${Number(integrity.successful_chains || 0)} 条，不完整 ${Number(integrity.incomplete_chains || 0)} 条；必需步骤执行率 ${reportPercent(integrity.step_completion_rate)}，跳过 ${Number(integrity.skipped_required_steps || 0)} 次，失败 ${Number(integrity.failed_required_steps || 0)} 次。${integrity.estimated ? ' 历史报告按步骤汇总保守重算。' : ''}</div>
  </div>`;
}

function renderLoadTestScenarioBreakdown(summary){
  const scenarios = Array.isArray(summary?.scenarios) ? summary.scenarios : [];
  if(!scenarios.length) return '';
  const total = scenarios.reduce((sum,item)=>sum+Number(item.count||0),0);
  return `<section class="bg-white rounded-lg shadow p-4 mb-4">
    <div class="flex items-center justify-between mb-3"><h4 class="font-semibold">业务链路场景分布</h4><span class="text-xs text-slate-400">共 ${total} 条执行链路 · 按权重调度</span></div>
    <div class="overflow-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-slate-500 text-left"><tr><th class="p-3">业务链路</th><th class="p-3 text-right">权重</th><th class="p-3 text-right">占比</th><th class="p-3 text-right">执行</th><th class="p-3 text-right">成功</th><th class="p-3 text-right">失败</th><th class="p-3 text-right">平均</th><th class="p-3 text-right">P95</th></tr></thead><tbody>${scenarios.map(item=>{
      const count=Number(item.count||0), passed=Number(item.passed||0), failed=Number(item.failed||0);
      const ratio=total?count*100/total:0;
      return `<tr class="border-t"><td class="p-3"><div class="font-medium">${esc(item.name||item.filename||'-')}</div><div class="text-xs text-slate-400 font-mono">${esc(item.filename||'')}</div></td><td class="p-3 text-right">${Number(item.weight||1)}</td><td class="p-3 text-right">${reportPercent(ratio)}</td><td class="p-3 text-right">${count}</td><td class="p-3 text-right text-green-600">${passed}</td><td class="p-3 text-right ${failed?'text-red-600':''}">${failed}</td><td class="p-3 text-right">${reportNumber(item.avg_ms)} ms</td><td class="p-3 text-right font-semibold">${reportNumber(item.p95_ms)} ms</td></tr>`;
    }).join('')}</tbody></table></div>
  </section>`;
}

function renderLoadTestTargetIntegrity(summary){
  const integrity = summary.target_integrity || {};
  const observed = Array.isArray(integrity.observed_targets) ? integrity.observed_targets : [];
  if(!integrity.expected_target && !observed.length) return '';
  const mismatch = integrity.status === 'MISMATCH';
  const matched = integrity.status === 'MATCHED';
  const label = mismatch ? '请求目标不一致' : matched ? '请求目标已核对' : '请求目标待核对';
  const tone = mismatch
    ? 'bg-red-50 border-red-300 text-red-800'
    : matched ? 'bg-green-50 border-green-200 text-green-800' : 'bg-amber-50 border-amber-200 text-amber-800';
  const observedText = observed.length
    ? observed.map(item => `${item.target}（${Number(item.count || 0)} 条${item.source ? ` ${item.source}` : ''}）`).join('；')
    : '暂无可核对的请求样本';
  return `<div class="${tone} border rounded-lg p-4 mb-4">
    <div class="font-semibold mb-1">${label}</div>
    <div class="text-sm leading-6">配置目标：${esc(integrity.expected_target || '-')}<br>实际观测：${esc(observedText)}</div>
    ${mismatch ? '<div class="text-sm font-semibold mt-2">本次结果不能作为被测系统容量结论，修复地址后必须重新压测。</div>' : ''}
  </div>`;
}

function reportVerdictBadge(verdict){
  const colors = {green:'bg-green-100 text-green-700', red:'bg-red-100 text-red-700', blue:'bg-blue-100 text-blue-700', amber:'bg-amber-100 text-amber-700'};
  return `<span class="badge ${colors[verdict?.color] || colors.amber}">${esc(verdict?.label || '未判定')}</span>`;
}

function reportScoreLabel(score){
  return score === null || score === undefined ? '—' : `${score}%`;
}

function reportEmptyState(message='暂无报告'){
  return `<div class="p-12 text-center text-slate-400">${esc(message)}</div>`;
}

function loadTestReportRows(){
  const keyword = String(_loadTestReportFilter.keyword || '').trim().toLowerCase();
  const status = _loadTestReportFilter.status || 'all';
  return _loadTestReportRuns.filter(run => {
    const text = `${run.scenario_name || ''} ${run.case_file || ''} ${run.id || ''}`.toLowerCase();
    if(keyword && !text.includes(keyword)) return false;
    if(status !== 'all' && run.status !== status) return false;
    return true;
  });
}

function isLoadTestReportDeletable(run){
  return !['pending', 'running', 'stopping'].includes(run?.status);
}

function pruneReportSelections(){
  const loadIds = new Set(_loadTestReportRuns.map(run => run.id));
  _selectedLoadTestReportIds = new Set(
    [..._selectedLoadTestReportIds].filter(id => loadIds.has(id))
  );
  const uiIds = new Set(_uiTestReports.filter(isUiReportReady).map(task => task.id));
  _selectedUiTestReportIds = new Set(
    [..._selectedUiTestReportIds].filter(id => uiIds.has(id))
  );
}

function toggleLoadTestReportSelection(id, checked){
  if(checked) _selectedLoadTestReportIds.add(id);
  else _selectedLoadTestReportIds.delete(id);
  renderLoadTestReports();
}

function toggleAllLoadTestReportSelections(checked){
  const rows = loadTestReportRows();
  rows.forEach(run => {
    if(isLoadTestReportDeletable(run)){
      if(checked) _selectedLoadTestReportIds.add(run.id);
      else _selectedLoadTestReportIds.delete(run.id);
    }
  });
  renderLoadTestReports();
}

async function batchDeleteLoadTestReports(){
  const ids = [..._selectedLoadTestReportIds];
  if(!ids.length){
    alert('请先选择要删除的压测报告');
    return;
  }
  if(!confirm(`确认删除 ${ids.length} 条压测报告？删除后不可恢复。`)) return;
  try{
    const result = await req('/load-tests/runs/batch', {
      method: 'DELETE',
      body: JSON.stringify({project_id: currentProject, run_ids: ids})
    });
    _selectedLoadTestReportIds.clear();
    alert(`已删除 ${result.deleted || 0} 条压测报告`);
    await reports();
  }catch(e){
    alert('批量删除失败：' + e.message);
  }
}

function renderLoadTestReports(){
  const body = document.getElementById('reportContent');
  if(!body) return;
  pruneReportSelections();
  const rows = loadTestReportRows();
  const deletableRows = rows.filter(isLoadTestReportDeletable);
  const selectedCount = rows.filter(run => _selectedLoadTestReportIds.has(run.id)).length;
  const allSelected = deletableRows.length > 0 &&
    deletableRows.every(run => _selectedLoadTestReportIds.has(run.id));
  const completed = _loadTestReportRuns.filter(run => ['completed','stopped','failed','interrupted'].includes(run.status));
  const conclusive = completed.filter(run => (
    !['failed','interrupted'].includes(run.status) &&
    run.summary?.target_integrity?.status !== 'MISMATCH'
  ));
  const passed = conclusive.filter(run => loadTestReportVerdict(run).label === '达到 SLA').length;
  const totalCompleted = conclusive.reduce((sum,run) => sum + Number(run.summary?.completed || 0), 0);
  const totalElapsed = conclusive.reduce((sum,run) => sum + Number(run.summary?.elapsed_seconds || 0), 0);
  const avgTps = totalElapsed ? totalCompleted / totalElapsed : 0;
  const maxP95 = conclusive.reduce((max,run) => Math.max(max, Number(run.summary?.p95_ms || 0)), 0);
  body.innerHTML = `
    <div class="grid grid-cols-2 xl:grid-cols-4 gap-3 mb-4">
      ${[
        ['报告总数', _loadTestReportRuns.length, 'text-indigo-600'],
        ['有效报告 SLA 达标', `${passed} / ${conclusive.length}`, 'text-green-600'],
        ['有效报告整体 TPS', reportNumber(avgTps), 'text-blue-600'],
        ['有效报告最高 P95', `${reportNumber(maxP95)} ms`, 'text-amber-600']
      ].map(item => `<div class="bg-white rounded-lg shadow p-4"><div class="text-xs text-slate-500">${item[0]}</div><div class="text-2xl font-bold mt-1 ${item[2]}">${item[1]}</div></div>`).join('')}
    </div>
    <div class="bg-white rounded-lg shadow overflow-hidden">
      <div class="p-4 border-b flex flex-wrap gap-3 items-center">
        <input id="loadReportKeyword" value="${escAttr(_loadTestReportFilter.keyword)}" oninput="_loadTestReportFilter.keyword=this.value;renderLoadTestReports()" class="border rounded px-3 py-2 text-sm w-64" placeholder="搜索场景、YAML 或报告 ID">
        <select id="loadReportStatus" onchange="_loadTestReportFilter.status=this.value;renderLoadTestReports()" class="border rounded px-3 py-2 text-sm">
          ${[['all','全部状态'],['completed','已完成'],['running','运行中'],['stopped','已停止'],['failed','失败'],['interrupted','服务中断']].map(item => `<option value="${item[0]}" ${_loadTestReportFilter.status===item[0]?'selected':''}>${item[1]}</option>`).join('')}
        </select>
        <button onclick="batchDeleteLoadTestReports()" ${selectedCount ? '' : 'disabled'} class="bg-red-600 text-white px-3 py-2 rounded text-sm hover:bg-red-700">批量删除${selectedCount ? `（${selectedCount}）` : ''}</button>
        <span class="text-xs text-slate-400 ml-auto">点击行查看自动分析与步骤瓶颈，运行中的报告不可删除</span>
      </div>
      <div class="overflow-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 text-slate-500 text-left">
            <tr><th class="p-3"><input type="checkbox" aria-label="全选可删除压测报告" ${allSelected ? 'checked' : ''} ${deletableRows.length ? '' : 'disabled'} onchange="toggleAllLoadTestReportSelections(this.checked)" onclick="event.stopPropagation()"></th><th class="p-3">场景</th><th class="p-3">运行方式</th><th class="p-3">负载</th><th class="p-3">结论</th><th class="p-3 text-right">TPS</th><th class="p-3 text-right">P95</th><th class="p-3 text-right">错误率</th><th class="p-3">完成时间</th><th class="p-3">操作</th></tr>
          </thead>
          <tbody>${rows.map(run => {
            const summary = run.summary || {};
            const config = run.config || {};
            const verdict = loadTestReportVerdict(run);
            const deletable = isLoadTestReportDeletable(run);
            return `<tr onclick="openLoadTestReport('${escAttr(run.id)}')" class="border-t hover:bg-indigo-50 cursor-pointer">
              <td class="p-3"><input type="checkbox" aria-label="选择压测报告 ${escAttr(run.id)}" ${_selectedLoadTestReportIds.has(run.id) ? 'checked' : ''} ${deletable ? '' : 'disabled'} onchange="toggleLoadTestReportSelection('${escAttr(run.id)}', this.checked)" onclick="event.stopPropagation()"></td>
              <td class="p-3"><div class="font-medium">${esc(run.scenario_name || run.case_file)}</div><div class="font-mono text-xs text-slate-400">${esc(run.id)}</div></td>
              <td class="p-3">${esc(loadTestModeLabel(run.mode))}</td>
              <td class="p-3">${Number(config.virtual_users || 0)} VU · ${reportDuration(summary.elapsed_seconds)}</td>
              <td class="p-3">${reportVerdictBadge(verdict)}</td>
              <td class="p-3 text-right font-semibold">${reportNumber(summary.tps)}</td>
              <td class="p-3 text-right">${reportNumber(summary.p95_ms)} ms</td>
              <td class="p-3 text-right ${Number(summary.error_rate || 0) > 0 ? 'text-red-600' : 'text-green-600'}">${reportPercent(summary.error_rate)}</td>
              <td class="p-3 text-xs text-slate-500">${esc(run.finished_at || run.created_at || '-')}</td>
              <td class="p-3"><button onclick="event.stopPropagation();openLoadTestReport('${escAttr(run.id)}')" class="text-indigo-600 hover:underline">查看分析</button></td>
            </tr>`;
          }).join('') || `<tr><td colspan="10">${reportEmptyState('暂无符合条件的全链路压测报告')}</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
}

  const body = document.getElementById('reportContent');
  if(!body) return;
  pruneReportSelections();
  const reports = _uiTestReports.filter(isUiReportReady);
  const selectedCount = reports.filter(task => _selectedUiTestReportIds.has(task.id)).length;
  const allSelected = reports.length > 0 && reports.every(task => _selectedUiTestReportIds.has(task.id));
  body.innerHTML = `
    <div class="p-4 border-b flex flex-wrap gap-3 items-center">
      ${selectedCount ? `<button onclick="openUiReportNotificationModal()" class="bg-indigo-600 text-white px-3 py-2 rounded text-sm hover:bg-indigo-700">✉ 批量通知（${selectedCount}）</button>` : ''}
      <button onclick="batchDeleteUiTestReports()" ${selectedCount ? '' : 'disabled'} class="bg-red-600 text-white px-3 py-2 rounded text-sm hover:bg-red-700">批量删除${selectedCount ? `（${selectedCount}）` : ''}</button>
      <span class="text-xs text-slate-400">删除后将同时清理对应 UI 报告文件</span>
    </div>
    <div class="bg-white rounded-lg shadow overflow-auto">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 text-slate-500 text-left">
          <tr><th class="p-3"><input type="checkbox" aria-label="全选 UI 自动化报告" ${allSelected ? 'checked' : ''} onchange="toggleAllUiTestReportSelections(this.checked)" onclick="event.stopPropagation()"></th><th class="p-3">执行 ID</th><th class="p-3">状态</th><th class="p-3">通过 / 失败 / 总数</th><th class="p-3">耗时</th><th class="p-3">触发</th><th class="p-3">完成时间</th><th class="p-3">操作</th></tr>
        </thead>
        <tbody>${reports.map(task => `
          <tr class="border-t hover:bg-slate-50">
            <td class="p-3"><input type="checkbox" aria-label="选择 UI 自动化报告 ${escAttr(task.id)}" ${_selectedUiTestReportIds.has(task.id) ? 'checked' : ''} onchange="toggleUiTestReportSelection('${escAttr(task.id)}', this.checked)" onclick="event.stopPropagation()"></td>
            <td class="p-3 font-mono text-xs">${esc(task.id)}</td>
            <td class="p-3">${badge(task.status)}</td>
            <td class="p-3"><span class="text-green-600">${task.passed||0}</span> / <span class="text-red-600">${task.failed||0}</span> / ${task.total||0}</td>
            <td class="p-3">${reportDuration(task.duration)}</td>
            <td class="p-3 text-xs text-slate-500">${esc(task.triggered_by||'-')}</td>
            <td class="p-3 text-xs text-slate-500">${esc(task.finished_at||'-')}</td>
            <td class="p-3">
              <a href="${escAttr(task.report_url)}" target="_blank" class="text-green-600 hover:underline mr-2">查看报告</a>
              <button onclick="viewTask('${escAttr(task.id)}')" class="text-indigo-600 hover:underline">详情</button>
            </td>
          </tr>`).join('') || `<tr><td colspan="8">${reportEmptyState('暂无 UI 自动化报告')}</td></tr>`}
        </tbody>
      </table>
    </div>`;
}

function toggleUiTestReportSelection(id, checked){
  if(checked) _selectedUiTestReportIds.add(id);
  else _selectedUiTestReportIds.delete(id);
  renderUiTestReports();
}

function toggleAllUiTestReportSelections(checked){
  const reports = _uiTestReports.filter(isUiReportReady);

    else _selectedUiTestReportIds.delete(task.id);

async function batchDeleteUiTestReports(){
  const ids = [..._selectedUiTestReportIds];
  if(!ids.length){
    alert('请先选择要删除的 UI 自动化报告');
    return;

function filteredReportNotificationTargets(){
  const keyword = String(document.getElementById('reportNotificationSearch')?.value || '').trim().toLowerCase();
  if(!keyword) return _reportNotificationTargets;
  return _reportNotificationTargets.filter(item => (
    `${item.name || ''} ${notificationTypeLabel(item.type)}`.toLowerCase().includes(keyword)
  ));
}

function renderReportNotificationTargetRows(){
  const target = document.getElementById('reportNotificationTargetRows');
  if(!target) return;
  const rows = filteredReportNotificationTargets();
  target.innerHTML = rows.map(item => `
    <label class="report-notification-grid report-notification-row">
      <span class="report-notification-check"><input type="checkbox" value="${escAttr(item.id)}" ${_selectedReportNotificationIds.has(item.id) ? 'checked' : ''} onchange="toggleReportNotificationTarget('${escAttr(item.id)}', this.checked)"></span>
      <span class="report-notification-name" title="${escAttr(item.name || '未命名通知')}">${esc(item.name || '未命名通知')}</span>
      <span class="report-notification-type" title="${escAttr(notificationTypeLabel(item.type))}">${esc(notificationTypeLabel(item.type))}</span>
      <span class="report-notification-date">${esc(item.created_at || '-')}</span>
    </label>
  `).join('') || '<div class="report-notification-empty">暂无匹配的启用通知，请先前往设置 → 第三方集成配置</div>';
  const selectAll = document.getElementById('reportNotificationSelectAll');
  if(selectAll){
    selectAll.checked = rows.length > 0 && rows.every(item => _selectedReportNotificationIds.has(item.id));
  }
  const sendButton = document.getElementById('sendReportNotificationButton');
  if(sendButton) sendButton.disabled = _selectedReportNotificationIds.size === 0;
}

function toggleReportNotificationTarget(id, checked){
  if(checked) _selectedReportNotificationIds.add(id);
  else _selectedReportNotificationIds.delete(id);
  renderReportNotificationTargetRows();
}

function toggleAllReportNotificationTargets(checked){
  filteredReportNotificationTargets().forEach(item => {
    if(checked) _selectedReportNotificationIds.add(item.id);
    else _selectedReportNotificationIds.delete(item.id);
  });
  renderReportNotificationTargetRows();
}

async function openUiReportNotificationModal(){
  const reportIds = [..._selectedUiTestReportIds];
  if(!reportIds.length){
    alert('请先选择要发送通知的 UI 自动化报告');
    return;
  }
  _selectedReportNotificationIds.clear();
  openModal('通知', '<div class="p-10 text-center text-slate-400">正在加载第三方通知...</div>');
  try{
    const result = await req('/report-notifications/targets');
    _reportNotificationTargets = Array.isArray(result.targets) ? result.targets : [];
    document.getElementById('modalBody').innerHTML = `
      <div class="text-sm text-slate-600 mb-4">已选择 ${reportIds.length} 个 UI 自动化报告，请选择接收通知的第三方集成。</div>
      <div class="report-notification-search">
        <input id="reportNotificationSearch" oninput="renderReportNotificationTargetRows()" placeholder="搜索通知名称或类型">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      </div>
      <div class="report-notification-table">
        <div class="report-notification-grid report-notification-header">
          <span class="report-notification-check"><input id="reportNotificationSelectAll" type="checkbox" aria-label="全选通知" onchange="toggleAllReportNotificationTargets(this.checked)"></span>
          <span>通知名称</span><span>通知类型</span><span>创建时间</span>
        </div>
        <div id="reportNotificationTargetRows" class="report-notification-rows"></div>
      </div>
      <div class="flex justify-end gap-3 mt-5 pt-4 border-t">
        <button onclick="closeModal()" class="bg-slate-100 text-slate-700 px-5 py-2 rounded hover:bg-slate-200">关闭</button>
        <button id="sendReportNotificationButton" onclick="sendUiReportNotifications()" disabled class="bg-indigo-600 text-white px-5 py-2 rounded hover:bg-indigo-700 disabled:opacity-50">发送通知</button>
      </div>`;
    renderReportNotificationTargetRows();
  }catch(e){
    document.getElementById('modalBody').innerHTML = `<div class="p-10 text-center text-red-500">加载第三方通知失败：${esc(e.message)}</div>`;
  }
}

async function sendUiReportNotifications(){
  const reportIds = [..._selectedUiTestReportIds];
  const notificationIds = [..._selectedReportNotificationIds];
  if(!reportIds.length || !notificationIds.length) return;
  const button = document.getElementById('sendReportNotificationButton');
  if(button){ button.disabled = true; button.textContent = '发送中...'; }
  try{
    const result = await req('/report-notifications/send', {
      method: 'POST',
      body: JSON.stringify({report_ids: reportIds, notification_ids: notificationIds})
    });
    if(result.failed){
      alert(`通知发送完成：成功 ${result.sent || 0}，失败 ${result.failed}`);
      if(button){ button.disabled = false; button.textContent = '重新发送'; }
      return;
    }
    closeModal();
    alert(`已发送 ${result.sent || 0} 条通知`);
  }catch(e){
    alert('批量通知发送失败：' + e.message);
    if(button){ button.disabled = false; button.textContent = '重新发送'; }
  }
}

async function reports(){
  const reportParams = new URLSearchParams(window.location.search);
  if(reportParams.get('tab') === 'ui') _reportTab = 'ui';
  if(reportParams.get('task_id')) _selectedUiTestReportId = reportParams.get('task_id');
  main.innerHTML = `
    <div class="flex flex-wrap justify-between items-start gap-3 mb-5">
      <div><h2 class="text-2xl font-bold">测试报告</h2><p class="text-sm text-slate-500 mt-1">执行结果、SLA 判定、瓶颈步骤和改进建议统一收口。</p></div>
      <button onclick="reports()" class="bg-slate-600 text-white px-3 py-2 rounded hover:bg-slate-700">刷新</button>
    </div>
    <div class="flex border-b mb-4 gap-1">
      <div class="tab-btn ${_reportTab==='load'?'active':''}" onclick="_reportTab='load';renderReportTab()">全链路压测报告</div>
      <div class="tab-btn ${_reportTab==='ui'?'active':''}" onclick="_reportTab='ui';renderReportTab()">UI 自动化报告</div>
    </div>
    <div id="reportContent"><div class="p-12 text-center text-slate-400">加载中...</div></div>`;
  try{
    const [loadRuns, tasks] = await Promise.all([
      req(`/load-tests/runs?project_id=${encodeURIComponent(currentProject)}&limit=200`),
      req(`/tasks?limit=200&project_id=${currentProject}`)
    ]);
    _loadTestReportRuns = Array.isArray(loadRuns) ? loadRuns : [];
    _uiTestReports = Array.isArray(tasks) ? tasks : [];
    renderReportTab();
    if(_reportTab === 'ui' && _selectedUiTestReportId){
      const selected = _uiTestReports.find(task => String(task.id) === String(_selectedUiTestReportId));
      if(isUiReportReady(selected)) window.open(selected.report_url, '_blank', 'noopener,noreferrer');
    }
    if(_selectedLoadTestReportId && _loadTestReportRuns.some(item => item.id === _selectedLoadTestReportId)){
      openLoadTestReport(_selectedLoadTestReportId);
    }
  }catch(e){
    const body = document.getElementById('reportContent');
    if(body) body.innerHTML = `<div class="bg-white rounded-lg shadow p-8 text-red-500">报告加载失败：${esc(e.message)}</div>`;
  }
}

function renderReportTab(){
  const body = document.getElementById('reportContent');
  if(!body) return;
  document.querySelectorAll('.tab-btn').forEach((item,index) => item.classList.toggle('active', (_reportTab==='load' && index===0) || (_reportTab==='ui' && index===1)));
  if(_reportTab === 'ui') renderUiTestReports();
  else renderLoadTestReports();
}

async function openLoadTestReport(runId){
  _selectedLoadTestReportId = runId;
  try{
    const run = await req(`/load-tests/runs/${encodeURIComponent(runId)}`);
    renderLoadTestReportDetail(run);
  }catch(e){
    const body = document.getElementById('reportContent');
    if(body) body.innerHTML = `<div class="bg-white rounded-lg shadow p-8 text-red-500">报告详情加载失败：${esc(e.message)}</div>`;
  }
}

async function downloadLoadTestReport(runId){
  try{
    const run = await req(`/load-tests/runs/${encodeURIComponent(runId)}`);
    const analysisResult = loadTestReportAnalysis(run);
    const payload = {...run, analysis: analysisResult};
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = `runnergo-load-report-${run.id}.json`;
    anchor.click();
    URL.revokeObjectURL(url);
  }catch(e){ alert('报告导出失败：' + e.message); }
}

async function downloadLoadTestExport(runId, format){
  try{
    const response = await fetch(`${API}/load-tests/runs/${encodeURIComponent(runId)}/export?format=${encodeURIComponent(format)}`);
    if(!response.ok) throw new Error((await response.json().catch(()=>({}))).detail || response.statusText);
    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = `runnergo-load-report-${runId}.${format==='markdown'?'md':format}`;
    anchor.click();
    URL.revokeObjectURL(url);
  }catch(e){ alert('报告导出失败：' + e.message); }
}

function toggleNotificationSelectAll(){

async function batchDeleteNotifications(){
  const ids = [...document.querySelectorAll('.notification-check:checked')].map(item=>item.value);
  if(!ids.length){ alert('请先选择要删除的通知记录'); return; }
  if(!confirm(`确认删除 ${ids.length} 条通知记录？`)) return;
  const r = await req('/notifications/batch',{method:'DELETE',body:JSON.stringify({ids})});
  alert(`已删除 ${r.deleted} 条` + (r.errors?.length ? `，失败 ${r.errors.length} 条` : ''));
  notifications();
}

// ===== 定时任务 =====
function jobTriggerLabel(type){
  return {CRON:'Cron表达式',INTERVAL:'固定间隔',ONCE:'单次执行',COUNT:'执行次数'}[String(type||'CRON').toUpperCase()] || 'Cron表达式';
}
function jobTriggerBadge(type){
  const normalized = String(type||'CRON').toUpperCase();
  const cls = {CRON:'bg-indigo-100 text-indigo-700',INTERVAL:'bg-blue-100 text-blue-700',ONCE:'bg-green-100 text-green-700',COUNT:'bg-purple-100 text-purple-700'}[normalized] || 'bg-slate-100 text-slate-600';
  return `<span class="badge ${cls}">${jobTriggerLabel(normalized)}</span>`;
}
function jobStatusBadge(status){
  const normalized = String(status||'ACTIVE').toUpperCase();
  const map = {
    ACTIVE:['激活','bg-green-100 text-green-700'],
    PAUSED:['暂停','bg-amber-100 text-amber-700'],
    COMPLETED:['已完成','bg-slate-100 text-slate-600'],
    FAILED:['失败','bg-red-100 text-red-700']
  };
  const [label, cls] = map[normalized] || [normalized, 'bg-slate-100 text-slate-600'];
  return `<span class="badge ${cls}">${label}</span>`;
}
function jobTriggerSummary(j){
  const type = String(j.trigger_type||'CRON').toUpperCase();
  if(type==='INTERVAL') return `每 ${Math.max(60, Number(j.interval_seconds||3600))} 秒`;
  if(type==='ONCE') return esc(j.execute_at||'-');
  if(type==='COUNT') return `执行 ${Math.max(1, Number(j.repeat_count||1))} 次`;
  return esc(j.cron||'-');
}
function jobRepeatDisplay(j){
  const limit = Math.max(0, Number(j.repeat_count||0));
  if(String(j.trigger_type||'CRON').toUpperCase()!=='COUNT' && !limit) return '-';
  if(!limit) return '不限';
  return `${j.total_runs||0} / ${limit}`;
}
function toJobDatetimeLocal(value){
  const text = String(value||'').trim();
  if(!text) return '';
  return text.replace(' ', 'T').slice(0, 16);
}
function renderJobTriggerFields(){
  const type = document.querySelector('#modalBody input[name="j_trigger_type"]:checked')?.value || 'CRON';
  $('#jobCronField')?.classList.toggle('hidden', type!=='CRON');
  $('#jobIntervalField')?.classList.toggle('hidden', type!=='INTERVAL');
  $('#jobOnceField')?.classList.toggle('hidden', type!=='ONCE');
  renderJobRepeatField();
}
function renderJobRepeatField(){
  const checked = (document.querySelector('#modalBody input[name="j_trigger_type"]:checked')?.value || 'CRON') === 'COUNT';
  const input = $('#j_repeat');
  if(input){
    input.disabled = !checked;
    input.classList.toggle('bg-slate-50', !checked);
  }
}
function jobActionButtons(j){
  const id = escAttr(j.id);
  const status = String(j.status||'ACTIVE').toUpperCase();
  const buttons = [];
  if(status!=='COMPLETED') buttons.push(`<button onclick="runJobNow('${id}')" class="text-green-600 hover:underline mr-2">执行</button>`);
  buttons.push(`<button onclick="jobForm('${id}')" class="text-indigo-600 hover:underline mr-2">编辑</button>`);
  if(status==='ACTIVE') buttons.push(`<button onclick="pauseJob('${id}')" class="text-amber-600 hover:underline mr-2">暂停</button>`);
  if(status==='PAUSED' || status==='FAILED') buttons.push(`<button onclick="resumeJob('${id}')" class="text-green-600 hover:underline mr-2">恢复</button>`);
  buttons.push(`<button onclick="delJob('${id}')" class="text-red-600 hover:underline">删除</button>`);
  return buttons.join('');
}

async function saveJob(id){

function syncWebRecorderRouteDraft(draftId=''){
  if(!_webRecorderEditingCase)return;
  const url=new URL(window.location.href);
  url.searchParams.set('project_id',currentProject);
  url.searchParams.set('case',_webRecorderEditingCase.filename);

  else url.searchParams.delete('draft_id');
  history.replaceState({page:'webRecorder'},'',url.pathname+url.search);

async function loadWebRecorderEditingCase(filename){
  const data=await req(`/web/flows/${encodeURIComponent(currentProject)}/${encodeURIComponent(filename)}`);
  const flow=data.flow||{};
  const viewport=flow.browser?.viewport||{};
  const firstGoto=(flow.steps||[]).find(step=>step.action==='goto');
  _webRecorderEditingCase={filename:data.filename,flow};
  _webRecorderSteps=JSON.parse(JSON.stringify(flow.steps||[]));
  _webRecorderViewport={
    width:Number(viewport.width)||1440,
    height:Number(viewport.height)||900,
  };
  _webRecorderBaseUrl=flow.base_url||(/^(https?:)?\/\//.test(firstGoto?.url||'')?firstGoto.url:'');
  _webRecorderVariables=normalizeWebFlowVariables(flow);
  _webRuntimeAssertions=normalizeWebRuntimeAssertions(flow);
  syncWebRecorderVariablesFromSteps();
}

async function recoverWebRecorderEditingDraft(draftId){
  if(!draftId||!_webRecorderEditingCase)return null;
  try{
    const active=await req(`/web/recordings/active?project_id=${encodeURIComponent(currentProject)}`);
    if(active.active&&active.session_id===draftId){
      _webRecorderSession=active.session_id;
      _webRecorderDraftId=active.session_id;
      _webRecorderDraftStatus=active.status||'recording';
      _webRecorderAuthStateSaved=Boolean(active.auth_state_saved);
      _webRecorderSteps=active.steps||_webRecorderSteps;
      _webRecorderViewport=active.viewport||_webRecorderViewport;
      _webRecorderTabs=active.tabs||[];
      return active;
    }
    const draft=await req(`/web/recording-drafts/${encodeURIComponent(draftId)}`);
    if(draft.project_id!==currentProject)throw new Error('调试草稿不属于当前项目');
    _webRecorderDraftId=draft.id;
    _webRecorderDraftStatus=draft.status||'stopped';
    _webRecorderAuthStateSaved=Boolean(draft.auth_state_saved);
    _webRecorderSteps=draft.steps||_webRecorderSteps;
    _webRecorderViewport=draft.viewport||_webRecorderViewport;
    _webRecorderBaseUrl=draft.start_url||_webRecorderBaseUrl;
  }catch(e){
    syncWebRecorderRouteDraft('');
  }
  return null;
}
