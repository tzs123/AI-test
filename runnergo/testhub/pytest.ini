[pytest]
DJANGO_SETTINGS_MODULE = backend.settings
python_files = test_*.py
python_classes = *Tests
python_functions = test_*
# Generated/copilot artifacts under media are runtime data, not the platform's
# regression suite. Keep collection deterministic and avoid duplicate module
# names such as test_payment_api.py in separate generated directories.
testpaths = apps device_bridge/tests docker/tests
