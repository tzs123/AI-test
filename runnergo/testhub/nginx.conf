server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1024m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    location = / {
        # Serve the SPA shell directly at the exposed port.  Redirecting to
        # /testhub/ triggers the shell's legacy module redirect back to /#/index,
        # which then hits this location again and leaves the browser in a loop.
        try_files /testhub/index.html =404;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    location = /testhub/module-nav.js {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
    }

    location = /testhub/agent {
        return 301 /testhub/agent/;
    }

    location ^~ /testhub/agent/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Smart Test Engine API is an additive route and does not alter the
    # existing Django /api/ response contracts.
    location ^~ /api/v1/agent/ {
        proxy_pass http://agent-engine:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /tree-sitter.wasm {
        try_files /testhub/tree-sitter.wasm =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /tree-sitter-bash.wasm {
        try_files /testhub/tree-sitter-bash.wasm =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # TestHub API and websocket endpoints.
    location ^~ /api/ {
        proxy_pass http://testhub-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /ws/ {
        proxy_pass http://testhub-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The UI automation agent keeps its legacy API under /auto-test/.
    location ^~ /auto-test/ {
        proxy_pass http://auto-test:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Preserve the public port for same-origin cookie/CSRF checks.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<script defer src="/testhub/sql-console/stress-params-inject.js?v=1"></script></head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }

    # UI execution tasks persist public report and screenshot links at the
    # root paths below. Proxy them to auto-test as well as the /auto-test/
    # application shell so links in existing records remain valid.
    location ^~ /report/ {
        proxy_pass http://auto-test:8000/report/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HMAC-signed public Allure report URLs shared via third-party cards
    # (Feishu / WeCom / DingTalk). These bypass RunnerGo login at the
    # application layer by validating an unguessable per-task token; see
    # auto-test/backend/app.py::_serve_public_report and settings signers.
    location ^~ /public-report/ {
        proxy_pass http://auto-test:8000/public-report/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /screenshots/ {
        proxy_pass http://auto-test:8000/screenshots/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The current management image does not ship the historical performance
    # report endpoints. Keep the old dashboard contract backed by auto-test's
    # preserved load-test reports.
    location = /management/api/v1/report/list {
        proxy_pass http://auto-test:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /management/api/v1/performance/rule/latest {
        proxy_pass http://auto-test:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /management/api/v1/performance/rule/save {
        proxy_pass http://auto-test:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /management/api/v1/performance/report/analyze {
        proxy_pass http://auto-test:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /management/api/v1/performance/report/detail {
        proxy_pass http://auto-test:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana is configured to serve from the /grafana/ sub-path. Keep the
    # iframe URL used by the performance dashboard on the same origin.
    location ^~ /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Performance pages use the existing RunnerGo management service.
    location ^~ /management/ {
        proxy_pass http://manage:30000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /testhub/ {
        try_files $uri $uri/ /testhub/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        sub_filter '</head>' '<script defer src="/testhub/sql-console/workflow-export-inject.js?v=8"></script></head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }

    location ~* ^/testhub/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # RunnerGo web-ui SPA opens a realtime-collaboration WebSocket at
    # /websocket/index.  Without an explicit location block this path falls
    # through to the catch-all below (web-ui:81) and is served as a plain HTTP
    # request -- no Upgrade headers -- so the handshake aborts.  The SPA then
    # reconnects, and its pongTimer (60s in the minified bundle) cycles on
    # each failure.  Point it at the manage service alongside /management/.
    location ^~ /websocket/ {
        # Route through Python WebSocket proxy that wraps non-JSON messages
        # (like "Pong-") as valid JSON so the SPA's JSON.parse never throws.
        proxy_pass http://host.docker.internal:30001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Proxy all unmatched paths to the RunnerGo web-ui (manage SPA) so that the
    # legacy-api.html iframe can use a same-origin URL instead of cross-origin
    # http://127.0.0.1:9997 (which broke cookie sharing and blocked login).
    # /management/ already proxies to manage:30000 API above, so the SPA's API
    # calls still reach the right backend; only static assets and SPA routes
    # fall through to web-ui:81.
    # Web-ui SPA entry HTML: NEVER cache.  index.html changes whenever we
    # add/rename JS chunks; a cached entry point would keep pointing at the
    # old (possibly stale or removed) bundle forever.
    location = /index.html {
        proxy_pass http://web-ui:81/index.html;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding "";
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        sub_filter '</head>' '<script defer src="/testhub/sql-console/workflow-export-inject.js?v=8"></script></head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }

    # Web-ui SPA JS/CSS: force revalidation because we occasionally hot-patch
    # the minified bundle in-place (content changes, filename stays the same).
    # Browser disk-cache would otherwise serve the stale version indefinitely.
    # Also matches our .v2 renamed variants (no longer strict hex check).
    location ~* ^/(index|vendor|vendors|423|856)[-._a-z0-9]*\.(js|css)$ {
        proxy_pass http://web-ui:81;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        proxy_pass http://web-ui:81;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
