name: ui-component-pack
version: 2026.07.17
description: 导出的组件包
author: ''
components:
- type: click
  name: 点击
  category: action
  description: 点击指定元素或坐标
  schema:
    required:
    - selector_type
    - selector
    properties:
      timeout:
        type: number
      selector:
        type: string
      image_scope:
        type: string
      selector_type:
        type: string
      image_threshold:
        type: number
  default_config:
    timeout: 5
    selector: ''
    image_scope: common
    selector_type: image
    image_threshold: 0.85
  enabled: true
  sort_order: 10
- type: set_variable
  name: 设置变量
  category: utility
  description: 设置运行时变量
  schema:
    required:
    - name
    - value
    properties:
      name:
        type: string
      scope:
        type: string
      value:
        type: string
      value_type:
        type: string
  default_config:
    name: ''
    scope: local
    value: ''
    value_type: string
  enabled: true
  sort_order: 10
- type: input
  name: 输入文本
  category: action
  description: 输入文本
  schema:
    required:
    - selector_type
    - selector
    - value
    properties:
      value:
        type: string
      send_enter:
        type: boolean
      selector:
        type: string
      image_scope:
        type: string
      selector_type:
        type: string
      image_threshold:
        type: number
  default_config:
    value: ''
    send_enter: false
    selector: ''
    image_scope: common
    selector_type: image
    image_threshold: 0.85
  enabled: true
  sort_order: 20
- type: press_enter
  name: 回车键
  category: base_page
  description: 发送系统回车键，常用于搜索、提交输入框或关闭键盘
  schema:
    required: []
    properties:
      wait_after:
        type: number
      save_as:
        type: string
      scope:
        type: string
        enum:
        - local
        - global
  default_config:
    wait_after: 0.3
    save_as: press_enter_result
    scope: local
  enabled: true
  sort_order: 65
- type: unset_variable
  name: 删除变量
  category: utility
  description: 删除运行时变量
  schema:
    required:
    - name
    properties:
      name:
        type: string
      scope:
        type: string
  default_config:
    name: ''
    scope: local
  enabled: true
  sort_order: 20
- type: extract_output
  name: 输出抽取
  category: utility
  description: 从输出中提取字段保存为变量
  schema:
    required:
    - source
    - path
    - name
    properties:
      name:
        type: string
      path:
        type: string
      scope:
        type: string
      source:
        type: string
  default_config:
    name: ''
    path: ''
    scope: local
    source: outputs.last
  enabled: true
  sort_order: 30
- type: swipe
  name: 滑动
  category: action
  description: 方向滑动或坐标滑动
  schema:
    required:
    - direction
    properties:
      duration:
        type: number
      selector:
        type: string
      direction:
        type: string
      image_scope:
        type: string
      selector_type:
        type: string
  default_config:
    selector: ''
    direction: up
    image_scope: common
    selector_type: pos
  enabled: true
  sort_order: 30
- type: short_video_feed
  name: 短视频刷视频
  category: business
  description: 进入短视频流后，按随机观看时长循环播放检测、概率行为、智能滑动、异常恢复和截图验证
  schema:
    required:
    - count
    - watch_time
    - direction
    properties:
      count:
        type: number
      watch_time:
        type: object
      direction:
        type: string
        enum:
        - up
        - down
      swipe_distance:
        type: number
      random_swipe:
        type: boolean
      random_stay:
        type: boolean
      selector_type:
        type: string
      selector:
        type: string
      image_scope:
        type: string
      image_threshold:
        type: number
      video_region:
        type: array
      play_timeout:
        type: number
      sample_interval:
        type: number
      motion_threshold:
        type: number
      transition_timeout:
        type: number
      transition_threshold:
        type: number
      max_swipe_retries:
        type: number
      like_probability:
        type: number
      favorite_probability:
        type: number
      comment_probability:
        type: number
      follow_probability:
        type: number
      action_targets:
        type: object
      comment_texts:
        type: array
      exception_detection:
        type: boolean
      ocr_exception_detection:
        type: boolean
      exception_keywords:
        type: array
      exception_close_texts:
        type: array
      exception_close_targets:
        type: object
      capture_each_video:
        type: boolean
      save_as:
        type: string
  default_config:
    count: 100
    watch_time:
      min: 5
      max: 15
    direction: up
    swipe_distance: 0.8
    random_swipe: true
    random_stay: true
    selector_type: image
    selector: ''
    image_scope: common
    image_threshold: 0.85
    video_region:
    - 0.05
    - 0.12
    - 0.95
    - 0.88
    play_timeout: 8
    sample_interval: 0.35
    motion_threshold: 0.012
    transition_timeout: 2.5
    transition_threshold: 0.045
    max_swipe_retries: 2
    like_probability: 0
    favorite_probability: 0
    comment_probability: 0
    follow_probability: 0
    action_targets: {}
    comment_texts: []
    exception_detection: true
    ocr_exception_detection: true
    exception_keywords:
    - 请先登录
    - 登录后继续
    - 网络异常
    - 加载失败
    - 青少年模式
    - 跳过广告
    exception_close_texts:
    - 重试
    - 取消
    - 以后再说
    - 暂不登录
    - 我知道了
    - 关闭
    - 跳过
    exception_close_targets: {}
    capture_each_video: true
    save_as: short_video_feed_result
  enabled: true
  sort_order: 10
- type: wait_video_play
  name: 等待视频播放
  category: business
  description: 通过视频区域连续帧变化判断视频已开始播放
  schema:
    required:
    - timeout
    properties:
      timeout:
        type: number
      sample_interval:
        type: number
      motion_threshold:
        type: number
      required_motion_samples:
        type: number
      video_region:
        type: array
      exception_detection:
        type: boolean
      ocr_exception_detection:
        type: boolean
  default_config:
    timeout: 8
    sample_interval: 0.35
    motion_threshold: 0.012
    required_motion_samples: 2
    video_region:
    - 0.05
    - 0.12
    - 0.95
    - 0.88
    exception_detection: true
    ocr_exception_detection: true
  enabled: true
  sort_order: 20
- type: watch_video
  name: 观看视频
  category: business
  description: 在指定时长内停留并通过连续帧变化校验视频未卡住
  schema:
    required:
    - duration
    properties:
      duration:
        type: number
      verify_playing:
        type: boolean
      sample_interval:
        type: number
      motion_threshold:
        type: number
      video_region:
        type: array
  default_config:
    duration: 10
    verify_playing: true
    sample_interval: 0.5
    motion_threshold: 0.012
    video_region:
    - 0.05
    - 0.12
    - 0.95
    - 0.88
  enabled: true
  sort_order: 30
- type: random_action
  name: 随机行为
  category: business
  description: 按概率执行点赞、收藏、评论和关注，所有目标均使用可配置的归一化坐标或定位配置
  schema:
    properties:
      like_probability:
        type: number
      favorite_probability:
        type: number
      comment_probability:
        type: number
      follow_probability:
        type: number
      action_targets:
        type: object
      comment_texts:
        type: array
      action_interval:
        type: number
      save_as:
        type: string
  default_config:
    like_probability: 0.1
    favorite_probability: 0.05
    comment_probability: 0.01
    follow_probability: 0.01
    action_targets: {}
    comment_texts: []
    action_interval: 0.5
    save_as: random_action_result
  enabled: true
  sort_order: 40
- type: api_request
  name: HTTP请求
  category: action
  description: 执行HTTP请求并支持提取结果
  schema:
    required:
    - method
    - url
    properties:
      url:
        type: string
      data:
        type: object
      json:
        type: object
      scope:
        type: string
      method:
        type: string
      params:
        type: object
      headers:
        type: object
      save_as:
        type: string
      timeout:
        type: number
      extracts:
        type: array
      response_type:
        type: string
      expected_status:
        type: number
  default_config:
    url: ''
    data: {}
    json: {}
    scope: local
    method: GET
    params: {}
    headers: {}
    save_as: ''
    timeout: 10
    extracts: []
    response_type: auto
  enabled: true
  sort_order: 40
- type: wait
  name: 等待
  category: control
  description: 等待指定时间或等待元素出现
  schema:
    required:
    - timeout
    properties:
      timeout:
        type: number
      selector:
        type: string
      image_scope:
        type: string
      selector_type:
        type: string
      image_threshold:
        type: number
  default_config:
    timeout: 3
    selector: ''
    image_scope: common
    selector_type: image
    image_threshold: 0.85
  enabled: true
  sort_order: 40
- type: image_exists_click
  name: 图片存在点击
  category: action
  description: 主定位存在则点击主定位，否则点击备用定位
  schema:
    required:
    - selector
    - fallback_selector
    properties:
      selector_type:
        type: string
        enum:
        - image
        - pos
        - region
      selector:
        type: string
      image_scope:
        type: string
      image_threshold:
        type: number
      fallback_selector_type:
        type: string
        enum:
        - image
        - pos
        - region
      fallback_selector:
        type: string
      fallback_image_scope:
        type: string
      fallback_image_threshold:
        type: number
      timeout:
        type: number
  default_config:
    selector_type: image
    selector: ''
    image_scope: common
    image_threshold: 0.85
    fallback_selector_type: image
    fallback_selector: ''
    fallback_image_scope: common
    fallback_image_threshold: 0.85
    timeout: 5
  enabled: true
  sort_order: 70
- type: screenshot
  name: 截图
  category: utility
  description: 截图保存
  schema:
    required: []
    properties:
      note:
        type: string
  default_config:
    note: ''
    selector: ''
    selector_type: image
  enabled: true
  sort_order: 70
- type: image_exists_click_chain
  name: 图片存在依次点击
  category: action
  description: 主定位存在则点击主定位再点击备用定位，否则直接点击备用定位
  schema:
    required:
    - selector
    - fallback_selector
    properties:
      selector_type:
        type: string
        enum:
        - image
        - pos
        - region
      selector:
        type: string
      image_scope:
        type: string
      image_threshold:
        type: number
      fallback_selector_type:
        type: string
        enum:
        - image
        - pos
        - region
      fallback_selector:
        type: string
      fallback_image_scope:
        type: string
      fallback_image_threshold:
        type: number
      timeout:
        type: number
  default_config:
    selector_type: image
    selector: ''
    image_scope: common
    image_threshold: 0.85
    fallback_selector_type: image
    fallback_selector: ''
    fallback_image_scope: common
    fallback_image_threshold: 0.85
    timeout: 5
  enabled: true
  sort_order: 72
- type: long_press
  name: 长按
  category: action
  description: 长按指定元素
  schema:
    required:
    - selector_type
    - selector
    properties:
      timeout:
        type: number
      duration:
        type: number
      selector:
        type: string
      image_scope:
        type: string
      selector_type:
        type: string
  default_config:
    timeout: 5
    duration: 2
    selector: ''
    image_scope: common
    selector_type: image
  enabled: true
  sort_order: 80
- type: double_click
  name: 双击
  category: action
  description: 双击指定元素
  schema:
    required:
    - selector_type
    - selector
    properties:
      timeout:
        type: number
      selector:
        type: string
      image_scope:
        type: string
      selector_type:
        type: string
  default_config:
    timeout: 5
    selector: ''
    image_scope: common
    selector_type: image
  enabled: true
  sort_order: 90
- type: drag
  name: 拖拽
  category: action
  description: 从起点拖拽到终点
  schema:
    required:
    - start_selector_type
    - start_selector
    - end_selector_type
    - end_selector
    properties:
      timeout:
        type: number
      duration:
        type: number
      image_scope:
        type: string
      end_selector:
        type: string
      start_selector:
        type: string
      end_selector_type:
        type: string
      start_selector_type:
        type: string
  default_config:
    timeout: 5
    duration: 0.8
    image_scope: common
    end_selector: ''
    start_selector: ''
    end_selector_type: image
    start_selector_type: image
  enabled: true
  sort_order: 100
- type: swipe_to
  name: 滑动到元素
  category: action
  description: 滑动直到目标元素出现
  schema:
    required:
    - target_selector_type
    - target_selector
    properties:
      duration:
        type: number
      interval:
        type: number
      direction:
        type: string
      max_swipes:
        type: number
      image_scope:
        type: string
      target_selector:
        type: string
      target_selector_type:
        type: string
  default_config:
    duration: 0.5
    interval: 0.5
    direction: up
    max_swipes: 5
    image_scope: common
    target_selector: ''
    target_selector_type: image
  enabled: true
  sort_order: 110
- type: assert
  name: 断言
  category: assert
  description: 支持文本/数值/正则/范围/存在性/图片6种断言
  schema:
    required:
    - assert_type
    properties:
      assert_type:
        type: string
      selector_type:
        type: string
      selector:
        type: string
      expected:
        type: string
      match_mode:
        type: string
      min:
        type: number
      max:
        type: number
      expected_exists:
        type: boolean
      image_scope:
        type: string
      expected_image_scope:
        type: string
      image_threshold:
        type: number
      ocr_selector_type:
        type: string
      ocr_selector:
        type: string
  default_config:
    assert_type: text
    selector_type: region
    selector: ''
    expected: ''
    match_mode: contains
    image_scope: common
    expected_image_scope: common
    image_threshold: 0.85
  enabled: true
  sort_order: 50
- type: assert_activity
  name: Activity断言
  category: assert
  description: 校验当前前台APP包名和Activity，适合验证点击后是否进入目标页面
  schema:
    required: []
    properties:
      expected_package:
        type: string
      expected_activity:
        type: string
      match_mode:
        type: string
      timeout:
        type: number
      retry_interval:
        type: number
  default_config:
    expected_package: ''
    expected_activity: ''
    match_mode: contains
    timeout: 5
    retry_interval: 0.5
  enabled: true
  sort_order: 55
- type: foreach_assert
  name: 循环点击断言
  category: assert
  description: 支持期望列表，循环点击并断言匹配（文本/数字/图片）
  schema:
    required:
    - expected_list
    - click_selector_type
    - click_selector
    - ocr_selector_type
    - ocr_selector
    properties:
      timeout:
        type: number
      interval:
        type: number
      max_loops:
        type: number
      match_mode:
        type: string
      assert_type:
        type: string
      image_scope:
        type: string
      ocr_selector:
        type: string
      expected_list:
        type: array
      click_selector:
        type: string
      image_threshold:
        type: number
      ocr_selector_type:
        type: string
      click_selector_type:
        type: string
      expected_image_scope:
        type: string
  default_config:
    timeout: 5
    interval: 0.5
    max_loops: 5
    match_mode: contains
    assert_type: text
    image_scope: common
    ocr_selector: ''
    expected_list: []
    click_selector: ''
    image_threshold: 0.85
    ocr_selector_type: region
    click_selector_type: image
    expected_image_scope: common
  enabled: true
  sort_order: 125
- type: if
  name: 条件分支
  category: control
  description: 根据条件执行分支
  schema:
    required:
    - left
    - operator
    - then_steps
    properties:
      left:
        type: string
      right:
        type: string
      operator:
        type: string
        enum:
        - ==
        - '!='
        - '>'
        - '>='
        - <
        - <=
        - in
        - not in
        - contains
        - not_contains
        - regex
        - truthy
        - falsy
        - startswith
        - endswith
      else_steps:
        type: array
      then_steps:
        type: array
  default_config:
    left: ''
    right: ''
    operator: ==
    else_steps: []
    then_steps: []
  enabled: true
  sort_order: 130
- type: loop
  name: 循环
  category: control
  description: 计数/条件/遍历循环
  schema:
    required:
    - steps
    properties:
      left:
        type: string
      mode:
        type: string
      items:
        type: array
      right:
        type: string
      steps:
        type: array
      times:
        type: number
      interval:
        type: number
      item_var:
        type: string
      operator:
        type: string
      max_loops:
        type: number
      item_scope:
        type: string
  default_config:
    mode: count
    steps: []
    times: 1
    interval: 0
    item_var: item
    max_loops: 10
    item_scope: local
  enabled: true
  sort_order: 140
- type: sequence
  name: 顺序执行
  category: control
  description: 顺序执行子步骤
  schema:
    required:
    - steps
    properties:
      steps:
        type: array
  default_config:
    steps: []
  enabled: true
  sort_order: 150
- type: try
  name: 异常处理
  category: control
  description: try/catch/finally 控制
  schema:
    required:
    - try_steps
    properties:
      error_var:
        type: string
      try_steps:
        type: array
      catch_steps:
        type: array
      error_scope:
        type: string
      finally_steps:
        type: array
  default_config:
    error_var: error
    try_steps: []
    catch_steps: []
    error_scope: local
    finally_steps: []
  enabled: true
  sort_order: 170
