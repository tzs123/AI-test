apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    {{- include "runnergo.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: runnergo-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "runnergo.labels" . | nindent 4 }}
data:
{{- range $k, $v := .Values.configEnv }}
  {{ $k }}: {{ $v | quote }}
{{- end }}