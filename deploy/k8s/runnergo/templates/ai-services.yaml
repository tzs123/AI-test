{{- $ae := index .Values.aiServices "agent-engine" -}}
{{- $ollama := index .Values.aiServices "ollama" -}}
{{- $tfe := index .Values.aiServices "testhub-frontend" -}}
{{- $tbe := index .Values.aiServices "testhub-backend" -}}
{{- $tce := index .Values.aiServices "testhub-celery" -}}
{{- $tsr := index .Values.aiServices "testhub-skill-runner" -}}
{{- $at := index .Values.aiServices "auto-test" -}}
{{/* ===== Ollama (LLM) ===== */}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: {{ .Values.namespace }}
  labels:
    app: ollama
    {{- include "runnergo.labels" . | nindent 4 }}
spec:
  serviceName: ollama
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: {{ $ollama.image }}
        ports:
        - containerPort: 11434
        volumeMounts:
        - name: models
          mountPath: /root/.ollama
      volumes:
      - name: models
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434
    nodePort: {{ $ollama.nodePort }}
  type: NodePort
---
{{/* ===== Agent Engine (Go) ===== */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-engine
  namespace: {{ .Values.namespace }}
  labels:
    app: agent-engine
    {{- include "runnergo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-engine
  template:
    metadata:
      labels:
        app: agent-engine
    spec:
      containers:
      - name: agent-engine
        image: {{ $ae.image }}
        env:
        {{- range $k, $v := $ae.env }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        ports:
        - containerPort: 8088
---
apiVersion: v1
kind: Service
metadata:
  name: agent-engine
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: agent-engine
  ports:
  - port: 8088
    targetPort: 8088
    nodePort: {{ $ae.nodePort }}
  type: NodePort
---
{{/* ===== TestHub Frontend (Nginx) ===== */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testhub-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: testhub-frontend
    {{- include "runnergo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testhub-frontend
  template:
    metadata:
      labels:
        app: testhub-frontend
    spec:
      containers:
      - name: nginx
        image: {{ $tfe.image }}
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
          readOnly: true
        - name: nginx-conf
          mountPath: /usr/share/nginx/html/testhub/index.html
          subPath: frontend-index.html
          readOnly: true
        - name: nginx-conf
          mountPath: /usr/share/nginx/html/testhub/module-nav.js
          subPath: module-nav.js
          readOnly: true
      volumes:
      - name: nginx-conf
        configMap:
          name: runnergo-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: testhub-frontend
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: testhub-frontend
  ports:
  - port: 9999
    targetPort: 80
  type: LoadBalancer
---
{{/* ===== TestHub Backend (Django/Daphne) ===== */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testhub-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: testhub-backend
    {{- include "runnergo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testhub-backend
  template:
    metadata:
      labels:
        app: testhub-backend
    spec:
      containers:
      - name: testhub-backend
        image: {{ $tbe.image }}
        workingDir: /app
        command: ["/app/docker/entrypoint.sh", "daphne", "-b", "0.0.0.0", "-p", "8000", "backend.asgi:application"]
        env:
        {{- range $k, $v := $tbe.env }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: data
          mountPath: /data/testhub
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: testhub-backend
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: testhub-backend
  ports:
  - port: 8000
    targetPort: 8000
  type: LoadBalancer
---
{{/* ===== TestHub Celery Worker ===== */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testhub-celery
  namespace: {{ .Values.namespace }}
  labels:
    app: testhub-celery
    {{- include "runnergo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testhub-celery
  template:
    metadata:
      labels:
        app: testhub-celery
    spec:
      containers:
      - name: celery
        image: {{ $tce.image }}
        workingDir: /app
        command: ["/app/docker/entrypoint.sh", "celery", "-A", "backend.celery", "worker", "--loglevel=INFO"]
        env:
        {{- range $k, $v := $tce.env }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: /data/testhub
      volumes:
      - name: data
        emptyDir: {}
---
{{/* ===== TestHub Skill Runner ===== */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testhub-skill-runner
  namespace: {{ .Values.namespace }}
  labels:
    app: testhub-skill-runner
    {{- include "runnergo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testhub-skill-runner
  template:
    metadata:
      labels:
        app: testhub-skill-runner
    spec:
      containers:
      - name: skill-runner
        image: {{ $tsr.image }}
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: testhub-skill-runner
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: testhub-skill-runner
  ports:
  - port: 8080
    targetPort: 8080
---
{{/* ===== Auto-Test (FastAPI) ===== */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-test
  namespace: {{ .Values.namespace }}
  labels:
    app: auto-test
    {{- include "runnergo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auto-test
  template:
    metadata:
      labels:
        app: auto-test
    spec:
      containers:
      - name: auto-test
        image: {{ $at.image }}
        workingDir: /app
        command: ["uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
        {{- range $k, $v := $at.env }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: data
          mountPath: /data/testhub
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auto-test
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: auto-test
  ports:
  - port: 8000
    targetPort: 8000
