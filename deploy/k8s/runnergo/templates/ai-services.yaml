{{- $ae := index .Values.aiServices "agent-engine" -}}
{{- $ollama := index .Values.aiServices "ollama" -}}
{{- $tfe := index .Values.aiServices "testhub-frontend" -}}
{{- $tbe := index .Values.aiServices "testhub-backend" -}}
{{- $tce := index .Values.aiServices "testhub-celery" -}}
{{- $tsr := index .Values.aiServices "testhub-skill-runner" -}}
{{- $at := index .Values.aiServices "auto-test" -}}
{{/* ===== Ollama (LLM) ===== */}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: {{ .Values.namespace }}
  labels:
    app: ollama
    {{- include "runnergo.labels" . | nindent 4 }}
spec:
  serviceName: ollama
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: {{ $ollama.image }}
        ports:
        - containerPort: 11434
        volumeMounts:
        - name: models
          mountPath: /root/.ollama
      volumes:
      - name: models
        hostPath:
          path: {{ .Values.hostPathRoot }}/ollama/models
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434
    nodePort: {{ $ollama.nodePort }}
  type: NodePort
---
{{/* ===== Agent Engine (Go) ===== */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-engine
  namespace: {{ .Values.namespace }}
  labels:
    app: agent-engine
    {{- include "runnergo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-engine
  template:
    metadata:
      labels:
        app: agent-engine
    spec:
      containers:
      - name: agent-engine
        image: {{ $ae.image }}
        env:
        {{- range $k, $v := $ae.env }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        ports:
        - containerPort: 8088
---
apiVersion: v1
kind: Service
metadata:
  name: agent-engine
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: agent-engine
  ports:
  - port: 8088
    targetPort: 8088
    nodePort: {{ $ae.nodePort }}
  type: NodePort
---
{{/* ===== TestHub Frontend (Nginx) ===== */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testhub-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: testhub-frontend
    {{- include "runnergo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testhub-frontend
  template:
    metadata:
      labels:
        app: testhub-frontend
    spec:
      containers:
      - name: nginx
        image: {{ $tfe.image }}
        ports:
        - containerPort: 80
        volumeMounts:
        - name: testhub-src
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
          readOnly: true
        - name: testhub-src
          mountPath: /usr/share/nginx/html/testhub/index.html
          subPath: frontend-index.html
          readOnly: true
        - name: testhub-src
          mountPath: /usr/share/nginx/html/testhub/module-nav.js
          subPath: module-nav.js
          readOnly: true
      volumes:
      - name: testhub-src
        hostPath:
          path: {{ .Values.hostPathRoot }}/testhub
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: testhub-frontend
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: testhub-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: {{ $tfe.nodePort }}
  type: NodePort
---
{{/* ===== TestHub Backend (Django/Daphne) ===== */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testhub-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: testhub-backend
    {{- include "runnergo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testhub-backend
  template:
    metadata:
      labels:
        app: testhub-backend
    spec:
      containers:
      - name: testhub-backend
        image: {{ $tbe.image }}
        workingDir: /app
        command: ["/app/docker/entrypoint.sh", "daphne", "-b", "0.0.0.0", "-p", "8000", "backend.asgi:application"]
        env:
        {{- range $k, $v := $tbe.env }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: src-backend
          mountPath: /app/backend
        - name: src-apps
          mountPath: /app/apps
        - name: data
          mountPath: /data/testhub
        - name: media
          mountPath: /app/media
        - name: static-files
          mountPath: /app/static_files
        - name: logs
          mountPath: /app/logs
        - name: tools
          mountPath: /app/tools
          readOnly: true
      volumes:
      - name: src-backend
        hostPath: { path: {{ .Values.hostPathRoot }}/testhub/backend, type: Directory }
      - name: src-apps
        hostPath: { path: {{ .Values.hostPathRoot }}/testhub/apps, type: Directory }
      - name: data
        hostPath: { path: {{ .Values.hostPathRoot }}/testhub/data, type: DirectoryOrCreate }
      - name: media
        hostPath: { path: {{ .Values.hostPathRoot }}/testhub/data/media, type: DirectoryOrCreate }
      - name: static-files
        hostPath: { path: {{ .Values.hostPathRoot }}/testhub/static_files, type: Directory }
      - name: logs
        hostPath: { path: {{ .Values.hostPathRoot }}/testhub/logs, type: DirectoryOrCreate }
      - name: tools
        hostPath: { path: {{ .Values.hostPathRoot }}/tools, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: testhub-backend
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: testhub-backend
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: {{ $tbe.nodePort }}
  type: NodePort
---
{{/* ===== TestHub Celery Worker ===== */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testhub-celery
  namespace: {{ .Values.namespace }}
  labels:
    app: testhub-celery
    {{- include "runnergo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testhub-celery
  template:
    metadata:
      labels:
        app: testhub-celery
    spec:
      containers:
      - name: celery
        image: {{ $tce.image }}
        workingDir: /app
        command: ["/app/docker/entrypoint.sh", "celery", "-A", "backend.celery", "worker", "--loglevel=INFO"]
        env:
        {{- range $k, $v := $tce.env }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        volumeMounts:
        - name: src-backend
          mountPath: /app/backend
        - name: src-apps
          mountPath: /app/apps
        - name: data
          mountPath: /data/testhub
        - name: logs
          mountPath: /app/logs
        - name: tools
          mountPath: /app/tools
          readOnly: true
      volumes:
      - name: src-backend
        hostPath: { path: {{ .Values.hostPathRoot }}/testhub/backend, type: Directory }
      - name: src-apps
        hostPath: { path: {{ .Values.hostPathRoot }}/testhub/apps, type: Directory }
      - name: data
        hostPath: { path: {{ .Values.hostPathRoot }}/testhub/data, type: DirectoryOrCreate }
      - name: logs
        hostPath: { path: {{ .Values.hostPathRoot }}/testhub/logs, type: DirectoryOrCreate }
      - name: tools
        hostPath: { path: {{ .Values.hostPathRoot }}/tools, type: Directory }
---
{{/* ===== TestHub Skill Runner ===== */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testhub-skill-runner
  namespace: {{ .Values.namespace }}
  labels:
    app: testhub-skill-runner
    {{- include "runnergo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testhub-skill-runner
  template:
    metadata:
      labels:
        app: testhub-skill-runner
    spec:
      containers:
      - name: skill-runner
        image: {{ $tsr.image }}
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: testhub-skill-runner
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: testhub-skill-runner
  ports:
  - port: 8080
    targetPort: 8080
---
{{/* ===== Auto-Test (FastAPI) ===== */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-test
  namespace: {{ .Values.namespace }}
  labels:
    app: auto-test
    {{- include "runnergo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auto-test
  template:
    metadata:
      labels:
        app: auto-test
    spec:
      containers:
      - name: auto-test
        image: {{ $at.image }}
        workingDir: /app
        command: ["uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
        {{- range $k, $v := $at.env }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: src-backend
          mountPath: /app/backend
        - name: src-config
          mountPath: /app/config
        - name: src-core
          mountPath: /app/core
        - name: src-pages
          mountPath: /app/pages
        - name: src-templates
          mountPath: /app/templates
        - name: src-tests
          mountPath: /app/tests
        - name: src-cases
          mountPath: /app/cases
        - name: logs
          mountPath: /app/logs
        - name: reports
          mountPath: /app/reports
        - name: runtime
          mountPath: /app/runtime
        - name: screenshots
          mountPath: /app/screenshots
        - name: uploads
          mountPath: /app/uploads
        - name: tools
          mountPath: /app/tools
        - name: testhub-data
          mountPath: /data/testhub
      volumes:
      - name: src-backend
        hostPath: { path: {{ .Values.hostPathRoot }}/auto-test/backend, type: Directory }
      - name: src-config
        hostPath: { path: {{ .Values.hostPathRoot }}/auto-test/config, type: Directory }
      - name: src-core
        hostPath: { path: {{ .Values.hostPathRoot }}/auto-test/core, type: Directory }
      - name: src-pages
        hostPath: { path: {{ .Values.hostPathRoot }}/auto-test/pages, type: Directory }
      - name: src-templates
        hostPath: { path: {{ .Values.hostPathRoot }}/auto-test/templates, type: Directory }
      - name: src-tests
        hostPath: { path: {{ .Values.hostPathRoot }}/auto-test/tests, type: Directory }
      - name: src-cases
        hostPath: { path: {{ .Values.hostPathRoot }}/auto-test/cases, type: Directory }
      - name: logs
        hostPath: { path: {{ .Values.hostPathRoot }}/auto-test/logs, type: DirectoryOrCreate }
      - name: reports
        hostPath: { path: {{ .Values.hostPathRoot }}/auto-test/reports, type: DirectoryOrCreate }
      - name: runtime
        hostPath: { path: {{ .Values.hostPathRoot }}/auto-test/runtime, type: DirectoryOrCreate }
      - name: screenshots
        hostPath: { path: {{ .Values.hostPathRoot }}/auto-test/screenshots, type: DirectoryOrCreate }
      - name: uploads
        hostPath: { path: {{ .Values.hostPathRoot }}/auto-test/uploads, type: DirectoryOrCreate }
      - name: tools
        hostPath: { path: {{ .Values.hostPathRoot }}/tools, type: Directory }
      - name: testhub-data
        hostPath: { path: {{ .Values.hostPathRoot }}/testhub/data, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata:
  name: auto-test
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: auto-test
  ports:
  - port: 8000
    targetPort: 8000
